{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRules.enabled }}
{{- $apiJob := printf "%s-api.*" (include "llmsafespaces.fullname" .) -}}
{{- $agentdJob := printf ".*agentd.*" -}}
{{- $ctrlJob := printf "%s-controller.*" (include "llmsafespaces.fullname" .) -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "llmsafespaces.fullname" . }}-alerts
  namespace: {{ default .Release.Namespace .Values.monitoring.prometheusRules.namespace }}
  labels:
    {{- include "llmsafespaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with .Values.monitoring.prometheusRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.prometheusRules.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  groups:
    - name: llmsafespaces.api
      rules:
        {{- /* Availability = 1 - 5xx/(total - 4xx).
              4xx are excluded because they are client errors, not
              server availability failures. Critical only — no
              warning tier. `for: 3m` approximates 3-of-5 data
              points at a 1-minute evaluation interval. */}}
        - alert: LLMSafeSpacesLowAvailability
          expr: |
            (
              1 -
              sum(rate(http_requests_total{job=~"{{ $apiJob }}",status=~"5.."}[5m]))
              /
              clamp_min(
                sum(rate(http_requests_total{job=~"{{ $apiJob }}"}[5m]))
                - sum(rate(http_requests_total{job=~"{{ $apiJob }}",status=~"4.."}[5m]))
              , 0.001)
            ) < 0.99
          for: 3m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "LLMSafeSpaces availability below 99%"
            description: >-
              Platform availability (5xx-free of server-handled requests, 4xx excluded)
              is {{ `{{ $value | humanizePercentage }}` }} — below the 99% critical threshold
              for 3 of the last 5 evaluation points. Immediate investigation required.

        - alert: LLMSafeSpacesHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job=~"{{ $apiJob }}"}[5m])) by (le)
            ) > 5
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "LLMSafeSpaces API p99 latency above 5s"
            description: >-
              API p99 latency is {{ `{{ $value | humanizeDuration }}` }} over the last 5 minutes.

        - alert: LLMSafeSpacesHighAuthFailures
          expr: |
            sum(rate(llmsafespaces_auth_failures_total{job=~"{{ $apiJob }}"}[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "LLMSafeSpaces auth failure rate elevated"
            description: >-
              Authentication failures are occurring at {{ `{{ $value | humanize }}` }}/s.
              Check for credential rotation issues or brute-force attempts.

        - alert: LLMSafeSpacesSSEBrokerDroppingEvents
          expr: |
            sum(rate(llmsafespaces_sse_broker_dropped_events_total{job=~"{{ $apiJob }}"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "LLMSafeSpaces SSE broker is dropping events"
            description: >-
              The SSE event broker has dropped {{ `{{ $value | humanize }}` }} events/s over the
              last 5 minutes. Subscribers may not be consuming fast enough.

        # #901 G1/G3/G11 (US-69.11): the three SSE-tracker alerts
        # (SSETrackerWatchesZero, SSETrackerUpstreamSilent,
        # SSETrackerWatchFailing) were deleted with the tracker — the
        # busy-gated usage stream (llmsafespaces_usage_stream_gates) and
        # the browser-refcounted contract stream
        # (llmsafespaces_contract_stream_upstreams) replaced its
        # connections. NO successor alert is defined here deliberately:
        # gates/upstreams held open for a long window is NOT an error
        # (long turns are legal, and Prometheus cannot join a gate gauge
        # against workspace phase to distinguish idle-stuck from busy).
        # The liveness signal successor is the agentd-side seq-stall
        # family from US-69.12 — LLMSafeSpacesSeqStalled,
        # LLMSafeSpacesStalledEntries, LLMSafeSpacesWakeFailures below
        # (a silent upstream manifests as a stalled projection with
        # pending ledger work, which those alerts already correlate).

        # #892 D1: sustained watchdog suppression = chronic starvation or a
        # wedged-but-alive agent (policy: notify, never kill).
        - alert: LLMSafeSpacesWatchdogSuppressing
          expr: |
            sum by (workspace_id) (rate(workspace_watchdog_suppressions_total{job=~"{{ $agentdJob }}"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Health-watchdog suppressing restarts for {{ `{{ $labels.workspace_id }}` }}"
            description: >-
              The watchdog keeps withholding restarts (starved/flat/respawn/unknown) —
              a turn may be hung-but-alive. Check CPU throttling and the suppression
              reason label; per design 0050 D6, escalate to the session owner.

        # #892 D2: busy-flag resets should be rare (orphan healing at
        # generation changes); sustained rate means restart churn.
        - alert: LLMSafeSpacesTrackerBusyResetRate
          expr: |
            sum by (workspace_id) (rate(workspace_tracker_busy_resets_total{job=~"{{ $agentdJob }}"}[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Frequent orphaned busy-flag resets on {{ `{{ $labels.workspace_id }}` }}"
            description: >-
              Busy flags are being cleared at generation changes repeatedly — the
              workspace is restarting often enough to orphan sessions routinely.
              Correlate with workspace_restarts_total.

        # Incident evidence (9 marker writes, 0 landed, stdout-only): any
        # failure is the persistent incident record going dark.
        - alert: LLMSafeSpacesRestartMarkerWriteFailed
          expr: |
            sum(increase(workspace_restart_marker_write_failures_total{job=~"{{ $agentdJob }}"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Restart-reason marker write failed"
            description: >-
              A restart-reason marker failed to persist — post-mortem evidence for
              that restart is lost. Check the workspace PVC and agentd logs.

        # #901 G8: relay injector degraded (free-model fetch terminally
        # failed in the boot window). #910: the injector re-arms on a
        # bounded 5m→30m backoff — a transient outage self-heals within
        # minutes; this firing means watch the re-arm outcomes
        # (llmsafespaces_rearm_outcome_total) for recovery (success) vs
        # persistent failure.
        - alert: LLMSafeSpacesRelayInjectorDegraded
          expr: |
            sum(increase(llmsafespaces_relay_injector_total{job=~"{{ $agentdJob }}", outcome=~"fetch_failed|no_free_models"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Relay injector free-model fetch exhausted"
            description: >-
              The relay injector's boot-window free-model fetch terminally
              failed — free-tier model routing is degraded and the injector
              has entered its bounded re-arm loop (retrying every 5–30m;
              #910). Recovery is automatic once the relay router/catalog
              answers: watch llmsafespaces_rearm_outcome_total{loop="relay_injector"}
              for a success tick. If re-arm failures persist for the pod's
              whole life, check opencode /provider health and the relay
              router.

        {{- /* US-70.3 (#1158 PR-5): a workspace whose secrets delivery is
              divergent for >15m pages — the reconcile loop's backoff
              (capped 10m) plus notify failures must not mask a pod that
              never converges (stale plaintext still being served).
              max by (workspace_id) dedupes the default 2-replica API
              fleet, both of which run the loop.

              Mixed-fleet note (US-70.3 validation M1b): legacy-format
              pods (pre-US-70.2 spawnedRev) never mark this gauge
              divergent — they cannot converge by notify (the old mux
              404s resync) and would page per pod during rollouts. They
              surface via
              llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"}
              and converge with the fleet upgrade (US-70.5 re-points the
              gauge). */}}
        - alert: LLMSafeSpacesSecretsDeliveryDivergent
          expr: |
            max by (workspace_id) (llmsafespaces_secrets_delivery_converged{job=~"{{ $apiJob }}"}) == 0
          for: 15m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Secrets delivery divergent >15m for {{ `{{ $labels.workspace_id }}` }}"
            description: >-
              Workspace {{ `{{ $labels.workspace_id }}` }} has not converged to the stored
              secret revision for over 15 minutes — the pod may be serving stale or
              revoked plaintext. Check the reconcile loop logs (notify failures,
              pull_failed/pull_unauthorized reasons) and the workspace's
              secretsDelivery status. Legacy-format (pre-US-70.2) pods never trip
              this alert: they surface via
              llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"}
              and converge with the fleet upgrade (US-70.5).

        {{- /* US-70.3 SLO (#1158 PR-5): <99% of Active workspaces converged
              over 5m windows. max by (workspace_id) dedupes replicas
              before the ratio; the count guard keeps an empty/idle fleet
              from firing on 0/0. */}}
        - alert: LLMSafeSpacesSecretsConvergenceSLOBurn
          expr: |
            (
              sum(max by (workspace_id) (llmsafespaces_secrets_delivery_converged{job=~"{{ $apiJob }}"}))
              /
              count(max by (workspace_id) (llmsafespaces_secrets_delivery_converged{job=~"{{ $apiJob }}"}))
            ) < 0.99
            and on() (count(max by (workspace_id) (llmsafespaces_secrets_delivery_converged{job=~"{{ $apiJob }}"})) > 0)
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Secrets delivery convergence SLO burn (<99% over 5m)"
            description: >-
              Only {{ `{{ $value | humanizePercentage }}` }} of Active workspaces are converged —
              below the 99% SLO for 5m. Fleet-wide divergence usually means the API's
              reconcile loop, the pods' resync endpoint, or the bootstrap pull path is
              unhealthy; correlate with llmsafespaces_secrets_notify_total outcomes.

        {{- /* US-70.4 (#1208): a verify-after-write failure or a W9 source
              disagreement means the reconciler refused to commit a wrap it
              could not prove correct — should-never-fire (the halt gauge
              below catches the spike). Emitted by the API service
              (api/internal/services/keyrewrap). */}}
        - alert: LLMSafeSpacesKeyRewrapVerifyFailures
          expr: |
            sum(increase(llmsafespaces_key_rewrap_rows_total{job=~"{{ $apiJob }}", outcome=~"verify_failed|source_disagreement"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Key re-wrap reconciler refused to commit unverified wraps"
            description: >-
              Re-wrap attempts failed verify-after-write or source agreement in the
              last 10m. Rows were left untouched by design — investigate the master
              KEK health and the session-cache DEK source before the halt threshold
              trips.

        {{- /* US-70.3 loop health: no successful reconcile pass in 3x the
              default 60s period (LLMSAFESPACES_SECRETS_RECONCILE_INTERVAL
              overrides the period — scale the threshold accordingly). The
              reconcile loop is the correctness path; a dead loop means
              divergence never heals silently. The absent() arm fires when
              the gauge never existed at all (loop dead since boot). */}}
        - alert: LLMSafeSpacesSecretsReconcileStalled
          expr: |
            (time() - max(llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job=~"{{ $apiJob }}"})) > 180
            or absent(llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job=~"{{ $apiJob }}"})
          for: 5m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Secrets reconcile loop stalled"
            description: >-
              The secrets-delivery reconcile loop has not completed a successful pass
              in over 3 minutes (3x the default period) — or has never reported one.
              Divergent workspaces will not converge until it recovers. Check the
              API's K8s client and the loop's error logs.

        {{- /* US-70.4: the reconciler halted its batch walk this pass (≥3
              verify failures) — blast-radius control engaged. Sustained
              halting means the fleet-wide-corruption guard is keeping the
              reconciler from writing at all; the underlying provider/key
              problem needs an operator. */}}
        - alert: LLMSafeSpacesKeyRewrapHalted
          expr: |
            max(llmsafespaces_key_rewrap_halted{job=~"{{ $apiJob }}"}) > 0
          for: 5m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Key re-wrap reconciler halted"
            description: >-
              The user_keys re-wrap reconciler has been halted for 5m — verify-after-write
              failures reached the blast-radius threshold and further batches are
              being skipped. The KEK/provider that produced non-round-tripping wraps
              must be investigated; heals resume on the next pass once it recovers.

        {{- /* US-70.4: rows that recover from no source (owner offline, no
              session) or have no secret to verify against. Chronic-state
              style (like LLMSafeSpacesLegacyAPIKeysRemaining): info-tier,
              sustained window — per-user strand signal, not a page. The
              per-user detail is in secret_audit_log
              (action=key_rewrap_unwrappable). */}}
        - alert: LLMSafeSpacesKeyRewrapUnwrappable
          expr: |
            sum(increase(llmsafespaces_key_rewrap_rows_total{job=~"{{ $apiJob }}", outcome=~"unwrappable_no_source|unwrappable_no_secret"}[1h])) > 0
          for: 1h
          labels:
            severity: info
            component: api
          annotations:
            summary: "user_keys rows surfaced unwrappable"
            description: >-
              user_keys rows could not be healed in the last hour — no recovery
              source (owner offline, no session) or no secret to verify a recovered
              DEK against (never healed unverified, by design). Check
              secret_audit_log action=key_rewrap_unwrappable for the affected users.

        {{- /* ── Epic-71 / 0c-alerts (#1312 alerts wave) ───────────────────
              Metric contract (verified against the emitters — do not edit
              names/labels from memory):
                llmsafespaces_canary_probe_outcomes_total{class,leg,outcome}
                  api/internal/services/canary/metrics.go:12 — legs
                  snapshot|resolve (canary.go:70-71); outcomes per
                  canary.go:86-101. resolve/not_found_error = S6 VIOLATED;
                  timeout (any leg) = wedge; no_target/pick_error/unresolved_target
                  = targeting failures, not pod verdicts; canceled =
                  rolling-restart noise (never pages).
                llmsafespaces_canary_probe_duration_seconds{class,leg}
                  metrics.go:17 — buckets 0.005..5; the resolve leg is the
                  L2 surface (DefaultTimeout 2s == the L2 bound, canary.go:63).
                llmsafespaces_loop_last_run_timestamp_seconds{loop}
                  pkg/obs/loopliveness.go:23 — loops reconcile_watchdog
                  (agentd, 15s ReconcileCadence), outbox_parked_sweeper
                  (API, 60s ParkedSweepInterval), canary_probe (API, 60s
                  default interval, LLMSAFESPACES_CANARY_INTERVAL).

              DARK-CANARY INVARIANT: prod runs api.canary.enabled=false —
              zero canary series exist and every canary alert below is
              structurally silent (no absent() arms on canary metrics;
              increase/rate/histogram_quantile over absent series yield no
              alertable vectors). The promtool suite pins this per alert.
              L3/L4 bounds are NOT canary-measurable (synthetic ids never
              diverge); their enforcement lives in the fault-matrix
              harness — see the ops note in MONITORING-OPERATIONAL.md. */}}
        {{- /* S6 immediate, page-on-any: absence surfaced as an error
              instead of resolving (safety invariant — every occurrence
              is a bug). for: 0m per #1312's "S- violation (immediate)";
              the 10m increase window absorbs counter re-reads. */}}
        - alert: LLMSafeSpacesCanaryS6Violation
          expr: |
            sum by (class) (
              increase(llmsafespaces_canary_probe_outcomes_total{job=~"{{ $apiJob }}", leg="resolve", outcome="not_found_error"}[10m])
            ) > 0
          for: 0m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Canary S6 violation — resolve-by-absence errored (class {{ `{{ $labels.class }}` }})"
            description: >-
              The canary's resolve leg recorded not_found_error outcomes in the last 10m
              for class {{ `{{ $labels.class }}` }} — absence surfaced as an error instead of
              resolving (S6 violated, the pre-1a baseline; every occurrence is a bug). Check
              the class's target pod resolve path and the Canary & Loop Liveness dashboard row.

        {{- /* The wedge signal (the canary's primary quarry), ANY leg by
              design (a hung GetSnapshot pages exactly like a hung
              resolve): 3+ timeouts in 10m per class/leg, held 10m. At
              the default cadence one probe per class/leg/PASS reaches 3
              only after ≥3 failed passes on one replica (or one bad
              fleet-wide pass on a ≥3-replica deployment — per-replica
              counters; a fleet-wide wedge paging there is correct).
              A single-replica blip never reaches the threshold. */}}
        - alert: LLMSafeSpacesCanaryProbeTimeouts
          expr: |
            sum by (class, leg) (
              increase(llmsafespaces_canary_probe_outcomes_total{job=~"{{ $apiJob }}", outcome="timeout"}[10m])
            ) >= 3
          for: 10m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Canary probe timeouts sustained (class {{ `{{ $labels.class }}` }}, {{ `{{ $labels.leg }}` }} leg)"
            description: >-
              The canary recorded 3+ timeout outcomes in the last 10m (class
              {{ `{{ $labels.class }}` }}, {{ `{{ $labels.leg }}` }} leg) — the wedge signal: probe attempts
              repeatedly exceeded the 2s per-leg budget. Check the class's target pod for a
              hung agent/harness; correlate with the seq-stall and watchdog alerts.

        {{- /* L2 breach, burn-rate NOT per-sample (#1312's rollout rule):
              resolve-leg p99 against the 2s L2 resolve bound over a 10m
              window, held 15m — for > window makes a single slow probe
              structurally unable to fire. Timeouts land in the (1, 2.5]
              bucket (DefaultTimeout 2s), so a wedged class interpolates
              p99 ≈ 2.485s > 2. The snapshot leg keeps the I12 250ms
              budget on the dashboard, not an alert (not an #1312 L bound). */}}
        - alert: LLMSafeSpacesCanaryResolveL2Burn
          expr: |
            histogram_quantile(0.99,
              sum by (class, le) (
                rate(llmsafespaces_canary_probe_duration_seconds_bucket{job=~"{{ $apiJob }}", leg="resolve"}[10m])
              )
            ) > 2
          for: 15m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Canary resolve-leg p99 above the L2 budget (class {{ `{{ $labels.class }}` }})"
            description: >-
              The canary resolve-leg p99 is {{ `{{ $value | humanizeDuration }}` }} over the last 10m — above
              the 2s L2 resolve bound (#1312). Burn, not per-sample: a single slow probe
              cannot trip this (the 15m hold exceeds the 10m window). Check the class's
              target pod and recent deploys.

        {{- /* False-coverage guard (chronic-state, info-tier): a configured
              class that never finds a target workspace asserts nothing.
              values.yaml promises one Active workspace per class at flip
              time; sustained no_target means that promise broke (typo'd
              class, fleet shape changed) — worth knowing, not a page.
              Window 30m < for 1h: transient no-target stretches (mass
              suspend) stay silent. */}}
        - alert: LLMSafeSpacesCanaryNoTarget
          expr: |
            sum by (class) (
              increase(llmsafespaces_canary_probe_outcomes_total{job=~"{{ $apiJob }}", outcome="no_target"}[30m])
            ) > 0
          for: 1h
          labels:
            severity: info
            component: api
          annotations:
            summary: "Canary class never finds a target workspace (class {{ `{{ $labels.class }}` }})"
            description: >-
              Every probe pass for class {{ `{{ $labels.class }}` }} records no_target — the canary knob is
              on but this class has no Active workspace, so it asserts nothing (false
              coverage). Point api.canary.classes at a runtime environment with a live
              workspace, or drop the class.

        {{- /* Dead-loop detection (1/3): the canary runner itself. NO
              absent() arm — a DISABLED canary exports no series and must
              look dark, not stale (the flip arms this alert). Budget 5m =
              5x the 60s default interval; scale with
              LLMSAFESPACES_CANARY_INTERVAL (a pass is classes x ~4s
              worst-case sequential). Per-instance: each API replica runs
              the loop; one wedged replica must not be masked by a live
              one. */}}
        - alert: LLMSafeSpacesLoopCanaryProbeStale
          expr: |
            (time() - llmsafespaces_loop_last_run_timestamp_seconds{job=~"{{ $apiJob }}", loop="canary_probe"}) > 300
          for: 5m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "Canary probe loop stale ({{ `{{ $value | humanizeDuration }}` }} since last pass)"
            description: >-
              The canary_probe loop has not completed a pass in {{ `{{ $value | humanizeDuration }}` }} (budget
              5m = 5x the default 60s interval — scale with LLMSAFESPACES_CANARY_INTERVAL).
              The probe runner is wedged or the API replica lost its ticker; canary
              coverage is dark until it recovers.

        {{- /* Dead-loop detection (2/3): the parked-error sweeper rides the
              outbox Run loop (wired wherever the Redis-backed cache
              service is active — app.go's SetOutbox sits inside the
              *cache.Service assertion; the InMemoryStore dev fallback
              never wires the outbox and would trip the absent arm, a
              dev-only false page), so it HAS an absent() arm: a fleet
              that never stamped once is dead since boot (the
              SecretsReconcileStalled pattern). Budget 3m = 3x the 60s
              ParkedSweepInterval. Parked entries not re-arming = the
              S3-adjacent strand path going silent. */}}
        - alert: LLMSafeSpacesLoopParkedSweeperStale
          expr: |
            (time() - llmsafespaces_loop_last_run_timestamp_seconds{job=~"{{ $apiJob }}", loop="outbox_parked_sweeper"}) > 180
            or absent(llmsafespaces_loop_last_run_timestamp_seconds{job=~"{{ $apiJob }}", loop="outbox_parked_sweeper"})
          for: 5m
          labels:
            severity: critical
            component: api
          annotations:
            summary: "Outbox parked-error sweeper loop stale or absent"
            description: >-
              The outbox_parked_sweeper loop has not completed a pass in over 3m (3x the
              60s ParkedSweepInterval) — or never stamped at all (dead since boot; the
              absent arm). Parked user-visible errors will not re-arm or resolve until
              the API outbox Run loop recovers.

    - name: llmsafespaces.controller
      rules:
        # #863: page-on-any. The counter increments once per failure
        # episode (not per restart), so any increase means a workspace
        # refused to exec a tampered/mismatched agentd binary — rollout
        # drift, node corruption, or an integrity attack. All three
        # warrant waking someone.
        - alert: LLMSafeSpacesAgentdVerificationFailed
          expr: |
            sum by (outcome) (increase(llmsafespaces_workspace_agentd_verify_failures_total{job=~"{{ $ctrlJob }}"}[1h])) > 0
          for: 0m
          labels:
            severity: critical
            component: controller
          annotations:
            summary: "LLMSafeSpaces agentd binary verification failed"
            description: >-
              {{ `{{ $labels.outcome }}` }}: a workspace entrypoint refused to exec the
              pinned agentd binary (sha256 mismatch or missing overlay). This is a
              should-never-fire signal. Check the workspace's AgentdVerified condition
              and the AgentdVerificationFailed event (expected vs observed digest);
              an observed digest matching a known agentd version indicates rollout
              drift, an unknown digest indicates tampering or corruption.

        # Design 0053 §4.2: page-on-any, same semantics as the agentd
        # counter above — one increment means a workspace supervisor
        # refused to spawn the pinned opencode binary (rollout drift,
        # node corruption, or tampering).
        - alert: LLMSafeSpacesOpencodeVerificationFailed
          expr: |
            sum by (outcome) (increase(llmsafespaces_workspace_opencode_verify_failures_total{job=~"{{ $ctrlJob }}"}[1h])) > 0
          for: 0m
          labels:
            severity: critical
            component: controller
          annotations:
            summary: "LLMSafeSpaces opencode binary verification failed"
            description: >-
              {{ `{{ $labels.outcome }}` }}: a workspace supervisor refused to spawn the
              pinned opencode binary (sha256 mismatch or missing overlay). This is a
              should-never-fire signal. Check the workspace's OpencodeVerified condition
              and the OpencodeVerificationFailed event (expected vs observed digest);
              an observed digest matching a known opencode version indicates rollout
              drift, an unknown digest indicates tampering or corruption.

        - alert: LLMSafeSpacesReconciliationErrors
          expr: |
            sum(rate(llmsafespaces_reconciliation_errors_total{job=~"{{ $ctrlJob }}"}[10m])) > 0.01
          for: 10m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "LLMSafeSpaces reconciliation error rate elevated"
            description: >-
              Reconciliation errors are occurring at {{ `{{ $value | humanize }}` }}/s.
              Check controller logs for error_type breakdown.

        # #760: replaces LLMSafeSpacesWorkspaceFailures, which queried the
        # retired llmsafespaces_workspaces_failed_total — a counter whose
        # only writer was SafeMode entry (worklog 0377 H7), i.e. it
        # already measured recovery exhaustion, mislabeled. The new
        # counter is the same signal under its honest name.
        - alert: LLMSafeSpacesWorkspaceFailures
          expr: |
            sum(increase(llmsafespaces_workspace_recovery_exhausted_total{job=~"{{ $ctrlJob }}"}[1h])) > 0
          for: 1m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "LLMSafeSpaces recovery exhausted"
            description: >-
              {{ `{{ $value }}` }} recovery episode(s) crossed their exhaustion threshold in the last hour.
              Check failure_class label for root cause; suspend the workspace (spec.suspend=true) to halt the loop.

        - alert: LLMSafeSpacesWorkspaceCreationSlow
          expr: |
            histogram_quantile(0.99,
              sum(rate(llmsafespaces_workspace_create_duration_seconds_bucket{job=~"{{ $ctrlJob }}"}[15m])) by (le)
            ) > 120
          for: 10m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "LLMSafeSpaces workspace creation taking over 2 minutes (p99)"
            description: >-
              Workspace creation p99 latency is {{ `{{ $value | humanizeDuration }}` }}.
              Users may experience long waits when creating workspaces.

        - alert: LLMSafeSpacesRecoveryBackoffHigh
          expr: |
            histogram_quantile(0.99,
              sum(rate(llmsafespaces_workspace_recovery_backoff_duration_seconds_bucket{job=~"{{ $ctrlJob }}"}[15m])) by (le)
            ) > 600
          for: 15m
          labels:
            severity: warning
            component: controller
          annotations:
            summary: "LLMSafeSpaces recovery backoff duration above 10 minutes"
            description: >-
              Recovery backoff p99 is {{ `{{ $value | humanizeDuration }}` }}. Workspaces
              are taking a long time to recover from failures.

        # #760: LLMSafeSpacesHighConsecutiveFailures deleted — its query
        # (llmsafespaces_workspace_consecutive_failures_max) referenced a
        # metric with no writer anywhere in the tree (dead since its
        # introduction; discovered while repointing the adjacent stanza).
        # Its intent — "a workspace is stuck in a failure loop" — is now
        # served honestly by the RecoveryExhausted condition + Event +
        # recovery_exhausted_total counter (see LLMSafeSpacesWorkspaceFailures).

        - alert: LLMSafeSpacesStatusUpdateConflicts
          expr: |
            sum(rate(llmsafespaces_workspace_status_update_conflicts_total{job=~"{{ $ctrlJob }}"}[5m])) > 0.1
          for: 10m
          labels:
            severity: info
            component: controller
          annotations:
            summary: "LLMSafeSpaces optimistic lock conflicts on workspace status"
            description: >-
              Status update conflicts occurring at {{ `{{ $value | humanize }}` }}/s. This
              may indicate multiple controllers or high contention.

        - alert: LLMSafeSpacesInitContainerSlow
          expr: |
            histogram_quantile(0.99,
              sum(rate(llmsafespaces_workspace_init_container_duration_seconds_bucket{job=~"{{ $ctrlJob }}"}[15m])) by (le)
            ) > 60
          for: 10m
          labels:
            severity: info
            component: controller
          annotations:
            summary: "LLMSafeSpaces workspace init container taking over 60s (p99)"
            description: >-
              Workspace setup init container p99 is {{ `{{ $value | humanizeDuration }}` }}.
              Large package installations or init scripts may be slow.

    - name: llmsafespaces.agentd
      rules:
        {{- /* llmsafespaces_agent_reload_total is emitted by the API service
              (api/internal/services/metrics/metrics.go:147), not by agentd
              pods. Use $apiJob to match. */}}
        - alert: LLMSafeSpacesAgentReloadFailures
          expr: |
            sum(rate(llmsafespaces_agent_reload_total{job=~"{{ $apiJob }}",result="error"}[5m]))
            /
            sum(rate(llmsafespaces_agent_reload_total{job=~"{{ $apiJob }}"}[5m]))
            > 0.1
          for: 5m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "LLMSafeSpaces agent reload failure rate above 10%"
            description: >-
              {{ `{{ $value | humanizePercentage }}` }} of agent reloads are failing. Credential
              injection or agent restart may be broken.

        {{- /* llmsafespaces_agentd_gate_duration_seconds is emitted by
              workspace-agentd (cmd/workspace-agentd/gate_recorder.go).
              Scraped via the chart's PodMonitor
              (monitoring.serviceMonitors.agentdPodMonitor, default enabled)
              which targets workspace pods' agentd-admin port. Disable that
              PodMonitor and this alert goes dark. */}}
        - alert: LLMSafeSpacesAgentdSlowStartup
          expr: |
            histogram_quantile(0.95,
              sum(rate(llmsafespaces_agentd_gate_duration_seconds_bucket{job=~".*agentd.*",gate="readyz_first_200"}[15m])) by (le)
            ) > 60
          for: 10m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "LLMSafeSpaces agentd startup taking over 60s (p95)"
            description: >-
              Agentd pods are taking {{ `{{ $value | humanizeDuration }}` }} to reach readyz=200
              at p95. Check opencode boot, provider connections, or relay injection.

        {{- /* llmsafespaces_relay_injector_total is emitted ONLY by
              workspace-agentd (cmd/workspace-agentd/relay_injector.go) — the
              API service does NOT emit it. The chart's PodMonitor
              (monitoring.serviceMonitors.agentdPodMonitor) scrapes workspace
              pods with job=<release>-agentd; matching job=~".*agentd.*" makes
              this alert fire on the pod-side data. (Pre-PodMonitor this alert
              was dead — nothing scraped workspace pods.) */}}
        - alert: LLMSafeSpacesRelayInjectorFailures
          expr: |
            sum(increase(llmsafespaces_relay_injector_total{job=~".*agentd.*",outcome=~"config_write_failed|auth_write_failed|unhealthy_timeout"}[1h])) > 0
          for: 1m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "LLMSafeSpaces relay injector failures detected"
            description: >-
              {{ `{{ $value }}` }} relay injector failures in the last hour. Free-tier model
              routing may be broken for affected workspaces.

        {{- /* US-69.12 (design 0055 R5): the starvation signal. Seq stall
              ALONE is not page-worthy — an idle workspace legitimately
              emits no events — so the alert correlates pending work:
              ledgered entries exist AND the projection has not advanced.
              Starvation/wedge differentiation per the S4 exit criteria;
              correlate with CFS throttle data during the soak drill
              (docs/operator/monitoring.md §Session-state alerts). */}}
        - alert: LLMSafeSpacesSeqStalled
          expr: |
            llmsafespaces_seq_stall_seconds{job=~".*agentd.*"} > 300
            and on(workspace_id)
            llmsafespaces_ledger_depth{job=~".*agentd.*",state="ledgered"} > 0
          for: 5m
          labels:
            severity: critical
            component: agentd
          annotations:
            summary: "Session-state seq stalled {{ `{{ $value | humanizeDuration }}` }} with pending ledger work"
            description: >-
              The projection has not advanced for {{ `{{ $value | humanizeDuration }}` }} while ledgered
              entries wait (workspace {{ `{{ $labels.workspace_id }}` }}). In-pod starvation or a wedged
              harness — differentiate via CFS throttling and the watchdog suppression counters, then
              triage per the stranded-entry runbook.

        {{- /* US-69.12: the #1119 silent-strand class, visible. Stalled =
              admitted past the promotion deadline; the stall wake already
              fired (store reseed). Sustained stalls mean the wake did not
              resolve it — escalate to the stranded-entry triage. */}}
        - alert: LLMSafeSpacesStalledEntries
          expr: |
            llmsafespaces_stalled_entries{job=~".*agentd.*"} > 0
          for: 10m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Stalled delivery entries sustained for 10m"
            description: >-
              {{ `{{ $value }}` }} admitted entries crossed the promotion deadline and the stall wake
              has not resolved them. The user-visible turn is stranded (#1119 class) — run the
              stranded-entry triage (GetDeliveryStatus on the ledger, then wake/reseed or replay).

        {{- /* US-69.12: wake-only recovery FAILING is the escalation
              signal (llmsafespaces_wake_failures_total, incremented per
              errored wake attempt by the agentd stall watchdog). */}}
        - alert: LLMSafeSpacesWakeFailures
          expr: |
            sum(increase(llmsafespaces_wake_failures_total{job=~".*agentd.*"}[15m])) > 0
          for: 1m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Stall-wake attempts failing"
            description: >-
              {{ `{{ $value }}` }} stall-wake attempts errored in the last 15m — the store reseed behind
              the wake is failing (opencode unreachable or store read errors). Stalled entries will
              not self-resolve; check the harness and the wake logs.

        {{- /* US-69.12: the send-path budget (US-69.6/69.8). The Deliver
              ack is the 202 equivalent — idempotent fsync'd ledger accept;
              p99 over budget means the send path is degrading (fsync
              latency, WAL contention). */}}
        - alert: LLMSafeSpacesDeliveryLatencyBudget
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(llmsafespaces_delivery_202_latency_seconds_bucket{job=~".*agentd.*"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            component: agentd
          annotations:
            summary: "Delivery ack latency p99 over budget"
            description: >-
              The Deliver-ack (202-equivalent) p99 is {{ `{{ $value | humanizeDuration }}` }} (budget
              1s). Check platform-volume fsync latency and ledger WAL contention — sustained breach
              slows every send on this pod.

        {{- /* Epic-71 / 0c-alerts — dead-loop detection (3/3): the
              session-state reconcile watchdog (#1311), per agentd pod.
              Budget 90s = 6x the 15s cadence (ReconcileCadence =
              LeaseConvergenceBound/2 — at 90s stale the 30s L4/L5 lease
              bound has been dark for three bounds). NO absent() arm,
              unlike the API-side sweeper: agentd pods are ephemeral by
              design (suspend deletes the pod; Prometheus staleness
              marks the series gone) — absent targets are a normal
              fleet state, and only a live-but-not-stamping pod pages.
              Per-instance so a dead pod is never masked by a sibling. */}}
        - alert: LLMSafeSpacesLoopReconcileWatchdogStale
          expr: |
            (time() - llmsafespaces_loop_last_run_timestamp_seconds{job=~"{{ $agentdJob }}", loop="reconcile_watchdog"}) > 90
          for: 2m
          labels:
            severity: critical
            component: agentd
          annotations:
            summary: "Session-state reconcile watchdog stale on {{ `{{ $labels.instance }}` }} ({{ `{{ $value | humanizeDuration }}` }})"
            description: >-
              The reconcile_watchdog loop on agentd instance {{ `{{ $labels.instance }}` }} has not completed
              a pass in {{ `{{ $value | humanizeDuration }}` }} (budget 90s = 6x the 15s cadence, ReconcileCadence =
              LeaseConvergenceBound/2) — S5/S7 convergence and the L4/L5 lease bounds are dark
              for this pod. No absent() arm by design: agentd pods are ephemeral
              (suspend/resume); only a live-but-not-stamping pod pages.

    - name: llmsafespaces.billing
      rules:
        - alert: LLMSafeSpacesHighInferenceCostRate
          expr: |
            sum(rate(llmsafespaces_inference_cost_dollars_total{job=~"{{ $apiJob }}"}[1h])) > 10
          for: 30m
          labels:
            severity: info
            component: billing
          annotations:
            summary: "LLMSafeSpaces inference cost rate above $10/hour"
            description: >-
              Inference spend is running at {{ `{{ $value | printf "$%.2f" }}` }}/hour averaged
              over the last hour. Review model usage patterns if unexpected.

        - alert: LLMSafeSpacesWorkspaceDiskUsageHigh
          expr: |
            (
              llmsafespaces_workspace_disk_used_bytes{job=~"{{ $ctrlJob }}"}
              /
              llmsafespaces_workspace_storage_bytes{job=~"{{ $ctrlJob }}"}
            ) > 0.9
          for: 15m
          labels:
            severity: warning
            component: billing
          annotations:
            summary: "LLMSafeSpaces workspace disk usage above 90%"
            description: >-
              Workspace {{ `{{ $labels.workspace_id }}` }} is using
              {{ `{{ $value | humanizePercentage }}` }} of its allocated storage. The PVC
              may fill up and crash the agent.

        - alert: LLMSafeSpacesLegacyAPIKeysRemaining
          expr: |
            llmsafespaces_api_key_legacy_total{job=~"{{ $ctrlJob }}"} > 0
          for: 1h
          labels:
            severity: info
            component: billing
          annotations:
            summary: "LLMSafeSpaces plaintext API keys still in use"
            description: >-
              {{ `{{ $value }}` }} API keys are still stored in plaintext (pre-migration).
              Complete the key hashing migration to eliminate this security debt.
{{- /* Relay-only key delivery alerts (Epic 72 / US-72.2): the exfil bound
       and the credential-freshness signals. Metadata-only metrics (K7). */}}
{{- if .Values.relayOnlyKeyDelivery.enabled }}
    - name: llmsafespaces.llm-relay
      rules:
        - alert: LlmRelayRouterRejectSpike
          expr: |
            - alert: RelayFallbackDeliveryActive
              expr: increase(relay_fallback_deliveries_total[10m]) > 0
              labels:
                severity: warning
                category: credential-delivery
              annotations:
                summary: "Relay fallback delivery active (migration mode delivering raw keys)"
                description: >-
                  Design 0061 §4 (M2): not-ready relay staging delivered pre-flip raw-key
                  batches in the last 10m. ANY firing means the migration is still live —
                  the staging producer is absent or tokens are expiring faster than
                  renewal. Investigate the controller's arming (the enable line / exit 85)
                  and the staging reconcile. Flip to strict ONLY after 7 consecutive
                  zero-days (docs/runbooks/relay-only-flip.md).
            - alert: RelayDegradedBatchesActive
              expr: increase(relay_degraded_batches_total[10m]) > 0
              labels:
                severity: critical
                category: credential-delivery
              annotations:
                summary: "Fail-closed relay batches (zero LLM credentials delivered)"
                description: >-
                  Design 0061 §4: strict-mode not-ready mutes (or any fail-closed relay
                  degrade) delivered ZERO llm entries in the last 10m — workspaces are
                  losing all LLM providers (the #1548 harm). The fallback counter is
                  silent in strict mode by design; THIS series is the mode-independent
                  detector.
            sum by (workspace) (increase(llm_relay_byo_requests_total{status=~"401|403|429"}[10m])) > 20
          for: 5m
          labels:
            severity: warning
            component: llm-relay
          annotations:
            summary: "BYO relay router rejecting a workspace's requests"
            description: >-
              Workspace {{ `{{ $labels.workspace }}` }} accumulated {{ `{{ $value }}` }}
              rejections (401/403/429) in 10m — check CredentialStale/CredentialRejected
              conditions and quota usage.
        - alert: LlmRelayRouterUpstreamErrors
          expr: |
            sum by (workspace) (increase(llm_relay_byo_requests_total{status=~"5.."}[10m])) > 10
          for: 5m
          labels:
            severity: warning
            component: llm-relay
          annotations:
            summary: "BYO relay router upstream failures"
            description: >-
              Workspace {{ `{{ $labels.workspace }}` }} saw {{ `{{ $value }}` }} upstream-class
              failures in 10m — resolve path or provider availability issue.
{{- end }}

{{- end }}
