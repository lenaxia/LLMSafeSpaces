apiVersion: llmsafespaces.dev/v1
kind: RuntimeEnvironment
metadata:
  name: base
spec:
  {{- if .Values.runtimeEnvironments.base.image.digest }}
  image: "{{ .Values.runtimeEnvironments.base.image.repository }}@{{ .Values.runtimeEnvironments.base.image.digest }}"
  {{- else }}
  {{- if not .Values.runtimeEnvironments.base.image.tag }}
  {{- fail "runtimeEnvironments.base.image.tag is mandatory (design 0053 D5/S4): the base is CalVer YYYY.MM.x from api/internal/imagefactory/catalog.seed.yaml, off the platform release train — the chart must never substitute the platform appVersion (issue #1237, incident 2026-09-02)" }}
  {{- end }}
  image: "{{ .Values.runtimeEnvironments.base.image.repository }}:{{ .Values.runtimeEnvironments.base.image.tag }}"
  {{- end }}
  language: "multi"
  version: "1.0"
