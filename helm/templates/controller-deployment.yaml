{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmsafespaces.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llmsafespaces.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "llmsafespaces.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmsafespaces.controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "llmsafespaces.controller.serviceAccountName" . }}
      {{- with .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        {{- $metricsAddr := .Values.controller.metricsAddr }}
        {{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitors.enabled }}
        {{- $metricsAddr = "0.0.0.0:8080" }}
        {{- end }}
        {{- /* US-43.19 / D20: the in-cluster API service URL the controller
               polls to drive org-level workspace suspension. When
               controller.apiServiceURL is empty the chart derives the default
               from the release name + namespace + API service port so D20 is
               functional out of the box (worklog 0372 / F1). */ -}}
        {{- $apiServiceURL := .Values.controller.apiServiceURL }}
        {{- if not $apiServiceURL }}
        {{- $apiServiceURL = printf "http://%s-api.%s.svc:%v" (include "llmsafespaces.fullname" .) .Release.Namespace .Values.api.service.port }}
        {{- end }}
        - name: manager
          image: {{ include "llmsafespaces.controller.image" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.controller.containerSecurityContext | nindent 12 }}
          args:
            - --metrics-addr={{ $metricsAddr }}
            - --health-probe-bind-address={{ .Values.controller.probeAddr }}
            {{- if .Values.controller.leaderElection.enabled }}
            - --enable-leader-election=true
            {{- end }}
            {{- /* #820 / nightly run 35872827066: under rbac.scope=namespace the
                   ClusterRole/Binding are gone (the workspace-namespace Role
                   covers one namespace), so a cluster-wide manager cache can
                   never sync its informers there (Forbidden LIST/WATCH outside
                   the namespace → "Could not wait for Cache to sync" →
                   CrashLoopBackOff). Derive the cache scope from the
                   workspaceNamespace helper when the operator has not pinned
                   watchNamespaces — the runbook's prescribed cluster→namespace
                   migration path and the chart's own default posture (G5) both
                   depend on it. Cluster scope renders byte-identically (no
                   derivation on that path).
                   WATCH-ALL under namespace scope is INCOHERENT and fails the
                   render loudly (the llm-relay-rbac convention): the guard
                   mirrors the controller's own parseWatchNamespaces — a value
                   containing "*" ANYWHERE (bare, "*,", "*,ns1", "**") either
                   parses to a cluster-wide cache or builds informers for a
                   bogus "*" namespace; a value whose comma-split collapses to
                   ZERO non-empty entries (whitespace-only, ",", " , ", ",,,")
                   ALSO parses to cluster-wide (the nil branch at
                   watch_namespaces.go:38-40); all crashloop identically
                   against namespaced RBAC. The whitespace class is Go
                   TrimSpace's ([[:space:]] + U+0085 + Zs/Zl/Zp). */ -}}
            {{- $wnsRaw := default "" .Values.controller.watchNamespaces | toString }}
            {{- /* rbac.create=false gates the guard: with the chart
                   creating none of the workspace-lifecycle grants (the
                   rbac.create-gated Role/ClusterRole set — the always-created
                   storageclass/relay-safe ClusterRoles aside), grant
                   coherence is the operator's out-of-band contract
                   (self-managed ClusterRole + watch-all is coherent); the
                   guard polices the chart's OWN gated grant posture only. */ -}}
            {{- if and .Values.rbac.create (ne (.Values.rbac.scope | default "namespace") "cluster") (or (contains "*" $wnsRaw) (and (ne $wnsRaw "") (regexMatch "^[[:space:],\\x{85}\\p{Zs}\\p{Zl}\\p{Zp}]*$" $wnsRaw))) }}
            {{- fail (printf "controller.watchNamespaces=%q is invalid under rbac.scope=namespace: it contains \"*\" or collapses to no namespaces, which parses to a cluster-wide cache (or a bogus \"*\" namespace) that cannot sync its informers against namespaced RBAC and the controller will CrashLoopBackOff (nightly run 35872827066). Remedies: set controller.watchNamespaces to namespaces your RBAC actually covers (under namespace scope that is the workspace namespace ONLY — NOT the release namespace), or keep rbac.scope=cluster." .Values.controller.watchNamespaces) }}
            {{- end }}
            {{- if .Values.controller.watchNamespaces }}
            - --watch-namespaces={{ .Values.controller.watchNamespaces }}
            {{- else if not (eq (.Values.rbac.scope | default "namespace") "cluster") }}
            - --watch-namespaces={{ include "llmsafespaces.workspaceNamespace" . }}
            {{- end }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles | default 4 }}
            {{- if and .Values.controller.workspaceTerminationGraceSeconds (ne (int .Values.controller.workspaceTerminationGraceSeconds) 0) }}
            - --workspace-termination-grace-seconds={{ .Values.controller.workspaceTerminationGraceSeconds }}
            {{- end }}
            {{- /* G2 — workspace admission allow-lists. The controller's
                   ValidatingWebhook reads these to gate Spec.Runtime
                   image references and Spec.Storage parameters. Empty
                   allowed-image-registries means "no explicit images
                   allowed" (only RuntimeEnvironment-name references).
                */ -}}
            {{- with .Values.webhooks.allowedImageRegistries }}
            - --allowed-image-registries={{ join "," . }}
            {{- end }}
            {{- with .Values.webhooks.allowedStorageClassNames }}
            - --allowed-storage-class-names={{ join "," . }}
            {{- end }}
            {{- if hasKey .Values.webhooks "maxWorkspaceStorageGi" }}
            - --max-workspace-storage-gi={{ .Values.webhooks.maxWorkspaceStorageGi }}
            {{- end }}
            {{- if hasKey .Values.webhooks "maxWorkspaceCPUMillicores" }}
            - --max-workspace-cpu-millicores={{ .Values.webhooks.maxWorkspaceCPUMillicores }}
            {{- end }}
            {{- if hasKey .Values.webhooks "maxWorkspaceMemoryMi" }}
            - --max-workspace-memory-mi={{ .Values.webhooks.maxWorkspaceMemoryMi }}
            {{- end }}
            {{- if .Values.controller.inferenceRelay.enabled }}
            {{- /* Fleet enabled: workspace pods route through the in-cluster
                   relay-router (Design Principle 6, Epic 42). Post-WG-removal
                   (worklog 0442) the router reaches relay VMs over HTTP with
                   per-VM token auth, so --inference-relay-secret is omitted
                   here (the controller never sets InferenceRelaySecret in
                   fleet mode; per-VM tokens are managed by the router).
                   The URL MUST be the cross-namespace FQDN: workspace pods
                   may run in any namespace the cache watches (cluster-wide
                   under rbac.scope=cluster; the workspace namespace under
                   the default namespace scope — see the derivation above),
                   while the relay-router Service lives in the
                   release namespace — a short name would fail to resolve
                   cross-ns. workspaceRouterURL overrides for the
                   separate-ns-router case. */}}
            - --inference-relay-url={{ .Values.controller.inferenceRelay.workspaceRouterURL | default (printf "http://relay-router.%s.svc.cluster.local:8080" .Release.Namespace) }}
            {{- end }}
            {{- if .Values.controller.inferenceRelay.enabled }}
            - --enable-inference-relay=true
            - --relay-router-url={{ .Values.controller.inferenceRelay.routerURL | default "http://relay-router:8080" }}
            - --relay-artifact-url={{ join "," .Values.controller.inferenceRelay.artifact.urls }}
            - --relay-artifact-sha256-arm64={{ .Values.controller.inferenceRelay.artifact.sha256Arm64 | required "controller.inferenceRelay.artifact.sha256Arm64 is required when inferenceRelay.enabled (the arm64 relay-proxy binary checksum — see Makefile relay-bin target)" }}
            - --relay-artifact-sha256-amd64={{ .Values.controller.inferenceRelay.artifact.sha256Amd64 | required "controller.inferenceRelay.artifact.sha256Amd64 is required when inferenceRelay.enabled (the amd64 relay-proxy binary checksum — see Makefile relay-bin target)" }}
            {{- end }}
            {{- /* 2026-06-23 cold-start optimization (item #1a): publish the
                    free-models catalog as a ConfigMap so workspace pods can
                    pre-render their relay agent-config.json before opencode
                    boots. Defaults to enabled. */}}
            {{- if hasKey .Values.controller "freeModelsRefresher" }}
            {{- if not .Values.controller.freeModelsRefresher.enabled }}
            - --enable-free-models-refresher=false
            {{- end }}
            {{- with .Values.controller.freeModelsRefresher.refreshInterval }}
            - --free-models-refresh-interval={{ . }}
            {{- end }}
            {{- with .Values.controller.freeModelsRefresher.apiURL }}
            - --free-models-api-url={{ . }}
            {{- end }}
            {{- end }}
            {{/* F1 (worklog 0372): wire --api-service-url so org-suspension is
                  functional in Helm deployments. The internal-token env below
                  authenticates the controller→API call (the endpoint fails
                  closed without it). */}}
            - --api-service-url={{ $apiServiceURL }}
            {{- /* Epic 72 / US-72.3 (design 0058): relay-only key delivery.
                    One flag enables the controller staging pass; the same
                    Service URL serves the router's internal mint/rotate API
                    and the workspace-facing router URL staged into tokens.
                    The controller FAILS LOUD at startup when the flag is on
                    without a reachable, bootstrapped router (values gate:
                    an enabled release with no router URL refuses to RENDER,
                    so the misconfiguration surfaces at install time, one
                    step earlier than the runtime guard). */}}
            {{- if .Values.relayOnlyKeyDelivery.enabled }}
            {{- $relayURL := .Values.relayOnlyKeyDelivery.workspaceRouterURL | default "" }}
            {{- if not $relayURL }}
            {{- fail "relayOnlyKeyDelivery.enabled requires relayOnlyKeyDelivery.workspaceRouterURL (the llm-relay router Service URL)" }}
            {{- end }}
            - --relay-only-key-delivery=true
            - --llm-relay-router-url={{ $relayURL }}
            - --llm-relay-namespace={{ .Values.relayOnlyKeyDelivery.namespace | default "llm-relay" }}
            - --relay-token-ttl={{ .Values.relayOnlyKeyDelivery.tokenTTL | default "24h" }}
            {{- end }}
            {{- /* Epic 66 Phase 1: per-workspace preview origins. When
                    previewOrigin is enabled the controller stamps
                    PREVIEW_ORIGIN_BASE_DOMAIN into workspace pods so
                    agentd's dev_preview_url tool emits the bootstrap URL
                    (same chart values the API consumes — one flag enables
                    the deployment-wide mode). */}}
            {{- if .Values.previewOrigin.enabled }}
            - --preview-origin-base-domain={{ .Values.previewOrigin.baseDomain }}
            {{- end }}
            {{- /* #1332: the PUBLIC API origin for user-facing dev-preview
                    URLs (LLMSAFESPACE_API_PUBLIC_URL on workspace pods).
                    Optional — when previewOrigin is enabled the controller
                    derives https://api.<baseDomain>; set this explicitly when
                    the public origin differs from that convention (e.g.
                    path-mode-only deployments behind a non-default domain). */}}
            {{- with .Values.controller.apiPublicURL }}
            - --api-public-url={{ . }}
            {{- end }}
            {{- /* Epic 51 S51.1: default RuntimeClass for workspace pods.
                    Set to "gvisor" when .Values.gvisor.enabled is true.
                    Empty means runc (default K8s runtime, used in dev/single-tenant). */}}
            {{- if .Values.gvisor.enabled }}
            - --default-runtime-class={{ .Values.gvisor.defaultRuntimeClass | default "gvisor" }}
            {{- end }}
            {{- /* #863: agentd overlay delivery (image volume).
                    The NORMAL pin is image-only (repo:tag@sha256:digest —
                    the single Renovate-updatable coordinate; the binary
                    sha256s resolve from the image index annotations at
                    controller startup). binarySHA256* are optional
                    per-image overrides: set BOTH or NEITHER — one-sided
                    renders fail below. Hashes without an image fail
                    (they are overrides). Empty-everything (legacy mode)
                    renders nothing. */}}
            {{- /* Design 0053 §4.5 (S3): BOTH delivery pins are
                    MANDATORY — the base image carries no platform
                    binaries, so an unpinned controller would build pods
                    that PATH-look up binaries that no longer exist.
                    Empty image fails the render here and fails
                    controller startup (ValidateAgentdDelivery/
                    ValidateOpencodeDelivery) — same operator hint from
                    both surfaces. */}}
            {{- if not .Values.controller.agentdDelivery.image }}
            {{- fail "controller.agentdDelivery.image is mandatory (design 0053 §4.5 — no baked fallback; pin the digest-pinned agentd delivery image)" }}
            {{- end }}
            {{- if not .Values.controller.opencodeDelivery.image }}
            {{- fail "controller.opencodeDelivery.image is mandatory (design 0053 §4.5 — no baked fallback; pin the digest-pinned opencode delivery image)" }}
            {{- end }}
            {{- if and (not .Values.controller.agentdDelivery.image) (or .Values.controller.agentdDelivery.binarySHA256Amd64 .Values.controller.agentdDelivery.binarySHA256Arm64) }}
            {{- fail "controller.agentdDelivery.image is required when binarySHA256* values are set (they are per-image overrides)" }}
            {{- end }}
            {{- if and .Values.controller.agentdDelivery.image (ne (len .Values.controller.agentdDelivery.binarySHA256Amd64) 0) (eq (len .Values.controller.agentdDelivery.binarySHA256Arm64) 0) }}
            {{- fail "controller.agentdDelivery.binarySHA256*: set BOTH hashes or NEITHER (image-only resolves them from the index annotations)" }}
            {{- end }}
            {{- if and .Values.controller.agentdDelivery.image (ne (len .Values.controller.agentdDelivery.binarySHA256Arm64) 0) (eq (len .Values.controller.agentdDelivery.binarySHA256Amd64) 0) }}
            {{- fail "controller.agentdDelivery.binarySHA256*: set BOTH hashes or NEITHER (image-only resolves them from the index annotations)" }}
            {{- end }}
            {{- if and .Values.controller.agentdSidecar.enabled (not .Values.controller.agentdDelivery.image) }}
            {{- fail "controller.agentdSidecar.enabled requires controller.agentdDelivery.image (the sidecar runs the digest-pinned delivery artifact)" }}
            {{- end }}
            {{- if .Values.controller.agentdSidecar.enabled }}
            - --agentd-sidecar=true
            {{- end }}
            {{- /* Design 0060 PR 2.5: upload-staging knobs as the
                   controller's k=v flag (only non-zero fields render;
                   all-zero renders nothing = agentd defaults). */}}
            {{- $us := .Values.controller.agentdSidecar.uploadStaging }}
            {{- $kv := list }}
            {{- if gt ($us.budgetBytes | int) 0 }}
            {{- $kv = append $kv (printf "budget=%d" ($us.budgetBytes | int)) }}
            {{- end }}
            {{- /* floor: >0 renders the value; -1 is the explicit-zero
                   sentinel (disable the credential reserve — agentd
                   honors n≥0); 0 = unset. */}}
            {{- if or (gt ($us.credentialFloorBytes | int) 0) (eq ($us.credentialFloorBytes | int) -1) }}
            {{- $kv = append $kv (printf "floor=%d" (max ($us.credentialFloorBytes | int) 0)) }}
            {{- end }}
            {{- if gt ($us.maxConcurrent | int) 0 }}
            {{- $kv = append $kv (printf "concurrent=%d" ($us.maxConcurrent | int)) }}
            {{- end }}
            {{- if gt ($us.ttlMilliseconds | int) 0 }}
            {{- $kv = append $kv (printf "ttlMs=%d" ($us.ttlMilliseconds | int)) }}
            {{- end }}
            {{- if gt ($us.applyTimeoutMilliseconds | int) 0 }}
            {{- $kv = append $kv (printf "applyTimeoutMs=%d" ($us.applyTimeoutMilliseconds | int)) }}
            {{- end }}
            {{- if $kv }}
            - --upload-staging={{ $kv | join "," }}
            {{- /* Render-time fail guard (the r2 finding): the TTL
                   sweeper must never reclaim an in-flight apply temp —
                   reject the violating pair BEFORE the controller
                   crash-loops post-upgrade. The same arithmetic the
                   flag parser enforces, with agentd's compiled
                   defaults (15m TTL / 60s apply) for unset knobs. */}}
            {{- $effApply := 60000 }}
            {{- if gt ($us.applyTimeoutMilliseconds | int) 0 }}
            {{- $effApply = ($us.applyTimeoutMilliseconds | int) }}
            {{- end }}
            {{- $effTTL := 900000 }}
            {{- if gt ($us.ttlMilliseconds | int) 0 }}
            {{- $effTTL = ($us.ttlMilliseconds | int) }}
            {{- end }}
            {{- if le $effTTL (add $effApply 5000) }}
            {{- fail (printf "controller.agentdSidecar.uploadStaging: ttlMilliseconds=%d must exceed the effective apply bound (%d+5000=%d) — the TTL sweeper would reclaim in-flight apply temps" $effTTL $effApply (add $effApply 5000)) }}
            {{- end }}
            {{- end }}
            {{- with .Values.controller.agentdDelivery.image }}
            - --agentd-image={{ . }}
            {{- with $.Values.controller.agentdDelivery.binarySHA256Amd64 }}
            - --agentd-binary-sha256-amd64={{ . }}
            {{- end }}
            {{- with $.Values.controller.agentdDelivery.binarySHA256Arm64 }}
            - --agentd-binary-sha256-arm64={{ . }}
            {{- end }}
            {{- end }}
            {{- /* Design 0053 §4.2: opencode overlay delivery (image
                    volume). Same guards as agentdDelivery: hashes are
                    per-image overrides (both or neither — one-sided
                    renders fail below; hashes without an image fail).
                    NO sidecar-style requires-image guard:
                    opencodeDelivery does not gate agentdSidecar —
                    independent artifacts on independent cadences.
                    Empty-everything renders nothing (S1 opt-in). */}}
            {{- if and (not .Values.controller.opencodeDelivery.image) (or .Values.controller.opencodeDelivery.binarySHA256Amd64 .Values.controller.opencodeDelivery.binarySHA256Arm64) }}
            {{- fail "controller.opencodeDelivery.image is required when binarySHA256* values are set (they are per-image overrides)" }}
            {{- end }}
            {{- if and .Values.controller.opencodeDelivery.image (ne (len .Values.controller.opencodeDelivery.binarySHA256Amd64) 0) (eq (len .Values.controller.opencodeDelivery.binarySHA256Arm64) 0) }}
            {{- fail "controller.opencodeDelivery.binarySHA256*: set BOTH hashes or NEITHER (image-only resolves them from the index annotations)" }}
            {{- end }}
            {{- if and .Values.controller.opencodeDelivery.image (ne (len .Values.controller.opencodeDelivery.binarySHA256Arm64) 0) (eq (len .Values.controller.opencodeDelivery.binarySHA256Amd64) 0) }}
            {{- fail "controller.opencodeDelivery.binarySHA256*: set BOTH hashes or NEITHER (image-only resolves them from the index annotations)" }}
            {{- end }}
            {{- with .Values.controller.opencodeDelivery.image }}
            - --opencode-image={{ . }}
            {{- with $.Values.controller.opencodeDelivery.binarySHA256Amd64 }}
            - --opencode-binary-sha256-amd64={{ . }}
            {{- end }}
            {{- with $.Values.controller.opencodeDelivery.binarySHA256Arm64 }}
            - --opencode-binary-sha256-arm64={{ . }}
            {{- end }}
            {{- end }}
            {{- /* Epic 51 S51.2: per-tenant resource quotas. Only wired when
                    any limit is > 0; the webhook registration is conditional
                    in main.go (disabled when all are 0). */}}
            {{- if hasKey .Values.webhooks "tenantQuota" }}
            {{- if gt (int .Values.webhooks.tenantQuota.maxWorkspacesPerTenant) 0 }}
            - --max-workspaces-per-tenant={{ .Values.webhooks.tenantQuota.maxWorkspacesPerTenant }}
            {{- end }}
            {{- if gt (int .Values.webhooks.tenantQuota.maxCPUMillisPerTenant) 0 }}
            - --max-cpu-millis-per-tenant={{ .Values.webhooks.tenantQuota.maxCPUMillisPerTenant }}
            {{- end }}
            {{- if gt (int .Values.webhooks.tenantQuota.maxMemoryMiPerTenant) 0 }}
            - --max-memory-mi-per-tenant={{ .Values.webhooks.tenantQuota.maxMemoryMiPerTenant }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $metricsAddr | regexFind "[0-9]+$" | atoi }}
              protocol: TCP
            - name: probe
              containerPort: {{ .Values.controller.probeAddr | regexFind "[0-9]+$" | atoi }}
              protocol: TCP
            - name: webhook
              containerPort: {{ .Values.controller.webhookPort }}
              protocol: TCP
          {{- with .Values.controller.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controller.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{/* F1+F5 (worklog 0372): LLMSAFESPACES_INTERNAL_TOKEN authenticates
                 the controller→API internal org-status call. The API endpoint
                 FAILS CLOSED without it, so this env var is always wired
                 (never optional). */}}
          env:
            - name: LLMSAFESPACES_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmsafespaces.secretName" . }}
                  key: internal-token
            {{/* POD_NAMESPACE is read by the InferenceRelay controller's
                   reconciler to locate the relay-router peer ConfigMap and
                   per-VM token Secret in the release namespace. Without it,
                   the reconciler falls back to a hardcoded "llmsafespaces"
                   namespace which only happens to work when the chart is
                   installed under that exact name. See worklog 0464. */}}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.webhooks.enabled }}
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.webhooks.enabled }}
        - name: webhook-cert
          secret:
            secretName: {{ include "llmsafespaces.fullname" . }}-webhook-cert
            defaultMode: 0444
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
