# promtool rule tests for the #901/#906 alert set. Run via the Go test
# helm.TestPromtoolRules (renders the chart, extracts the PrometheusRule,
# shells out to `promtool test rules`). CI installs promtool; locally the
# test skips when the binary is absent (same pattern as the helm-skip).
#
# A previous version of WatchFailing joined an unlabeled gauge against
# labeled series and could NEVER fire — twice reviewed, shipped dead.
# These scenarios execute the real expressions (#906 review F1).
#
# US-69.11: the SSE-tracker alert scenarios (WatchesZero, UpstreamSilent,
# WatchFailing) were deleted with the tracker and its metrics — see the
# succession note in helm/templates/prometheus-rules.yaml (the agentd-side
# seq-stall alerts below carry the liveness signal now).
rule_files:
  - rendered_rules.yaml

evaluation_interval: 1m

tests:
  # ── RelayInjectorDegraded (both outcome flavors) ──────────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="fetch_failed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector gave up fetching free models for this agent generation — free-tier model routing is unavailable until the next agent restart. Check opencode /provider health."

  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="no_free_models"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector gave up fetching free models for this agent generation — free-tier model routing is unavailable until the next agent restart. Check opencode /provider health."

  # ── US-69.12 session-state alerts (design 0055 R5/S4) ─────────────────
  # Seq stall WITH pending ledgered work → fires (the starvation signal;
  # idle-but-quiet pods do not page — the correlation is the design).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall"}'
        values: '400+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall",state="ledgered"}'
        values: '2+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: agentd
              job: test-release-llmsafespaces-agentd
              workspace_id: ws-stall
            exp_annotations:
              summary: "Session-state seq stalled 6m 40s with pending ledger work"
              description: 'The projection has not advanced for 6m 40s while ledgered entries wait (workspace ws-stall). In-pod starvation or a wedged harness — differentiate via CFS throttling and the watchdog suppression counters, then triage per the stranded-entry runbook.'

  # Idle pod: seq stalled but NO pending work → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle"}'
        values: '4000+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle",state="ledgered"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts: []

  # Stalled entries sustained → fires after for:10m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_stalled_entries{job="test-release-llmsafespaces-agentd"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesStalledEntries
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
              job: test-release-llmsafespaces-agentd
            exp_annotations:
              summary: "Stalled delivery entries sustained for 10m"
              description: '1 admitted entries crossed the promotion deadline and the stall wake has not resolved them. The user-visible turn is stranded (#1119 class) — run the stranded-entry triage (GetDeliveryStatus on the ledger, then wake/reseed or replay).'

  # Wake failures (increase over 15m) → fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_wake_failures_total{job="test-release-llmsafespaces-agentd"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: LLMSafeSpacesWakeFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Stall-wake attempts failing"
              description: '15 stall-wake attempts errored in the last 15m — the store reseed behind the wake is failing (opencode unreachable or store read errors). Stalled entries will not self-resolve; check the harness and the wake logs.'

  # Delivery latency budget breach: all mass above the 1.024s bucket →
  # p99 lands in (1.024, 2.048] → fires (buckets per
  # ExponentialBuckets(0.001, 2, 13)).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="1.024"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="2.048"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Delivery ack latency p99 over budget"
              description: 'The Deliver-ack (202-equivalent) p99 is 2.038s (budget 1s). Check platform-volume fsync latency and ledger WAL contention — sustained breach slows every send on this pod.'

  # Healthy delivery latency: all mass in the 1ms bucket → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts: []

  # ── US-70.3 secrets delivery convergence (#1158 PR-5) ────────────────
  # Divergent >15m: fires per workspace.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-stuck"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-stuck
            exp_annotations:
              summary: "Secrets delivery divergent >15m for ws-stuck"
              description: 'Workspace ws-stuck has not converged to the stored secret revision for over 15 minutes — the pod may be serving stale or revoked plaintext. Check the reconcile loop logs (notify failures, pull_failed/pull_unauthorized reasons) and the workspace''s secretsDelivery status. Legacy-format (pre-US-70.2) pods never trip this alert: they surface via llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"} and converge with the fleet upgrade (US-70.5).'

  # Two replicas agree on divergence: deduped to ONE alert (max by workspace_id).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="a"}'
        values: '0+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="b"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-split
            exp_annotations:
              summary: "Secrets delivery divergent >15m for ws-split"
              description: 'Workspace ws-split has not converged to the stored secret revision for over 15 minutes — the pod may be serving stale or revoked plaintext. Check the reconcile loop logs (notify failures, pull_failed/pull_unauthorized reasons) and the workspace''s secretsDelivery status. Legacy-format (pre-US-70.2) pods never trip this alert: they surface via llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"} and converge with the fleet upgrade (US-70.5).'

  # Converged workspace: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-ok"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts: []

  # Brief divergence (healed inside the 15m window): must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-blip"}'
        values: '0x5 1+0x15'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts: []

  # SLO burn: 9/10 converged (90% < 99%) for 5m → fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-1"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-2"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-3"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-4"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-5"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-6"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-7"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-8"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-9"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-10"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
  # ── US-70.4 key re-wrap reconciler ────────────────────────────────────

  # Verify failures: 3 verify_failed increments inside 10m → fires
  # page-on-any (should-never-fire class; the halt alert below catches
  # the sustained spike).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="verify_failed"}'
        values: '10+1x3 13+0x17'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healthy"}'
        values: '1000+5x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesKeyRewrapVerifyFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
            exp_annotations:
              summary: "Secrets delivery convergence SLO burn (<99% over 5m)"
              description: 'Only 90% of Active workspaces are converged — below the 99% SLO for 5m. Fleet-wide divergence usually means the API''s reconcile loop, the pods'' resync endpoint, or the bootstrap pull path is unhealthy; correlate with llmsafespaces_secrets_notify_total outcomes.'

  # Healthy fleet (10/10): must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-h-1"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-h-2"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
        exp_alerts: []

  # Empty fleet (no series at all): the count guard must keep it dark.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
        exp_alerts: []

  # Reconcile stalled: last success far in the past → fires after the
  # 5m for-window. (promtool's synthetic clock starts at epoch 0, so a
  # constant 0 series is ~10 minutes stale by eval_time 10m.)
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job="test-release-llmsafespaces-api"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesSecretsReconcileStalled
              summary: "Key re-wrap reconciler refused to commit unverified wraps"
              description: 'Re-wrap attempts failed verify-after-write or source agreement in the last 10m. Rows were left untouched by design — investigate the master KEK health and the session-cache DEK source before the halt threshold trips.'

  # Healthy + healed outcomes only: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healthy"}'
        values: '1000+5x20'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healed"}'
        values: '0+1x20'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="cas_lost"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapVerifyFailures
        exp_alerts: []

  # Halted reconciler: gauge held at 1 → critical after 5m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_halted{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapHalted
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "Secrets reconcile loop stalled"
              description: 'The secrets-delivery reconcile loop has not completed a successful pass in over 3 minutes (3x the default period) — or has never reported one. Divergent workspaces will not converge until it recovers. Check the API''s K8s client and the loop''s error logs.'

  # Reconcile stalled (loop dead since boot — gauge never existed): the
  # absent() arm fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-neverlooped"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsReconcileStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "Secrets reconcile loop stalled"
              description: 'The secrets-delivery reconcile loop has not completed a successful pass in over 3 minutes (3x the default period) — or has never reported one. Divergent workspaces will not converge until it recovers. Check the API''s K8s client and the loop''s error logs.'
              summary: "Key re-wrap reconciler halted"
              description: 'The user_keys re-wrap reconciler has been halted for 5m — verify-after-write failures reached the blast-radius threshold and further batches are being skipped. The KEK/provider that produced non-round-tripping wraps must be investigated; heals resume on the next pass once it recovers.'

  # Halted gauge blip (one scrape) absorbed by for: 5m: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_halted{job="test-release-llmsafespaces-api"}'
        values: '0+0x5 1 0+0x14'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapHalted
        exp_alerts: []

  # Unwrappable rows: sustained no-source/no-secret increments over 1h →
  # info-tier chronic-state alert fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="unwrappable_no_source"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: LLMSafeSpacesKeyRewrapUnwrappable
        exp_alerts:
          - exp_labels:
              severity: info
              component: api
            exp_annotations:
              summary: "user_keys rows surfaced unwrappable"
              description: 'user_keys rows could not be healed in the last hour — no recovery source (owner offline, no session) or no secret to verify a recovered DEK against (never healed unverified, by design). Check secret_audit_log action=key_rewrap_unwrappable for the affected users.'

  # A single unwrappable blip inside the window: for: 1h holds it back.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="unwrappable_no_secret"}'
        values: '0+0x10 5 5+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LLMSafeSpacesKeyRewrapUnwrappable
        exp_alerts: []
