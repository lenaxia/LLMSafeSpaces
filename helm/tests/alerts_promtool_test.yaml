# promtool rule tests for the #901/#906 alert set. Run via the Go test
# helm.TestPromtoolRules (renders the chart, extracts the PrometheusRule,
# shells out to `promtool test rules`). CI installs promtool; locally the
# test skips when the binary is absent (same pattern as the helm-skip).
#
# A previous version of WatchFailing joined an unlabeled gauge against
# labeled series and could NEVER fire — twice reviewed, shipped dead.
# These scenarios execute the real expressions (#906 review F1).
rule_files:
  - rendered_rules.yaml

evaluation_interval: 1m

tests:
  # ── WatchFailing (the incident's invisible class) ─────────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-blind"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-blind
            exp_annotations:
              summary: "SSE watch armed but not connected for ws-blind"
              description: 'The tracker holds a watch for this workspace but has no open /event stream for 10m — connectAndRead is failing in a backoff loop or has never connected since arm (check Warn logs: empty podIP, refused connection). Users on this replica are event-blind.'

  # Two-instance split (#906 r7 finding 4): replica A connected, replica
  # B's armed watch dead — max would mask B (== 1); min must fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api",instance="a"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api",instance="b"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="a"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="b"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-split
            exp_annotations:
              summary: "SSE watch armed but not connected for ws-split"
              description: 'The tracker holds a watch for this workspace but has no open /event stream for 10m — connectAndRead is failing in a backoff loop or has never connected since arm (check Warn logs: empty podIP, refused connection). Users on this replica are event-blind.'

  # Two instances, both healthy: min == 1, must not fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-both-ok",instance="a"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-both-ok",instance="b"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchFailing
        exp_alerts: []

  # connected == 1: healthy, must not fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-ok"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchFailing
        exp_alerts: []

  # No connected series at all (not watched): absent ≠ 0, must not fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchFailing
        exp_alerts: []

  # ── WatchesZero (guarded: no critical on empty fleets) ────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchesZero
        exp_alerts: []

  # One replica at zero while the fleet watches: fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api",instance="a"}'
        values: '0+0x20'
      - series: 'llmsafespaces_sse_tracker_watched_workspaces{job="test-release-llmsafespaces-api",instance="b"}'
        values: '3+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerWatchesZero
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "An API replica holds zero SSE tracker watches"
              description: "At least one API replica has watched zero workspaces for 5m — its client streams are event-blind (users halt while sends succeed). Check tracker Warn logs and the watch reconciler."

  # ── UpstreamSilent (guarded by connected == 1) ────────────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_last_event_age_seconds{job="test-release-llmsafespaces-api",workspace_id="ws-silent"}'
        values: '700+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-silent"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerUpstreamSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              workspace_id: ws-silent
            exp_annotations:
              summary: "SSE tracker upstream silent >10m on a watched workspace"
              description: 'A watched workspace has received no upstream agent events for over 10 minutes. Either the workspace is idle (benign) or the tracker connection is dead-but-open (see #901 G11). Correlate with workspace activity.'

  # Suspended workspace: age stale but connected == 0 → not firing.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_sse_tracker_last_event_age_seconds{job="test-release-llmsafespaces-api",workspace_id="ws-susp"}'
        values: '700+0x20'
      - series: 'llmsafespaces_sse_tracker_connected{job="test-release-llmsafespaces-api",workspace_id="ws-susp"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSSETrackerUpstreamSilent
        exp_alerts: []

  # ── RelayInjectorDegraded (both outcome flavors) ──────────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="fetch_failed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector gave up fetching free models for this agent generation — free-tier model routing is unavailable until the next agent restart. Check opencode /provider health."

  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="no_free_models"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector gave up fetching free models for this agent generation — free-tier model routing is unavailable until the next agent restart. Check opencode /provider health."

  # ── US-69.12 session-state alerts (design 0055 R5/S4) ─────────────────
  # Seq stall WITH pending ledgered work → fires (the starvation signal;
  # idle-but-quiet pods do not page — the correlation is the design).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall"}'
        values: '400+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall",state="ledgered"}'
        values: '2+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: agentd
              job: test-release-llmsafespaces-agentd
              workspace_id: ws-stall
            exp_annotations:
              summary: "Session-state seq stalled 6m 40s with pending ledger work"
              description: 'The projection has not advanced for 6m 40s while ledgered entries wait (workspace ws-stall). In-pod starvation or a wedged harness — differentiate via CFS throttling and the watchdog suppression counters, then triage per the stranded-entry runbook.'

  # Idle pod: seq stalled but NO pending work → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle"}'
        values: '4000+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle",state="ledgered"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts: []

  # Stalled entries sustained → fires after for:10m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_stalled_entries{job="test-release-llmsafespaces-agentd"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesStalledEntries
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
              job: test-release-llmsafespaces-agentd
            exp_annotations:
              summary: "Stalled delivery entries sustained for 10m"
              description: '1 admitted entries crossed the promotion deadline and the stall wake has not resolved them. The user-visible turn is stranded (#1119 class) — run the stranded-entry triage (GetDeliveryStatus on the ledger, then wake/reseed or replay).'

  # Wake failures (increase over 15m) → fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_wake_failures_total{job="test-release-llmsafespaces-agentd"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: LLMSafeSpacesWakeFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Stall-wake attempts failing"
              description: '15 stall-wake attempts errored in the last 15m — the store reseed behind the wake is failing (opencode unreachable or store read errors). Stalled entries will not self-resolve; check the harness and the wake logs.'

  # Delivery latency budget breach: all mass above the 1.024s bucket →
  # p99 lands in (1.024, 2.048] → fires (buckets per
  # ExponentialBuckets(0.001, 2, 13)).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="1.024"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="2.048"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Delivery ack latency p99 over budget"
              description: 'The Deliver-ack (202-equivalent) p99 is 2.038s (budget 1s). Check platform-volume fsync latency and ledger WAL contention — sustained breach slows every send on this pod.'

  # Healthy delivery latency: all mass in the 1ms bucket → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts: []
