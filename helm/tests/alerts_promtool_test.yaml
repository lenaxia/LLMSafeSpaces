# promtool rule tests for the #901/#906 alert set. Run via the Go test
# helm.TestPromtoolRules (renders the chart, extracts the PrometheusRule,
# shells out to `promtool test rules`). CI installs promtool; locally the
# test skips when the binary is absent (same pattern as the helm-skip).
#
# A previous version of WatchFailing joined an unlabeled gauge against
# labeled series and could NEVER fire — twice reviewed, shipped dead.
# These scenarios execute the real expressions (#906 review F1).
#
# US-69.11: the SSE-tracker alert scenarios (WatchesZero, UpstreamSilent,
# WatchFailing) were deleted with the tracker and its metrics — see the
# succession note in helm/templates/prometheus-rules.yaml (the agentd-side
# seq-stall alerts below carry the liveness signal now).
rule_files:
  - rendered_rules.yaml

evaluation_interval: 1m

tests:
  # ── RelayInjectorDegraded (both outcome flavors) ──────────────────────
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="fetch_failed"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector's boot-window free-model fetch terminally failed — free-tier model routing is degraded and the injector has entered its bounded re-arm loop (retrying every 5–30m; #910). Recovery is automatic once the relay router/catalog answers: watch llmsafespaces_rearm_outcome_total{loop=\"relay_injector\"} for a success tick. If re-arm failures persist for the pod's whole life, check opencode /provider health and the relay router."

  - interval: 1m
    input_series:
      - series: 'llmsafespaces_relay_injector_total{job="test-release-llmsafespaces-agentd",outcome="no_free_models"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesRelayInjectorDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Relay injector free-model fetch exhausted"
              description: "The relay injector's boot-window free-model fetch terminally failed — free-tier model routing is degraded and the injector has entered its bounded re-arm loop (retrying every 5–30m; #910). Recovery is automatic once the relay router/catalog answers: watch llmsafespaces_rearm_outcome_total{loop=\"relay_injector\"} for a success tick. If re-arm failures persist for the pod's whole life, check opencode /provider health and the relay router."

  # ── US-69.12 session-state alerts (design 0055 R5/S4) ─────────────────
  # Seq stall WITH pending ledgered work → fires (the starvation signal;
  # idle-but-quiet pods do not page — the correlation is the design).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall"}'
        values: '400+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-stall",state="ledgered"}'
        values: '2+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: agentd
              job: test-release-llmsafespaces-agentd
              workspace_id: ws-stall
            exp_annotations:
              summary: "Session-state seq stalled 6m 40s with pending ledger work"
              description: 'The projection has not advanced for 6m 40s while ledgered entries wait (workspace ws-stall). In-pod starvation or a wedged harness — differentiate via CFS throttling and the watchdog suppression counters, then triage per the stranded-entry runbook.'

  # Idle pod: seq stalled but NO pending work → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_seq_stall_seconds{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle"}'
        values: '4000+0x20'
      - series: 'llmsafespaces_ledger_depth{job="test-release-llmsafespaces-agentd",workspace_id="ws-idle",state="ledgered"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesSeqStalled
        exp_alerts: []

  # Stalled entries sustained → fires after for:10m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_stalled_entries{job="test-release-llmsafespaces-agentd"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesStalledEntries
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
              job: test-release-llmsafespaces-agentd
            exp_annotations:
              summary: "Stalled delivery entries sustained for 10m"
              description: '1 admitted entries crossed the promotion deadline and the stall wake has not resolved them. The user-visible turn is stranded (#1119 class) — run the stranded-entry triage (GetDeliveryStatus on the ledger, then wake/reseed or replay).'

  # Wake failures (increase over 15m) → fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_wake_failures_total{job="test-release-llmsafespaces-agentd"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: LLMSafeSpacesWakeFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Stall-wake attempts failing"
              description: '15 stall-wake attempts errored in the last 15m — the store reseed behind the wake is failing (opencode unreachable or store read errors). Stalled entries will not self-resolve; check the harness and the wake logs.'

  # Delivery latency budget breach: all mass above the 1.024s bucket →
  # p99 lands in (1.024, 2.048] → fires (buckets per
  # ExponentialBuckets(0.001, 2, 13)).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="1.024"}'
        values: '0+0x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="2.048"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              component: agentd
            exp_annotations:
              summary: "Delivery ack latency p99 over budget"
              description: 'The Deliver-ack (202-equivalent) p99 is 2.038s (budget 1s). Check platform-volume fsync latency and ledger WAL contention — sustained breach slows every send on this pod.'

  # Healthy delivery latency: all mass in the 1ms bucket → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="0.001"}'
        values: '60+60x20'
      - series: 'llmsafespaces_delivery_202_latency_seconds_bucket{job="test-release-llmsafespaces-agentd",le="+Inf"}'
        values: '60+60x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesDeliveryLatencyBudget
        exp_alerts: []

  # ── US-70.3 secrets delivery convergence (#1158 PR-5) ────────────────
  # Divergent >15m: fires per workspace.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-stuck"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-stuck
            exp_annotations:
              summary: "Secrets delivery divergent >15m for ws-stuck"
              description: 'Workspace ws-stuck has not converged to the stored secret revision for over 15 minutes — the pod may be serving stale or revoked plaintext. Check the reconcile loop logs (notify failures, pull_failed/pull_unauthorized reasons) and the workspace''s secretsDelivery status. Legacy-format (pre-US-70.2) pods never trip this alert: they surface via llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"} and converge with the fleet upgrade (US-70.5).'

  # Two replicas agree on divergence: deduped to ONE alert (max by workspace_id).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="a"}'
        values: '0+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-split",instance="b"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              workspace_id: ws-split
            exp_annotations:
              summary: "Secrets delivery divergent >15m for ws-split"
              description: 'Workspace ws-split has not converged to the stored secret revision for over 15 minutes — the pod may be serving stale or revoked plaintext. Check the reconcile loop logs (notify failures, pull_failed/pull_unauthorized reasons) and the workspace''s secretsDelivery status. Legacy-format (pre-US-70.2) pods never trip this alert: they surface via llmsafespaces_secrets_delivery_divergent_total{reason="legacy_format"} and converge with the fleet upgrade (US-70.5).'

  # Converged workspace: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-ok"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts: []

  # Brief divergence (healed inside the 15m window): must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-blip"}'
        values: '0x5 1+0x15'
    alert_rule_test:
      - eval_time: 16m
        alertname: LLMSafeSpacesSecretsDeliveryDivergent
        exp_alerts: []

  # SLO burn: 9/10 converged (90% < 99%) for 5m → fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-1"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-2"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-3"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-4"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-5"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-6"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-7"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-8"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-9"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-slo-10"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
            exp_annotations:
              summary: "Secrets delivery convergence SLO burn (<99% over 5m)"
              description: 'Only 90% of Active workspaces are converged — below the 99% SLO for 5m. Fleet-wide divergence usually means the API''s reconcile loop, the pods'' resync endpoint, or the bootstrap pull path is unhealthy; correlate with llmsafespaces_secrets_notify_total outcomes.'

  # ── US-70.4 key re-wrap reconciler ────────────────────────────────────

  # Verify failures: 3 verify_failed increments inside 10m → fires
  # page-on-any (should-never-fire class; the halt alert below catches
  # the sustained spike).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="verify_failed"}'
        values: '10+1x3 13+0x17'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healthy"}'
        values: '1000+5x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesKeyRewrapVerifyFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
            exp_annotations:
              summary: "Key re-wrap reconciler refused to commit unverified wraps"
              description: 'Re-wrap attempts failed verify-after-write or source agreement in the last 10m. Rows were left untouched by design — investigate the master KEK health and the session-cache DEK source before the halt threshold trips.'

  # Healthy fleet (10/10): must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-h-1"}'
        values: '1+0x20'
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-h-2"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
        exp_alerts: []

  # Empty fleet (no series at all): the count guard must keep it dark.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsConvergenceSLOBurn
        exp_alerts: []

  # Reconcile stalled: last success far in the past → fires after the
  # 5m for-window. (promtool's synthetic clock starts at epoch 0, so a
  # constant 0 series is ~10 minutes stale by eval_time 10m.)
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job="test-release-llmsafespaces-api"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesSecretsReconcileStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "Secrets reconcile loop stalled"
              description: 'The secrets-delivery reconcile loop has not completed a successful pass in over 3 minutes (3x the default period) — or has never reported one. Divergent workspaces will not converge until it recovers. Check the API''s K8s client and the loop''s error logs.'

  # Healthy + healed outcomes only: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healthy"}'
        values: '1000+5x20'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="healed"}'
        values: '0+1x20'
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="cas_lost"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapVerifyFailures
        exp_alerts: []

  # Halted reconciler: gauge held at 1 → critical after 5m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_halted{job="test-release-llmsafespaces-api"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapHalted
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "Key re-wrap reconciler halted"
              description: 'The user_keys re-wrap reconciler has been halted for 5m — verify-after-write failures reached the blast-radius threshold and further batches are being skipped. The KEK/provider that produced non-round-tripping wraps must be investigated; heals resume on the next pass once it recovers.'

  # Reconcile stalled (loop dead since boot — gauge never existed): the
  # absent() arm fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_delivery_converged{job="test-release-llmsafespaces-api",workspace_id="ws-neverlooped"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesSecretsReconcileStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
            exp_annotations:
              summary: "Secrets reconcile loop stalled"
              description: 'The secrets-delivery reconcile loop has not completed a successful pass in over 3 minutes (3x the default period) — or has never reported one. Divergent workspaces will not converge until it recovers. Check the API''s K8s client and the loop''s error logs.'

  # Halted gauge blip (one scrape) absorbed by for: 5m: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_halted{job="test-release-llmsafespaces-api"}'
        values: '0+0x5 1 0+0x14'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesKeyRewrapHalted
        exp_alerts: []

  # Unwrappable rows: sustained no-source/no-secret increments over 1h →
  # info-tier chronic-state alert fires.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="unwrappable_no_source"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: LLMSafeSpacesKeyRewrapUnwrappable
        exp_alerts:
          - exp_labels:
              severity: info
              component: api
            exp_annotations:
              summary: "user_keys rows surfaced unwrappable"
              description: 'user_keys rows could not be healed in the last hour — no recovery source (owner offline, no session) or no secret to verify a recovered DEK against (never healed unverified, by design). Check secret_audit_log action=key_rewrap_unwrappable for the affected users.'

  # A single unwrappable blip inside the window: for: 1h holds it back.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_key_rewrap_rows_total{job="test-release-llmsafespaces-api",outcome="unwrappable_no_secret"}'
        values: '0+0x10 5 5+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LLMSafeSpacesKeyRewrapUnwrappable
        exp_alerts: []

  # ── Epic-71 / 0c-alerts (#1312 alerts wave): canary S/L + loop liveness ──
  # Contract under test (from the 2026-09-15 assessment §3/§5.2):
  #   - S-violation immediate: resolve/not_found_error = S6 violated.
  #   - L-breach burn-rate (NOT per-sample): resolve-leg p99 vs the 2s L2
  #     bound, with for > window so a single slow probe structurally
  #     cannot fire.
  #   - Dead-loop staleness on llmsafespaces_loop_last_run_timestamp_seconds
  #     for all three registered loops (pkg/obs/loopliveness.go).
  #   - A DARK canary (api.canary.enabled=false → no canary series at all)
  #     must keep every canary alert silent — the flip arms them; absence
  #     never pages.

  # S6 violation: not_found_error on the resolve leg → fires immediately
  # (page-on-any; safety invariant, for: 0m).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="not_found_error"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LLMSafeSpacesCanaryS6Violation
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              class: python:3.11
            exp_annotations:
              summary: "Canary S6 violation — resolve-by-absence errored (class python:3.11)"
              description: 'The canary''s resolve leg recorded not_found_error outcomes in the last 10m for class python:3.11 — absence surfaced as an error instead of resolving (S6 violated, the pre-1a baseline; every occurrence is a bug). Check the class''s target pod resolve path and the Canary & Loop Liveness dashboard row.'

  # Healthy resolve leg (resolved flowing) + snapshot steady-state
  # (not_found): must NOT fire. The flowing series also falsify a
  # loosened outcome/leg matcher — drop either and these make it fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="resolved"}'
        values: '0+1x20'
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="snapshot",outcome="not_found"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesCanaryS6Violation
        exp_alerts: []

  # DARK canary (disabled → zero canary series): must NOT fire. Guards
  # against an absent()-style mutation that would page on the knob-off
  # fleet.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_secrets_reconcile_last_pass_success_timestamp{job="test-release-llmsafespaces-api"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesCanaryS6Violation
        exp_alerts: []

  # Wedge signal: timeout every pass (1/min) → 10 in the 10m window ≥ 3,
  # sustained → fires after for:10m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="timeout"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesCanaryProbeTimeouts
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              class: python:3.11
              leg: resolve
            exp_annotations:
              summary: "Canary probe timeouts sustained (class python:3.11, resolve leg)"
              description: 'The canary recorded 3+ timeout outcomes in the last 10m (class python:3.11, resolve leg) — the wedge signal: probe attempts repeatedly exceeded the 2s per-leg budget. Check the class''s target pod for a hung agent/harness; correlate with the seq-stall and watchdog alerts.'

  # One timeout blip: increase never reaches 3 → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="snapshot",outcome="timeout"}'
        values: '0+0x5 1 1+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesCanaryProbeTimeouts
        exp_alerts: []

  # DARK canary but healthy non-timeout outcomes flowing: must NOT fire
  # (falsifies a loosened outcome matcher).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="resolved"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesCanaryProbeTimeouts
        exp_alerts: []

  # L2 burn: ALL resolve probes land in the (1, 2.5] bucket (the timeout
  # bucket — DefaultTimeout 2s = the L2 bound): p99 interpolates to
  # 1 + 0.99*(2.5-1) = 2.485s > 2, sustained → fires after for:15m.
  # Buckets per canary/metrics.go Buckets(0.005..5).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="1"}'
        values: '0+0x30'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="2.5"}'
        values: '0+10x30'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LLMSafeSpacesCanaryResolveL2Burn
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              class: python:3.11
            exp_annotations:
              summary: "Canary resolve-leg p99 above the L2 budget (class python:3.11)"
              description: 'The canary resolve-leg p99 is 2.485s over the last 10m — above the 2s L2 resolve bound (#1312). Burn, not per-sample: a single slow probe cannot trip this (the 15m hold exceeds the 10m window). Check the class''s target pod and recent deploys.'

  # Healthy latency: all probes ≤ 250ms → must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="0.25"}'
        values: '0+10x30'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="1"}'
        values: '0+10x30'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LLMSafeSpacesCanaryResolveL2Burn
        exp_alerts: []

  # Single slow probe (one sample in (1, 2.5] at t=12m): p99 > 2 only
  # while the blip sits inside the 10m window (t≈12–22m) — 10m of
  # pending < for:15m → must NOT fire, checked at peak pending (21m)
  # and after the window slides past (25m).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="1"}'
        values: '0+1x10 10+0x1 11+1x18'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="2.5"}'
        values: '0+1x29'
      - series: 'llmsafespaces_canary_probe_duration_seconds_bucket{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",le="+Inf"}'
        values: '0+1x29'
    alert_rule_test:
      - eval_time: 21m
        alertname: LLMSafeSpacesCanaryResolveL2Burn
        exp_alerts: []
      - eval_time: 25m
        alertname: LLMSafeSpacesCanaryResolveL2Burn
        exp_alerts: []

  # No-target sustained (configured class with no Active workspace —
  # false coverage): info-tier chronic-state, fires after for:1h.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="ghost:1.0",leg="snapshot",outcome="no_target"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: LLMSafeSpacesCanaryNoTarget
        exp_alerts:
          - exp_labels:
              severity: info
              component: api
              class: ghost:1.0
            exp_annotations:
              summary: "Canary class never finds a target workspace (class ghost:1.0)"
              description: 'Every probe pass for class ghost:1.0 records no_target — the canary knob is on but this class has no Active workspace, so it asserts nothing (false coverage). Point api.canary.classes at a runtime environment with a live workspace, or drop the class.'

  # Transient no-target (10m, then targets return): pending ~40m < 1h →
  # must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="snapshot",outcome="no_target"}'
        values: '0+1x10 10+0x70'
    alert_rule_test:
      - eval_time: 45m
        alertname: LLMSafeSpacesCanaryNoTarget
        exp_alerts: []

  # DARK canary: no_target alert must stay silent with zero canary
  # series (guards against absent()-style mutations).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="resolved"}'
        values: '0+1x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: LLMSafeSpacesCanaryNoTarget
        exp_alerts: []

  # Canary loop stale: gauge frozen (constant 0; promtool's clock starts
  # at epoch 0 → 12m stale by eval_time 12m) → fires after for:5m.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="canary_probe"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesLoopCanaryProbeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              job: test-release-llmsafespaces-api
              loop: canary_probe
            exp_annotations:
              summary: "Canary probe loop stale (12m 0s since last pass)"
              description: 'The canary_probe loop has not completed a pass in 12m 0s (budget 5m = 5x the default 60s interval — scale with LLMSAFESPACES_CANARY_INTERVAL). The probe runner is wedged or the API replica lost its ticker; canary coverage is dark until it recovers.'

  # Canary loop healthy (gauge advancing with real time): must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="canary_probe"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesLoopCanaryProbeStale
        exp_alerts: []

  # DARK canary: no canary_probe series at all, sibling loop healthy —
  # the canary staleness alert must NOT fire (no absent() arm by
  # design: a disabled canary must look dark, not stale).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="outbox_parked_sweeper"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesLoopCanaryProbeStale
        exp_alerts: []

  # Parked sweeper stale (frozen gauge): fires after for:5m (critical —
  # the S3-adjacent parked-error resolution path).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="outbox_parked_sweeper"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesLoopParkedSweeperStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              job: test-release-llmsafespaces-api
              loop: outbox_parked_sweeper
            exp_annotations:
              summary: "Outbox parked-error sweeper loop stale or absent"
              description: 'The outbox_parked_sweeper loop has not completed a pass in over 3m (3x the 60s ParkedSweepInterval) — or never stamped at all (dead since boot; the absent arm). Parked user-visible errors will not re-arm or resolve until the API outbox Run loop recovers.'

  # Parked sweeper dead since boot (sibling loop series present, sweeper
  # series absent): the absent() arm fires after for:5m. absent() carries
  # the selector's equality matchers as labels (loop survives; the job
  # regex does not).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="canary_probe"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesLoopParkedSweeperStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              loop: outbox_parked_sweeper
            exp_annotations:
              summary: "Outbox parked-error sweeper loop stale or absent"
              description: 'The outbox_parked_sweeper loop has not completed a pass in over 3m (3x the 60s ParkedSweepInterval) — or never stamped at all (dead since boot; the absent arm). Parked user-visible errors will not re-arm or resolve until the API outbox Run loop recovers.'

  # Parked sweeper healthy: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="outbox_parked_sweeper"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesLoopParkedSweeperStale
        exp_alerts: []

  # Reconcile watchdog stale on ONE agentd instance while its sibling
  # stays healthy: only the stale instance fires (per-instance
  # semantics — a dead pod must not be masked by a live one).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-agentd",instance="10.42.0.1:4098",loop="reconcile_watchdog"}'
        values: '0+60x30'
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-agentd",instance="10.42.0.2:4098",loop="reconcile_watchdog"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesLoopReconcileWatchdogStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: agentd
              job: test-release-llmsafespaces-agentd
              instance: 10.42.0.2:4098
              loop: reconcile_watchdog
            exp_annotations:
              summary: "Session-state reconcile watchdog stale on 10.42.0.2:4098 (6m 0s)"
              description: 'The reconcile_watchdog loop on agentd instance 10.42.0.2:4098 has not completed a pass in 6m 0s (budget 90s = 6x the 15s cadence, ReconcileCadence = LeaseConvergenceBound/2) — S5/S7 convergence and the L4/L5 lease bounds are dark for this pod. No absent() arm by design: agentd pods are ephemeral (suspend/resume); only a live-but-not-stamping pod pages.'

  # Watchdog healthy everywhere: must NOT fire.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-agentd",instance="10.42.0.1:4098",loop="reconcile_watchdog"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesLoopReconcileWatchdogStale
        exp_alerts: []

  # No agentd scrape at all (API loop series only): the watchdog alert
  # has NO absent() arm and must stay silent — suspend/resume makes
  # absent agentd targets a normal fleet state.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",loop="canary_probe"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: LLMSafeSpacesLoopReconcileWatchdogStale
        exp_alerts: []

  # ── r1 review additions (mutation-confirmed gaps): anti-masking,
  #    any-leg, and the L2Burn dark row ────────────────────────────────

  # Canary loop stale on ONE replica while its sibling stays healthy:
  # only the frozen instance fires — the per-instance anti-masking
  # guarantee (a `min by`/fleet-level rewrite must fail this row).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",instance="10.42.1.1:8080",loop="canary_probe"}'
        values: '0+60x30'
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",instance="10.42.1.2:8080",loop="canary_probe"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: LLMSafeSpacesLoopCanaryProbeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              job: test-release-llmsafespaces-api
              instance: 10.42.1.2:8080
              loop: canary_probe
            exp_annotations:
              summary: "Canary probe loop stale (12m 0s since last pass)"
              description: 'The canary_probe loop has not completed a pass in 12m 0s (budget 5m = 5x the default 60s interval — scale with LLMSAFESPACES_CANARY_INTERVAL). The probe runner is wedged or the API replica lost its ticker; canary coverage is dark until it recovers.'

  # Parked sweeper stale on ONE replica while its sibling stays healthy:
  # only the frozen instance fires with its labels (same anti-masking
  # pin; the absent() arm is inactive while a sibling stamps).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",instance="10.42.1.1:8080",loop="outbox_parked_sweeper"}'
        values: '0+60x30'
      - series: 'llmsafespaces_loop_last_run_timestamp_seconds{job="test-release-llmsafespaces-api",instance="10.42.1.2:8080",loop="outbox_parked_sweeper"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LLMSafeSpacesLoopParkedSweeperStale
        exp_alerts:
          - exp_labels:
              severity: critical
              component: api
              job: test-release-llmsafespaces-api
              instance: 10.42.1.2:8080
              loop: outbox_parked_sweeper
            exp_annotations:
              summary: "Outbox parked-error sweeper loop stale or absent"
              description: 'The outbox_parked_sweeper loop has not completed a pass in over 3m (3x the 60s ParkedSweepInterval) — or never stamped at all (dead since boot; the absent arm). Parked user-visible errors will not re-arm or resolve until the API outbox Run loop recovers.'

  # Wedge on the SNAPSHOT leg (GetSnapshot hang → snapshot/timeout):
  # must fire — the alert is any-leg by design; a `leg="resolve"`
  # restriction must fail this row.
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="node:22",leg="snapshot",outcome="timeout"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LLMSafeSpacesCanaryProbeTimeouts
        exp_alerts:
          - exp_labels:
              severity: warning
              component: api
              class: node:22
              leg: snapshot
            exp_annotations:
              summary: "Canary probe timeouts sustained (class node:22, snapshot leg)"
              description: 'The canary recorded 3+ timeout outcomes in the last 10m (class node:22, snapshot leg) — the wedge signal: probe attempts repeatedly exceeded the 2s per-leg budget. Check the class''s target pod for a hung agent/harness; correlate with the seq-stall and watchdog alerts.'

  # DARK canary for the L2 burn: outcome series flowing (probes skipped
  # pre-observation — the real no_target shape) but ZERO duration
  # buckets → histogram_quantile has nothing to interpolate → must NOT
  # fire. Catches an added absent() arm (would page the knob-off fleet).
  - interval: 1m
    input_series:
      - series: 'llmsafespaces_canary_probe_outcomes_total{job="test-release-llmsafespaces-api",class="python:3.11",leg="resolve",outcome="no_target"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LLMSafeSpacesCanaryResolveL2Burn
        exp_alerts: []

  # ── LlmRelayRouter alerts (Epic 72 / US-72.2) ────────────────────────
  - interval: 1m
    input_series:
      - series: 'llm_relay_byo_requests_total{workspace="ws-canary",provider="zai",status="401"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LlmRelayRouterRejectSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              component: llm-relay
              workspace: ws-canary
            exp_annotations:
              summary: "BYO relay router rejecting a workspace's requests"
              description: >-
                Workspace ws-canary accumulated 30 rejections (401/403/429) in 10m — check CredentialStale/CredentialRejected
                conditions and quota usage.

  - interval: 1m
    input_series:
      - series: 'llm_relay_byo_requests_total{workspace="ws-canary",provider="zai",status="502"}'
        values: '0+2x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LlmRelayRouterUpstreamErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: llm-relay
              workspace: ws-canary
            exp_annotations:
              summary: "BYO relay router upstream failures"
              description: >-
                Workspace ws-canary saw 20 upstream-class
                failures in 10m — resolve path or provider availability issue.

  # ── M2 (design 0061 §4): the fallback + degraded-batch detectors ──────
  - interval: 1m
    input_series:
      - series: 'relay_fallback_deliveries_total{workspace="ws-a",provider_slug="openai"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: RelayFallbackDeliveryActive
        exp_alerts:
          - exp_labels:
              severity: warning
              category: credential-delivery
            exp_annotations:
              summary: "Relay fallback delivery active (migration mode delivering raw keys)"

  - interval: 1m
    input_series:
      - series: 'relay_degraded_batches_total{workspace="ws-b",reason="relay_staging_not_ready"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: RelayDegradedBatchesActive
        exp_alerts:
          - exp_labels:
              severity: critical
              category: credential-delivery
            exp_annotations:
              summary: "Fail-closed relay batches (zero LLM credentials delivered)"
