name: Image Factory Build

# Triggered by the API's POST /v1/image-factory/configs handler via
# workflow_dispatch. Renders a deterministic Dockerfile from the resolved
# extension values + base image, builds multi-arch via buildx, pushes to
# ghcr.io, and POSTs the result back to the API's callback endpoint.
#
# The workflow is parameterized by:
#   build_id        — UUID matching the image_factory_builds.id row
#   callback_url    — API endpoint to POST results to
#   callback_token  — per-build secret for ConstantTimeCompare auth
#   hash            — schematic hash (s-<sha256[:16]>)
#   base_name       — base flavor name
#   base_version    — base version
#   base_image_ref  — full base image ref (image@digest or image:tag)
#   architectures   — comma-separated platforms (e.g. "linux/amd64,linux/arm64")
#   dockerfile      — the fully-rendered Dockerfile string (produced by the
#                     API's pure RenderDockerfile — one renderer, no divergence)
#
# The API handles retry (single dispatch, one result per design/0046 #12).
#
#


on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build UUID (image_factory_builds.id)"
        required: true
        type: string
      callback_url:
        description: "API callback endpoint base URL"
        required: true
        type: string
      callback_token:
        description: "Per-build callback auth token"
        required: true
        type: string
      hash:
        description: "Schematic hash (s-...)"
        required: true
        type: string
      base_name:
        description: "Base flavor name"
        required: true
        type: string
      base_version:
        description: "Base version"
        required: true
        type: string
      base_image_ref:
        description: "Full base image ref (image@digest or image:tag)"
        required: true
        type: string
      architectures:
        description: "Comma-separated platforms"
        required: true
        type: string
        default: "linux/amd64"
      dockerfile:
        description: "Fully-rendered Dockerfile (from API's RenderDockerfile)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lenaxia/llmsafespaces/ws

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.hash }}-${{ inputs.base_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Dockerfile from input
        run: |
          printf '%s' "${{ inputs.dockerfile }}" > /tmp/Dockerfile
          echo "Dockerfile written ($(wc -l < /tmp/Dockerfile) lines)"

      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: /tmp/Dockerfile
          platforms: ${{ inputs.architectures }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.hash }}-${{ inputs.base_version }}
          push: true

      - name: Report success callback
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST "${CALLBACK_URL}/builds/${BUILD_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -d "{\"status\": \"succeeded\", \"digest\": \"${DIGEST}\"}"

      - name: Capture build output on failure
        if: steps.build.outcome == 'failure'
        run: |
          # build-push-action logs to the step output. GitHub Actions
          # doesn't expose step stdout directly, but $GITHUB_STEP_SUMMARY
          # and the workflow log both capture it. We construct a failure
          # reason from the known build parameters + the step outcome.
          {
            echo "Build failed for ${{ inputs.hash }}-${{ inputs.base_version }}"
            echo "Base: ${{ inputs.base_name }}@${{ inputs.base_version }} (${{ inputs.base_image_ref }})"
            echo "Architectures: ${{ inputs.architectures }}"
            echo ""
            echo "Dockerfile:"
            cat /tmp/Dockerfile
          } > /tmp/failure_reason.txt

      - name: Report failure callback
        if: steps.build.outcome == 'failure'
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set +e
          FAILURE_REASON=$(cat /tmp/failure_reason.txt 2>/dev/null | head -50 || echo "build failed; no log available")
          PAYLOAD=$(jq -n --arg reason "$FAILURE_REASON" '{"status": "failed", "failureReason": $reason}')
          curl --fail --show-error --silent \
            -X POST "${CALLBACK_URL}/builds/${BUILD_ID}/callback" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CALLBACK_TOKEN}" \
            -d "$PAYLOAD" || true
