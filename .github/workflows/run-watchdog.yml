name: Run Watchdog

# #1844 mitigation (automated arm; the manual lever is pr-review.yml's
# dispatch-recovery job): GitHub intermittently drops synchronize events
# — a pushed PR head gets ZERO workflow runs of ANY workflow while
# sibling branches run instantly. Documented instances: #1841 (2/2
# pushes), #1839, #1843 (PR-scoped), feat/board-review-settle 2026-10-23
# ~01:44Z+ (branch-scoped, actor-independent, 40+ min persistent), and
# the 2026-10-29 19:28–21:25Z WINDOW (5 dark heads across #1983/#1984,
# event-type-scoped: synchronize lost while issue_comment / schedule /
# workflow_dispatch / pull_request.opened delivered — evidence register
# in docs/automation/ci-event-delivery.md). Silent impact: a lane looks
# "awaiting review" while GitHub never dispatched anything — without an
# external poller, PRs stall indefinitely.
#
# WHAT THIS DOES: for each open PR, if the head SHA is older than
# WATCHDOG_MIN_AGE_MINUTES (10) and carries ZERO total check-runs (pr-review.yml is the universal check-runs producer: it
# triggers on every pull_request — opened/synchronize — with no branch
# and no paths filter, so ANY delivered synchronize produces at least
# its review-round runs; ci.yml also fires for this repo's PRs but
# filters branches: [main]), and the head commit does not carry an
# Actions skip marker ([skip ci] — the renumber bot's commits
# legitimately produce no runs):
#   1. post the namespaced #1844 fault comment — deduplicated per head
#      SHA via the `<!-- run-watchdog: fault sha=... -->` marker (the
#      same literal pr-review.yml's dispatch-recovery posts (once that
#      PR merges; its tree pins the marker against THIS package); pinned by
#      pkg/runwatchdog's TestFaultMarkerFormat), tagging #1844 so
#      instances accumulate as issue evidence;
#   2. dispatch ci.yml on the branch — the recovery lever verified live
#      during the 2026-10-23 branch-scoped suppression (02:23Z:
#      workflow_dispatch queues normally while push events to the same
#      branch produce zero runs). GITHUB_TOKEN-created
#      workflow_dispatch events DO create runs (the documented
#      recursion exemption).
#
# AUTO-RETRIGGER DEFAULT: OPT-OUT, not opt-in. Honest cost (r1 review):
# a workflow_dispatch of ci.yml PUSHES a sha-/ts- image set from the
# UNMERGED branch (ci.yml pushes on every non-pull_request event) — the
# dispatch is NOT side-effect-free. Amplification is capped at
# EXACTLY-ONCE PER HEAD SHA: ShouldDispatch consults the same per-SHA
# marker as the comment (pkg/runwatchdog Evaluate; a marker-present
# head gets neither action), and the predicate itself clears once the
# dispatched run registers check-runs on the same SHA. That bounds the
# cron side effect to one image set per suppressed head — visible in
# the fault comment, removable per-PR. The default stays ON (ratified):
# the fault is silent and GitHub-side — nobody labels a PR in advance
# for a fault they cannot see, and an opt-in default would have caught
# ZERO of the four documented instances. Opt out per-PR with the label
# `watchdog:no-auto-retrigger` (comment still posts — evidence stands).
#
# The decision matrix lives in pkg/runwatchdog (red-first,
# unit-tested); this workflow only gathers inputs via gh and executes
# the decision — the numbering-gate pattern from #1867: bash gathers,
# Go decides, so the predicate can never drift between tests and CI.
#
# LIMIT (documented): PR-scoped by design — branch-scoped suppression
# on a branch with NO open PR is out of scope (nothing to comment on;
# the manual ci.yml dispatch lever covers it). Fork PRs comment fine
# but their ci.yml dispatch fails (head ref lives in the fork) — a
# warning, not an error.

on:
  schedule:
    # Every 10 minutes NOMINAL — measured 2026-10-23→30, GitHub
    # delivers only 5–15 of the 144 daily ticks (scheduled-event
    # scarcity under load, documented in
    # docs/automation/ci-event-delivery.md; on the support-ticket
    # ask). Detection latency is therefore bounded by DELIVERED
    # cadence, which is why the issue_comment trigger below exists.
    - cron: '*/10 * * * *'
  # Out-of-band redundancy (2026-10-29 window lesson): during the
  # synchronize-drop window, issue_comment events DELIVERED normally
  # (AI Commands ran at 19:31/20:30×2/21:24 inside the window) while
  # synchronize was lost — a different delivery lane. Every PR (or
  # issue) comment now buys a full sweep, so the moments a human is
  # most likely to be staring at a dark PR are exactly the moments the
  # watchdog looks. Recursion-safe: fault comments posted with
  # GITHUB_TOKEN do not re-trigger issue_comment workflows (the
  # documented recursion exemption) — no self-loop. COST (review
  # note, r1): a sweep is ~1-2 min ubuntu + up to 200 PRs × 4-5 gh
  # calls against the shared ~1,000 req/hr GITHUB_TOKEN budget, and
  # the newest-wins concurrency group lets a comment burst supersede
  # an in-flight sweep (idempotent — the next sweep re-covers). Cheap
  # at today's open-PR counts; revisit if comment volume or PR count
  # grows (a `paths`-style scope is not available to this trigger —
  # filtering would need an early-exit step in the job).
  issue_comment:
    types: [created]
  workflow_dispatch:

# Newest-wins: a newer sweep supersedes the previous one (numbering-
# gate convention).
concurrency:
  group: run-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  # Fault comments on PRs.
  pull-requests: write
  # gh workflow run (ci.yml re-dispatch). workflow_dispatch created
  # with GITHUB_TOKEN is one of the two recursion exemptions.
  actions: write
  # The core input: GET commits/{sha}/check-runs. Without this grant
  # every check-runs call 403s under GITHUB_TOKEN, the per-PR guard
  # skips every PR, and the sweep is SILENTLY INERT (r1 review critical
  # — numbering-gate.yml grants checks: for the identical call). Pinned
  # by TestRunWatchdogPermissionsPinned.
  checks: read

jobs:
  sweep:
    name: Detect zero-run PR heads (#1844)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true

      - name: Build runwatchdog
        run: make runwatchdog-build

      - name: Sweep open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 10 min (was 15, 2026-10-30): healthy synchronize→check-run
          # latency measured 5–50s (the 2026-10-30 probe + tonight's
          # healthy controls), so 10 min is ~12× the observed tail —
          # false faults need a head that queued runs for 10+ minutes
          # without registering a single check-run, which runner
          # queuing does not produce (runs register check-runs at
          # CREATION, queued included). 15→10 pulls first-tick
          # detection inside the 42-min dark window #1983's final head
          # actually sat through (20:30:07→21:12:44Z, manually
          # recovered). The Go DefaultMinAge stays 15m as the
          # zero-input fallback (pinned by TestEvaluate_MinAgeDefault);
          # this env is the operative value.
          WATCHDOG_MIN_AGE_MINUTES: "10"
        run: |
          set -uo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # watch_one <pr> <sha> <branch> <no_auto> — gather one PR's
          # inputs, decide in Go, execute. Failure model (GitHub's
          # default step shell is `bash -e {0}` — errexit is INJECTED):
          # per-PR probe failures (commit fetch, check-runs query) WARN
          # and skip that PR — the gate_one tolerance; the marker
          # enumeration is the deliberate EXCEPTION: it exits 1, which
          # under -e fails the step and ends the sweep (remaining PRs
          # are re-covered by the next 10-minute sweep) — a broken dedup
          # register must never mint duplicate fault comments +
          # image-publishing dispatches; a one-sweep deferral is the
          # accepted price. Comment/dispatch failures on a confirmed
          # fault are warnings (the lever is in the posted comment).
          watch_one() {
            local PR="$1" SHA="$2" BRANCH="$3" NOAUTO="$4"

            local COMMIT_DATE MSG CHECK_RUNS
            COMMIT_DATE=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.date' 2>/dev/null) || {
              echo "::warning::PR $PR: could not fetch head commit — skipping"; return 0; }
            MSG=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' 2>/dev/null) || {
              echo "::warning::PR $PR: could not fetch head commit message — skipping"; return 0; }
            CHECK_RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '.total_count' 2>/dev/null) || {
              echo "::warning::PR $PR: could not query check-runs — skipping"; return 0; }

            # Existing fault markers on this PR (dedup input): every
            # comment body carrying the marker, SHA extracted.
            # --paginate: chatty PRs cross the 100-comment page and the
            # PR's own recent markers land on page 2+ (r1 review) —
            # without it the dedup breaks exactly on the PRs that argue
            # most. Probe failure is LOUD (fails the sweep): a swallowed
            # failure here reads as "no markers" and mints duplicate
            # fault comments + image-publishing dispatches on every
            # sweep — the never-a-silent-skip rule. The jq streams one
            # SHA per hit per page; jq -R -s reassembles the pages into
            # one JSON array.
            local MARKER_LINES MARKERS_JSON
            MARKER_LINES=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[] | .body | select(contains("run-watchdog: fault sha=")) | capture("run-watchdog: fault sha=(?<sha>[0-9a-f]+)").sha') \
              || { echo "::error::PR $PR: comment enumeration failed — aborting sweep (a swallowed failure breaks the per-SHA dedup)"; exit 1; }
            MARKERS_JSON=$(printf '%s\n' "$MARKER_LINES" | jq -R -s 'split("\n") | map(select(length > 0))')

            local STATE DECISION
            STATE=$(jq -n \
              --argjson number "$PR" \
              --arg sha "$SHA" --arg branch "$BRANCH" \
              --arg date "$COMMIT_DATE" --arg msg "$MSG" --arg now "$NOW" \
              --argjson checks "${CHECK_RUNS:-0}" \
              --argjson markers "${MARKERS_JSON:-[]}" \
              --argjson noauto "$NOAUTO" \
              --argjson minam "${WATCHDOG_MIN_AGE_MINUTES:-15}" \
              '{number:$number, head_sha:$sha, head_branch:$branch,
                head_commit_date:$date, head_commit_message:$msg, now:$now,
                total_check_runs:$checks, existing_marker_shas:$markers,
                no_auto_retrigger:$noauto, min_age_minutes:$minam}')

            if ! DECISION=$(printf '%s' "$STATE" | ./bin/runwatchdog); then
              echo "::warning::PR $PR: runwatchdog evaluate failed — skipping"
              return 0
            fi
            echo "PR #$PR: $(printf '%s' "$DECISION" | jq -r .reason)"

            if [ "$(printf '%s' "$DECISION" | jq -r .should_comment)" = "true" ]; then
              printf '%s' "$DECISION" | jq -r .comment_body > "/tmp/watchdog-body-$PR.md"
              if gh pr comment "$PR" --repo "$REPO" --body-file "/tmp/watchdog-body-$PR.md"; then
                echo "PR #$PR: fault comment posted"
              else
                echo "::warning::PR $PR: fault comment FAILED to post"
              fi
            fi

            if [ "$(printf '%s' "$DECISION" | jq -r .should_dispatch)" = "true" ]; then
              if gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"; then
                echo "PR #$PR: ci.yml dispatched on $BRANCH"
              else
                # Fork PRs land here (head ref is fork-side) — the
                # comment already carries the manual lever.
                echo "::warning::PR $PR: ci.yml dispatch failed (fork head? branch gone?) — manual lever in the fault comment"
              fi
            fi
          }

          if ! PRS=$(gh pr list --state open --limit 200 --json number,headRefOid,headRefName,labels); then
            echo "::error::could not enumerate open PRs — watchdog sweep failed"
            exit 1
          fi
          COUNT=$(printf '%s' "$PRS" | jq 'length')
          echo "$COUNT open PR(s) to check (sweep $NOW)."
          [ "$COUNT" -gt 0 ] || exit 0

          # The 4th column is the JSON boolean for no_auto_retrigger
          # (label present → true → dispatch withheld), passed through
          # --argjson below — jq parses it as a real bool.
          printf '%s' "$PRS" | jq -r '.[] | [
            (.number | tostring),
            .headRefOid,
            .headRefName,
            ([.labels[].name] | contains(["watchdog:no-auto-retrigger"]))
          ] | @tsv' | while IFS=$'\t' read -r PR SHA BRANCH NOAUTO; do
            [ -n "$PR" ] || continue
            watch_one "$PR" "$SHA" "$BRANCH" "$NOAUTO"
          done

          echo "Run-watchdog sweep complete."
          # The job fails LOUD on exactly two conditions, both
          # intentional: (a) the gh pr list above failed (nothing was
          # swept); (b) a marker enumeration exited 1 inside the piped
          # while-loop (the dedup register is broken — the
          # never-a-silent-skip rule; under GitHub's injected
          # `bash -e`, that exit fails the pipeline and the step, and
          # the remaining PRs defer to the next sweep). Everything
          # else about a single PR is a warning.
          exit 0
