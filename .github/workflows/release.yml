name: Release

# Tag-triggered release pipeline. Cuts a real release when a `v*.*.*` tag
# is pushed:
#
#   1. Runs lint + tests (Go + frontend) to guarantee the tagged commit
#      is tested. Self-contained — does NOT depend on the CI workflow.
#   2. Builds and pushes multi-arch images (api, controller, frontend,
#      relay-router, relay-proxy, base) to ghcr.io with semver tags.
#   3. Signs images with cosign keyless (OIDC).
#   4. Scans images with Trivy (HIGH/CRITICAL gate for control-plane).
#   5. Packages the Helm chart and publishes to gh-pages.
#   6. Generates SBOM (CycloneDX) from each built image.
#   7. Publishes Python + TypeScript SDKs to PyPI + npm.
#   8. Creates a GitHub Release with notes from CHANGELOG.md.
#
# Tagging a release:
#
#   make release-tag VERSION=0.3.0
#
# The release notes are the section of CHANGELOG.md matching the tag. If the
# section is missing, the workflow fails — CHANGELOG.md is the source of
# truth for what shipped.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write   # for creating the GitHub Release + gh-pages push
  packages: write   # for signing images + reading image metadata
  id-token: write   # for cosign keyless OIDC signing

env:
  REGISTRY: ghcr.io
  API_IMAGE: lenaxia/llmsafespaces/api
  CONTROLLER_IMAGE: lenaxia/llmsafespaces/controller
  RUNTIME_IMAGE: lenaxia/llmsafespaces/base
  FRONTEND_IMAGE: lenaxia/llmsafespaces/frontend
  RELAY_ROUTER_IMAGE: lenaxia/llmsafespaces/relay-router
  RELAY_PROXY_IMAGE: lenaxia/llmsafespaces/relay-proxy
  AGENTD_IMAGE: lenaxia/llmsafespaces/agentd

jobs:
  # Gate: refuse to release a tag whose CHANGELOG section is missing.
  # Also resolves the canonical VERSION + REF for downstream jobs.
  verify-changelog:
    name: Verify CHANGELOG section exists
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve version and ref
        id: resolve
        env:
          # Pass through env, not interpolation, to avoid shell injection
          # from a malicious workflow_dispatch input (only triggerable by
          # repo write users, but defense-in-depth).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # workflow_dispatch: INPUT_TAG is "v0.3.0" or "0.3.0" — normalize.
          # tag push: github.ref is "refs/tags/v0.3.0".
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            # Strip optional leading "v"
            version="${tag#v}"
            # Resolve to the canonical tag ref.
            ref="refs/tags/v${version}"
          else
            ref="${{ github.ref }}"
            version="${ref#refs/tags/v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version}, ref=${ref}"

      - name: Check CHANGELOG section exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ! grep -E "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md >/dev/null; then
            echo "::error::CHANGELOG.md is missing a section for v${VERSION}."
            echo "::error::Add a heading like '## [${VERSION}] - $(date -u +%Y-%m-%d)' with the release notes."
            exit 1
          fi
          echo "CHANGELOG section for v${VERSION} found."

  prepare:
    name: Prepare build metadata
    needs: verify-changelog
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
      - id: ts
        run: echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  # Tests — guarantees the tagged commit is tested before images are
  # built. The release workflow is self-contained: it does not depend
  # on the CI workflow passing. These jobs are copies of CI's test jobs
  # (without the coverage/PR-comment steps that only make sense on PRs).

  lint:
    name: Lint
    needs: verify-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Repository layout lint
        run: make repolint
      - name: gofmt
        run: make fmt-check
      - name: goimports
        run: make imports-check
      - name: go vet
        run: go vet ./...
      - name: context.TODO check
        run: |
          if hits=$(grep -rn 'context.TODO()' --include='*.go' . \
              | grep -v '_test.go' \
              | grep -v 'zz_generated' \
              | grep -v 'sdks/'); then
            echo "$hits"
            echo "FAIL: context.TODO() found in production code."
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: helm-render
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          make helm-render
      - name: Validate OpenAPI spec
        run: make openapi-validate

  test:
    name: Test (-short, with coverage)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Run tests with coverage
        run: |
          go test -timeout 300s -race -short \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./... \
            ./...
      - name: Enforce coverage floor (50%)
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if awk -v t="$total" 'BEGIN { exit !(t < 50) }'; then
            echo "FAIL: total coverage ${total}% is below the 50.0% floor."
            exit 1
          fi

  test-full:
    name: Test (full suite, race detector)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Run full test suite with race detector
        run: go test -timeout 600s -race -count=1 ./...

  frontend-test:
    name: Frontend (unit + typecheck + e2e)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit
      - name: Unit tests
        run: cd frontend && npx vitest run
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E tests
        run: cd frontend && npx playwright test --reporter=line

  # All build jobs gate on tests passing. This guarantees the tagged
  # commit is tested before any image is published.
  build-api:
    name: Build API (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.API_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=api-${{ matrix.platform }}
          cache-to: type=gha,scope=api-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.verify-changelog.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: api-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    name: Merge API Manifest
    needs: [build-api, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: api-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.API_IMAGE }}@sha256:%s ' *)

  build-controller:
    name: Build Controller (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: controller/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=controller-${{ matrix.platform }}
          cache-to: type=gha,scope=controller-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.verify-changelog.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Smoke-test controller binary
        run: |
          docker buildx build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg VERSION=${{ needs.verify-changelog.outputs.version }} \
            -f controller/Dockerfile \
            --target builder \
            -t controller-smoke \
            --load \
            .
          MATCHES=$(docker run --rm --entrypoint sh controller-smoke -c \
            'if [ ! -s /out/manager ]; then echo "FATAL: /out/manager is empty"; exit 1; fi; \
             grep -ac "llmsafespaces_workspaces_running" /out/manager || true') || {
            echo "::error::docker run failed with exit code $?"
            exit 1
          }
          if [ "$MATCHES" -eq 0 ] 2>/dev/null; then
            echo "::error::Controller binary missing llmsafespaces_workspaces_running metric string."
            echo "This usually means Docker BuildKit served a stale cache layer."
            echo "Binary size: $(docker run --rm --entrypoint stat controller-smoke -c '%s' /out/manager) bytes"
            exit 1
          fi
          echo "Controller binary smoke test passed: llmsafespaces_* metric strings present"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: controller-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-controller:
    name: Merge Controller Manifest
    needs: [build-controller, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: controller-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}@sha256:%s ' *)

  build-runtime:
    name: Build Runtime Base (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: runtimes/base/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=runtime-${{ matrix.platform }}
          cache-to: type=gha,scope=runtime-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.verify-changelog.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: runtime-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-runtime:
    name: Merge Runtime Manifest
    needs: [build-runtime, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: runtime-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}@sha256:%s ' *)

  build-frontend:
    name: Build Frontend (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}
          cache-to: type=gha,scope=frontend-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    name: Merge Frontend Manifest
    needs: [build-frontend, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: frontend-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@sha256:%s ' *)

  # #863 / release-integrity: standalone agentd image, ported from the
  # tag-CI workflow so that RELEASE SUCCESS == ALL ARTIFACTS PUBLISHED.
  # Before this, release.yml went green while agentd:<version> was never
  # pushed (the tag CI built it — and when that run failed on a test
  # flake, v0.19.1 shipped with the API/controller on 0.19.1 and agentd
  # absent; discovered via a ghcr 404 during the ops bump).
  build-agentd:
    name: Build Agentd (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: cmd/workspace-agentd/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agentd-${{ matrix.platform }}
          cache-to: type=gha,scope=agentd-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export binary sha256
        run: |
          arch="${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}"
          tag="${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}:sha-${{ github.sha }}-${arch}"
          src="${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools create -t "$tag" "$src"
          docker pull --platform ${{ matrix.platform }} "$tag"
          cid="agentd-extract-$GITHUB_RUN_ID"
          docker create --platform ${{ matrix.platform }} --name "$cid" "$tag" \
            /usr/local/bin/workspace-agentd >/dev/null
          docker cp "$cid":/usr/local/bin/workspace-agentd /tmp/workspace-agentd
          docker rm -f "$cid" >/dev/null
          sha256sum /tmp/workspace-agentd | awk '{print $1}' > "/tmp/agentd-binary-${arch}.sha256"
          echo "arch=$arch binary-sha256=$(cat /tmp/agentd-binary-$arch.sha256)"

      - name: Upload binary sha256
        uses: actions/upload-artifact@v7
        with:
          name: agentd-binary-sha256-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: /tmp/agentd-binary-*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: agentd-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-agentd:
    name: Merge Agentd Manifest
    needs: [build-agentd, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: agentd-digests-*
          merge-multiple: true

      - name: Download binary sha256s
        uses: actions/download-artifact@v8
        with:
          path: /tmp/sha
          pattern: agentd-binary-sha256-*
          merge-multiple: true

      - name: Create manifest list and push
        id: create
        working-directory: /tmp/digests
        run: |
          amd64="$(cat /tmp/sha/agentd-binary-amd64.sha256)"
          arm64="$(cat /tmp/sha/agentd-binary-arm64.sha256)"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:dev.llmsafespaces/agentd.sha256-amd64=${amd64}" \
            --annotation "index:dev.llmsafespaces/agentd.sha256-arm64=${arm64}" \
            --annotation "index:dev.llmsafespaces/version=${{ needs.prepare.outputs.version }}" \
            $(printf '${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}@sha256:%s ' *)
          digest="$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}:sha-${GITHUB_SHA:0:7} --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Print Helm values block for agentdDelivery
        run: |
          echo "::notice::agentdDelivery values for this release:"
          cat <<EOF
          controller:
            agentdDelivery:
              image: ${{ env.REGISTRY }}/${{ env.AGENTD_IMAGE }}@${{ steps.create.outputs.digest }}
          EOF

  build-relay-router:
    name: Build Relay Router (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: cmd/relay-router/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=relay-router-${{ matrix.platform }}
          cache-to: type=gha,scope=relay-router-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.verify-changelog.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: relay-router-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-relay-router:
    name: Merge Relay Router Manifest
    needs: [build-relay-router, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: relay-router-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}@sha256:%s ' *)

  build-relay-proxy:
    name: Build Relay Proxy (${{ matrix.platform }})
    needs: [verify-changelog, prepare, test, test-full, frontend-test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: cmd/relay-proxy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=relay-proxy-${{ matrix.platform }}
          cache-to: type=gha,scope=relay-proxy-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ needs.verify-changelog.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.timestamp }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: relay-proxy-digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-relay-proxy:
    name: Merge Relay Proxy Manifest
    needs: [build-relay-proxy, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: relay-proxy-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=ts-${{ needs.prepare.outputs.timestamp }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}@sha256:%s ' *)

  # Sign all built images with cosign keyless (OIDC). Each signature is
  # recorded in the public Rekor transparency log, so anyone can verify
  # image provenance after the fact:
  #
  #   cosign verify ghcr.io/lenaxia/llmsafespaces/api:0.3.0 \
  #     --certificate-identity-regexp "https://github.com/lenaxia/LLMSafeSpaces" \
  #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
  sign-images:
    name: Sign images (cosign keyless)
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify-changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign each image
        # cosign sign with keyless OIDC: the OIDC token from GitHub Actions
        # is used to get a short-lived certificate from Fulcio. The identity
        # and issuer are automatically embedded in the certificate — we don't
        # pass them as flags (those are for `cosign verify`, not `cosign sign`).
        # The signature is recorded in Rekor automatically.
        run: |
          for img in api controller base frontend relay-router relay-proxy; do
            case "$img" in
              api) image_ref="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${VERSION}" ;;
              controller) image_ref="${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}:${VERSION}" ;;
              base) image_ref="${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}:${VERSION}" ;;
              frontend) image_ref="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION}" ;;
              relay-router) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}:${VERSION}" ;;
              relay-proxy) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}:${VERSION}" ;;
            esac
            echo "Signing ${image_ref}"
            cosign sign --yes "${image_ref}"
          done

  # Scan each built image with Trivy. Fail on HIGH/CRITICAL CVEs.
  # This complements the filesystem/config scan in security-scan.yml —
  # that scan covers source files; this scan covers the actual OCI images
  # (catches vulns in base images, installed packages, etc.).
  scan-images:
    name: Scan images (Trivy)
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify-changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        run: |
          curl -sLO https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          tar xzf trivy_0.70.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Scan each image
        # Control-plane images (api/controller/frontend/relay-router/relay-proxy)
        # gate the release: a HIGH/CRITICAL finding in any of these blocks
        # the GitHub Release from being cut.
        #
        # The base runtime image is treated as a warning surface. The base
        # is the workspace runtime — user code executes inside it — and it
        # inherits Debian bookworm's CVE backlog. The vast majority of
        # HIGH/CRITICAL findings there are `fix_deferred` or `will_not_fix`
        # upstream; Debian has not shipped fixed packages yet. Failing the
        # release on every bookworm CVE would prevent any release from
        # going out while Debian catches up. Instead we surface the
        # findings as a warning annotation and let the release proceed.
        #
        # Operators with stricter requirements can:
        #   - Build a custom base with newer packages (runtimeEnvironments).
        #   - Use a distroless/mutable base via runtimeEnvironments overrides.
        #   - Wait for Debian bookworm's next point release.
        run: |
          fail=0
          for img in api controller base frontend relay-router relay-proxy; do
            case "$img" in
              api) image_ref="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${VERSION}" ;;
              controller) image_ref="${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}:${VERSION}" ;;
              base) image_ref="${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}:${VERSION}" ;;
              frontend) image_ref="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION}" ;;
              relay-router) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}:${VERSION}" ;;
              relay-proxy) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}:${VERSION}" ;;
            esac
            echo "::group::Scanning ${image_ref}"

            if [ "$img" = "base" ]; then
              # Base (workspace runtime): surface findings but do not block.
              # First run prints the full table for the workflow log.
              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 0 \
                --ignorefile .trivyignore \
                "${image_ref}" || exit 1  # only fail on infrastructure error
              # Second run with --exit-code 1 detects whether HIGH/CRITICAL
              # were present (suppressed output) and emits a workflow
              # warning annotation for visibility.
              if ! trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --ignorefile .trivyignore \
                "${image_ref}" >/dev/null 2>&1; then
                echo "::warning::Trivy found HIGH/CRITICAL vulnerabilities in ${image_ref} (base runtime image, treated as warning — see scan table above)"
              fi
            else
              # Control-plane: fail the job on HIGH/CRITICAL.
              if ! trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --ignorefile .trivyignore \
                "${image_ref}"; then
                echo "::error::Trivy found HIGH/CRITICAL vulnerabilities in ${image_ref}"
                fail=1
              fi
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

  # Package the Helm chart and publish to the gh-pages branch's Helm repo.
  # chart-releaser-action independently discovers, packages, and publishes
  # charts from charts/ using Chart.yaml's version field — no manual
  # `helm package` step needed (and one was previously dead code).
  publish-chart:
    name: Publish Helm chart
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Publish to gh-pages Helm repo
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          config: .github/cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate SBOM (CycloneDX) for each image. Attached to the GitHub Release
  # as a release artifact so consumers can feed it into dependency-track,
  # grype, or similar.
  generate-sbom:
    name: Generate SBOM
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.27.0

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM for each image
        env:
          # CI's docker/metadata-action uses type=semver,pattern={{version}}
          # which produces "0.3.0" (no "v" prefix). Match that format.
          VERSION: ${{ needs.verify-changelog.outputs.version }}
        run: |
          mkdir -p sbom-out
          for img in api controller base frontend relay-router relay-proxy; do
            case "$img" in
              api) image_ref="${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${VERSION}" ;;
              controller) image_ref="${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE }}:${VERSION}" ;;
              base) image_ref="${{ env.REGISTRY }}/${{ env.RUNTIME_IMAGE }}:${VERSION}" ;;
              frontend) image_ref="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${VERSION}" ;;
              relay-router) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_ROUTER_IMAGE }}:${VERSION}" ;;
              relay-proxy) image_ref="${{ env.REGISTRY }}/${{ env.RELAY_PROXY_IMAGE }}:${VERSION}" ;;
            esac
            echo "Generating SBOM for ${image_ref}"
            syft "${image_ref}" -o cyclonedx-json > "sbom-out/${img}-${VERSION}.sbom.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ needs.verify-changelog.outputs.version }}
          path: sbom-out/*.json
          retention-days: 90

  # Build relay-proxy binaries for the multi-cloud inference relay fleet
  # (Epic 42). These are distributed to relay VMs via cloud-init with
  # SHA-256 verification. Attach to the GitHub Release so operators can
  # download them and wire them into controller.inferenceRelay.artifact.
  build-relay-binaries:
    name: Build relay-proxy binaries
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          mkdir -p deploy
          LDFLAGS="-s -w \
            -X github.com/lenaxia/llmsafespaces/pkg/version.Version=${{ needs.verify-changelog.outputs.version }} \
            -X github.com/lenaxia/llmsafespaces/pkg/version.CommitSHA=${{ github.sha }} \
            -X github.com/lenaxia/llmsafespaces/pkg/version.BuildTime=$(date -u +%Y-%m-%d_%H:%M:%S)"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o deploy/relay-proxy-arm64 ./cmd/relay-proxy/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o deploy/relay-proxy-amd64 ./cmd/relay-proxy/

      - name: Generate checksums
        run: |
          cd deploy
          sha256sum relay-proxy-arm64 relay-proxy-amd64 > checksums.txt

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-binaries-${{ needs.verify-changelog.outputs.version }}
          path: |
            deploy/relay-proxy-arm64
            deploy/relay-proxy-amd64
            deploy/checksums.txt
          retention-days: 7

  # Create the GitHub Release with notes from CHANGELOG.md.
  create-release:
    name: Create GitHub Release
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy, sign-images, scan-images, publish-chart, generate-sbom, build-relay-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.verify-changelog.outputs.version }}
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\] -" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted release notes are empty for v${VERSION}."
            exit 1
          fi

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ needs.verify-changelog.outputs.version }}
          path: sbom-out

      - name: Download relay binaries
        uses: actions/download-artifact@v8
        with:
          name: relay-binaries-${{ needs.verify-changelog.outputs.version }}
          path: relay-out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-changelog.outputs.version }}
        run: |
          cat > release-body.md <<EOF
          ## Images

          | Component | Image |
          |---|---|
          | API | \`ghcr.io/lenaxia/llmsafespaces/api:${VERSION}\` |
          | Controller | \`ghcr.io/lenaxia/llmsafespaces/controller:${VERSION}\` |
          | Runtime base | \`ghcr.io/lenaxia/llmsafespaces/base:${VERSION}\` |
          | Frontend | \`ghcr.io/lenaxia/llmsafespaces/frontend:${VERSION}\` |
          | Relay router | \`ghcr.io/lenaxia/llmsafespaces/relay-router:${VERSION}\` |
          | Relay proxy | \`ghcr.io/lenaxia/llmsafespaces/relay-proxy:${VERSION}\` |

          All images are signed with cosign keyless (OIDC). Verify:

          \`\`\`bash
          cosign verify ghcr.io/lenaxia/llmsafespaces/api:${VERSION} \\
            --certificate-identity-regexp "https://github.com/lenaxia/LLMSafeSpaces" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          \`\`\`

          ## Install

          \`\`\`bash
          helm repo add llmsafespaces https://lenaxia.github.io/LLMSafeSpaces/
          helm repo update
          helm install llmsafespaces llmsafespaces/llmsafespaces --version ${VERSION}
          \`\`\`

          ## Relay proxy binaries

          For the self-hosted multi-cloud inference relay fleet (Epic 42).
          Set \`controller.inferenceRelay.artifact.urls\` in Helm values to
          the download URL below, and \`sha256Arm64\`/\`sha256Amd64\` from
          \`checksums.txt\`.

          SBOM (CycloneDX JSON) for each image is attached below.

          ---

          EOF
          cat release-notes.md >> release-body.md

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-body.md \
            --verify-tag

      - name: Attach SBOM + relay binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-changelog.outputs.version }}
        run: |
          for f in sbom-out/*.json relay-out/*; do
            gh release upload "v${VERSION}" "$f"
          done

  # ─────────────────────────────────────────────────────────────────────
  # SDK publishing (Epic 62 US-62.8)
  # ─────────────────────────────────────────────────────────────────────
  # Publishes Python and TypeScript SDKs to PyPI and npm when a platform
  # release tag (v*.*.*) is pushed. SDK versions track the platform version
  # (the tag without the 'v' prefix). Maven Central is intentionally
  # skipped — see US-62.8 for rationale.

  publish-python-sdk:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set version from tag
        run: |
          VERSION="${{ needs.verify-changelog.outputs.version }}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" sdks/python/pyproject.toml
          echo "Publishing version ${VERSION}"
      - name: Build package
        run: pip install build && cd sdks/python && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  publish-typescript-sdk:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    needs: [verify-changelog, merge-api, merge-controller, merge-runtime, merge-frontend, merge-relay-router, merge-relay-proxy]
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version from tag
        run: |
          VERSION="${{ needs.verify-changelog.outputs.version }}"
          cd sdks/typescript
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "Publishing version ${VERSION}"
      - name: Build
        run: cd sdks/typescript && npm ci && npm run build
      - name: Publish to npm
        run: cd sdks/typescript && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
