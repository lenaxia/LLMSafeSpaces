          touch "/tmp/digests/${digest#sha256:}"

      - name: Smoke-test controller binary
        run: |
          docker buildx build \
            --build-arg VERSION=${{ needs.prepare.outputs.version }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -f controller/Dockerfile \
            --target builder \
            -t controller-smoke \
            --load \
            .
          MATCHES=$(docker run --rm --entrypoint sh controller-smoke -c \
            'if [ ! -s /out/manager ]; then echo "FATAL: /out/manager is empty"; exit 1; fi; \
             grep -ac "llmsafespaces_workspaces_running" /out/manager || true') || {
            echo "::error::docker run failed with exit code $?"
            exit 1
          }
          if [ "$MATCHES" -eq 0 ] 2>/dev/null; then
            echo "::error::Controller binary missing llmsafespaces_workspaces_running metric string."
            echo "This usually means Docker BuildKit served a stale cache layer."
            echo "Binary size: $(docker run --rm --entrypoint stat controller-smoke -c '%s' /out/manager) bytes"
            exit 1
