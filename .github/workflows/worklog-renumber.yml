name: Worklog Renumbering

# Post-merge worklog renumbering bot. Two triggers:
#
#   push to main:    fast path — renumbers NNNN_ sentinels immediately after
#                    every merge. The original location was inside ci.yml,
#                    which meant a PR merge commit containing [skip ci]
#                    (used by docs-only PRs to save CI minutes) bypassed
#                    the bot entirely. Worklog 0552 documents the
#                    incident: PR #414 used [skip ci] and the worklog
#                    NNNN_2026-06-26_provider-not-found-end-to-end.md
#                    sat unnumbered on main for hours, breaking
#                    TestLive_Worklogs_NoDuplicates for every downstream
#                    PR. By extracting to a dedicated workflow file we
#                    keep the fast path AND gain the schedule trigger
#                    below as a self-healing safety net.
#
#   schedule:        every 6 hours — catch-up pass for any push that
#                    bypassed the fast path (e.g. [skip ci] in a docs-
#                    only merge, GitHub Actions outage, or a workflow
#                    file edit that temporarily disabled this trigger).
#                    Idempotent: when no sentinels exist, the bot runs
#                    ./bin/repolint, sees no renames needed, and exits
#                    without committing. Cost: ~30s of runner time per
#                    cron tick.
#
#   workflow_dispatch: manual trigger for operators (rare).
#
# Race safety (#1838): SERIALIZED + tip-based + CAS retry.
#   - The concurrency group below queues runs (never cancels an
#     in-flight one) — at most ONE numbering pass executes at a time,
#     so two merges inside one bot-lag window can no longer each draw
#     the same next-free number from concurrent snapshots (the 1161x2 /
#     1164x2 mechanism).
#   - The checkout uses ref: main, not the triggering SHA: a queued run
#     always numbers the CURRENT tip, including whatever the previous
#     run's numbering commit just landed.
#   - The push is a compare-and-swap: main's fast-forward check IS the
#     lock. If main advanced between fetch and push, the push is
#     rejected; the retry loop rebases onto the new tip, re-runs the
#     fix pass (the interleaved merge may have added new sentinels),
#     amends, and pushes again (≤3 attempts). Git's tip is the CAS
#     register — no separate manifest file to conflict or drift.
#   - The assignment itself skips numbers claimed by OPEN PRs
#     (repolint's open-claims discovery, same #1838): a number held by
#     a pushed-but-unmerged branch is not free, which is what closed
#     the 1173x2 / 1175x2 branch-vs-branch class.
#   - The #1807 uniqueness invariant remains the detection net for the
#     degraded mode (offline/gh-less environments) and the numbering-gate
#     workflow reddens stale merge trees before they merge.

on:
  push:
    branches: [main]
    paths:
      - 'worklogs/**'
  schedule:
    # Every 6 hours at minute 17. Offset from :00 to avoid the
    # GitHub-Actions cron-storm at the top of each hour.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Serialize ALL numbering passes. cancel-in-progress: false — a queued
# run must never cancel an in-flight numbering commit.
concurrency:
  group: worklog-renumber
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  renumber:
    name: Assign worklog numbers
    runs-on: ubuntu-latest

    steps:
      # ref: main (#1838): number the CURRENT tip, not the triggering
      # SHA. A queued run (see the concurrency group) must see the
      # previous run's numbering commit — checking out a stale merge
      # SHA here is exactly how two runs minted 1164 twice.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache: true

      - name: Build repolint
        run: make repolint-build

      - name: Assign numbers to NNNN_ worklogs and fix collisions
        id: autofix
        env:
          MERGE_SUBJECT: ${{ github.event.head_commit.message }}
          # GH_TOKEN powers repolint's open-claims discovery (#1838):
          # the numbering pass skips numbers held by open PRs. Without
          # it (or offline) discovery degrades to nil — same behavior
          # as before #1838 — and the uniqueness net stays as backstop.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the PR number from the MERGE COMMIT that triggered
          # this run — BEFORE any rebase below rewrites HEAD. Because
          # the checkout is ref: main (not the triggering SHA), HEAD is
          # the tip (possibly other merges' commits), so the subject
          # comes from the push event's head_commit. On the cron and
          # dispatch paths it is empty — the comment step tolerates
          # that.
          #
          # Extraction: GitHub's squash/merge convention appends "(#PR)" as
          # the LAST parenthesized ref on the subject; titles also carry
          # ISSUE refs (#1182-class), and `tail -1` over all #Ns picked
          # those up (run 33428514243 commented on issue 1183 — not a PR —
          # and failed the whole job). Prefer the trailing (#N) form; fall
          # back to any #N only if that's absent. The comment step
          # validates with gh pr view before commenting.
          # Extraction lives in scripts/renumber-pr-num.sh (pure, no git
          # inside) with its regression suite pinning the exact bug shapes
          # (scripts/renumber_pr_num_test.go) — including the residual one
          # the suite caught: subject-before-body order in the fallback.
          PR_NUM=$(./scripts/renumber-pr-num.sh "$MERGE_SUBJECT" "$MERGE_SUBJECT")
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"

          OUTPUT=$(./bin/repolint -fix-worklogs-only 2>&1) || true
          echo "$OUTPUT"
          # Capture rename lines for the PR comment. Format:
          #   fix-worklogs: renamed NNNN_2026-06-22_foo.md → 0544_2026-06-22_foo.md
          RENAMES=$(echo "$OUTPUT" | grep '^fix-worklogs: renamed ' || true)
          if [ -z "$RENAMES" ]; then
            echo "No NNNN_ sentinels or collisions — nothing to rename"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Save renames to a file for the comment step (multiline safe).
            echo "$RENAMES" > /tmp/renames.txt
          fi

      - name: Commit and push if changed (CAS retry)
        if: steps.autofix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Worklog numbering applied:"
          git --no-pager diff --stat -- worklogs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worklogs/
          # [skip ci] keeps this commit from triggering the broader CI
          # workflow. The renumbering workflow itself is path-filtered to
          # worklogs/** so the auto-commit would still queue it, but the
          # cron trigger handles the next pass anyway — and the no-rename
          # idempotent exit keeps it cheap.
          git commit -m "chore(repolint): assign worklog numbers [skip ci]"
          # CAS (#1838): the push is the compare-and-swap on main's tip.
          # A rejection means main advanced under us — rebase onto the
          # new tip, re-run the fix pass (the interleaved merge may have
          # landed NEW sentinels), fold any extra renames into the
          # numbering commit, and retry. Bounded: after 3 attempts the
          # job fails loudly and the next trigger (or cron) retries from
          # a fresh tip.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::notice::push rejected (attempt $attempt/3) — main moved; rebasing and re-fixing"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::rebase onto new tip failed; leaving numbering to the next run"
              exit 1
            fi
            RETRY_OUTPUT=$(./bin/repolint -fix-worklogs-only 2>&1) || true
            RETRY_RENAMES=$(echo "$RETRY_OUTPUT" | grep '^fix-worklogs: renamed ' || true)
            if [ -n "$RETRY_RENAMES" ]; then
              echo "$RETRY_OUTPUT"
              echo "$RETRY_RENAMES" >> /tmp/renames.txt
            fi
            git add worklogs/
            git commit --amend --no-edit
          done
          echo "::error::could not push numbering commit after 3 attempts"
          exit 1

      - name: Comment assigned numbers on merged PR
        if: steps.autofix.outputs.changed == 'true' && steps.autofix.outputs.pr_num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.autofix.outputs.pr_num }}"

          # The numbering commit is the payload; the comment is best-effort.
          # An invalid/non-PR number (issue ref picked off a merge commit)
          # must never fail the job — the renames have already landed.
          if ! gh pr view "$PR_NUM" >/dev/null 2>&1; then
            echo "::notice::$PR_NUM is not a PR (likely an issue ref) — skipping the comment"
            exit 0
          fi

          # Build the comment body using a heredoc to avoid quote-nesting issues.
          {
            echo "## Worklog numbers assigned"
            echo ""
            echo "The post-merge bot assigned the following worklog number(s):"
            echo ""
            while IFS= read -r line; do
              # Extract the target filename from "fix-worklogs: renamed SRC → TARGET"
              TARGET=$(echo "$line" | sed 's/.*→ //')
              echo "- \`$TARGET\`"
            done < /tmp/renames.txt
          } > /tmp/full-comment.md

          gh pr comment "$PR_NUM" --body-file /tmp/full-comment.md || \
            echo "::warning::PR comment failed (non-fatal — numbering already applied)"
