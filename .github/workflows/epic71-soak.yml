name: Epic-71 soak (faultmatrix, #1312)

# The 2b merge gate ("soak green at the wave's head", #1312's soak row):
# the faultmatrix soak driver at dispatch scale — N sessions × fault
# rate λ for the requested duration, zero violations + convergence
# within the lease bound or the run fails. In-process by design (the
# real sessionstate authority + the fault stream; the kind-native
# live-stack variant is the pool upgrade, owner-scheduled) — so this
# runs on a standard runner and never occupies the privileged dind pool.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration (Go duration; the >=2h gate is 2h0m0s)"
        default: "2h0m0s"
        type: string
      sessions:
        description: "Session count N"
        default: "8"
        type: string
      fault_rate:
        description: "Fault probability per tick (0-1)"
        default: "0.5"
        type: string
      seed:
        description: "Deterministic fault-stream seed"
        default: "1"
        type: string

jobs:
  soak:
    name: faultmatrix soak (N x lambda, zero violations)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate soak inputs (no green no-op)
        run: |
          test -n "${{ inputs.duration }}" || { echo "::error::duration input is empty — the soak would skip"; exit 1; }
          python3 -c "import re
          raw0 = '${{ inputs.duration }}'.removesuffix('-iter')
          ds = re.findall(r'(\d+)(h|m|s)', raw0)
          secs = sum(int(n)*{'h':3600,'m':60,'s':1}[u] for n,u in ds) if ds else 0
          assert secs > 0, 'duration must parse to > 0'
          # The 2b merge gate is >=2h (the #1312 soak row). Shorter
          # dispatches are iteration cycles: allowed only with the
          # explicit opt-out suffix (e.g. 10s-iter).
          if secs < 7200 and not '${{ inputs.duration }}'.endswith('-iter'):
              print(f"::error::duration ${{ inputs.duration }} is below the 2h soak gate — append -iter explicitly for an iteration cycle")
              raise SystemExit(1)" \
            || { echo "::error::duration does not parse as a Go duration"; exit 1; }
      - name: Run the soak row
        env:
          LLMSAFESPACES_SOAK_DURATION: ${{ inputs.duration }}
          LLMSAFESPACES_SOAK_SESSIONS: ${{ inputs.sessions }}
          LLMSAFESPACES_SOAK_FAULT_RATE: ${{ inputs.fault_rate }}
          LLMSAFESPACES_SOAK_SEED: ${{ inputs.seed }}
        # go test -timeout derives from the soak duration + 30m of
        # build/gate headroom (the job-level 360m is the hard cap). A
        # SKIP is a green no-op — the dispatch exists to RUN the soak.
        run: |
          DUR="${LLMSAFESPACES_SOAK_DURATION%-iter}" # strip the iteration-cycle opt-out suffix
          LLMSAFESPACES_SOAK_DURATION="$DUR" TIMEOUT=$(python3 -c "import re,os
          d = sum(int(n)*{'h':3600,'m':60,'s':1}[u] for n,u in re.findall(r'(\d+)(h|m|s)', os.environ['LLMSAFESPACES_SOAK_DURATION']))
          print(f'{d//60 + 30}m')")
          export LLMSAFESPACES_SOAK_DURATION="$DUR"
          echo "soak timeout: $TIMEOUT"
          set -o pipefail
          go test -race -count=1 -timeout "$TIMEOUT" -run TestSoak_Dispatch -v ./cmd/workspace-agentd/faultmatrix/ 2>&1 | tee /tmp/soak.log
          # The soak must have RUN and PASSED: a SKIP is a green
          # no-op, and a zero-match -run (rename, package move, build
          # tag) exits 0 with no tokens at all — require the PASS token.
          if grep -q -- "--- SKIP: TestSoak_Dispatch" /tmp/soak.log; then
            echo "::error::TestSoak_Dispatch SKIPPED — the soak did not run"
            exit 1
          fi
          if ! grep -q -- "--- PASS: TestSoak_Dispatch" /tmp/soak.log; then
            echo "::error::no PASS token for TestSoak_Dispatch — zero tests ran (rename/move?) or it failed"
            exit 1
          fi
      - name: Soak summary
        if: always()
        run: echo "soak dispatch complete (duration=${{ inputs.duration }} sessions=${{ inputs.sessions }} rate=${{ inputs.fault_rate }} seed=${{ inputs.seed }}) — see the Run the soak row step for the gate line"
