name: E2E Nightly (kind)

# Never double-run: one concurrency group covers every entry path
# (schedule, manual dispatch, any future dispatch source) — whichever
# run starts latest wins and the other is canceled.
concurrency:
  group: e2e-nightly
  cancel-in-progress: true

on:
  schedule:
    # 2:17am Pacific (09:17 UTC) daily — odd-minute off-peak
    # scheduling (1:17am Pacific after the November PST change — the
    # pinned UTC slot is the contract); GitHub's scheduler runs best-effort and the previous
    # 06:00 UTC top-of-hour slot fired 4-6h late (11-run sample). (A
    # platform-trigger dispatch experiment ran here briefly and was
    # decommissioned in favor of this fix.)
    - cron: "17 9 * * *"
  workflow_dispatch: # Allow manual trigger

env:
  CLUSTER_NAME: llmsafespaces-ci
  IMAGE_TAG: ci
  NS: llmsafespaces

jobs:
  e2e-kind:
    name: Full system E2E (kind cluster)
    runs-on: ubuntu-latest
    # 60m: the Epic 70 US-70.1 secret-delivery step provisions a
    # RESUME_SCALE=10 (AC-13) batch of workspaces; prior steps had ~30m
    # of headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Start local registry (digest-pinned agentd delivery)
        run: |
          # The sidecar-mode nightly needs controller.agentdDelivery.image
          # DIGEST-PINNED (controller startup validation); digest refs must
          # resolve in-node. Same pattern as scripts/us2-kind-integration.sh.
          docker run -d --restart=always -p "127.0.0.1:5001:5000" \
            --network bridge --name lss-e2e-registry registry:3
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5001/v2/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "registry did not become ready"; exit 1

      - name: Create kind cluster
        run: |
          # 2-node topology (kind-cluster-nightly.yaml): the nightly's
          # class retirement for its capacity walls (AC-1c/AC-13/AC-11 —
          # three FailedScheduling Insufficient cpu walls on one hosted
          # node). The shared kind-cluster.yaml stays single-node for
          # the pool (calibrated dind topology) and the weekly run.
          kind create cluster --config local/kind-cluster-nightly.yaml --name $CLUSTER_NAME
          # Alias localhost:5001 inside every node to the registry container
          # (local/kind-cluster-nightly.yaml enables the certs.d config path).
          for node in $(kind get nodes --name $CLUSTER_NAME); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
            printf '[host."http://lss-e2e-registry:5000"]\n' \
              | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml
          done
          if [ "$(docker inspect -f='{{json .NetworkSettings.Networks.kind}}' lss-e2e-registry)" = "null" ]; then
            docker network connect kind lss-e2e-registry
          fi

      - name: Build and load images
        run: |
          # Stamp build versions so the e2e cluster's healthz/platform-info
          # surfaces report the e2e build identity (semver-style tag name
          # without a leading "v") instead of the "unknown" default.
          E2E_VERSION="${{ env.IMAGE_TAG }}"
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f api/Dockerfile -t llmsafespaces/api:$IMAGE_TAG .
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f controller/Dockerfile -t llmsafespaces/controller:$IMAGE_TAG .
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f runtimes/base/Dockerfile -t llmsafespaces/runtime-base:$IMAGE_TAG .

          # agentd delivery artifact → local registry (digest-pinned ref +
          # binary sha for the entrypoint/supervisor verify pins).
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" \
            -f cmd/workspace-agentd/Dockerfile -t localhost:5001/llmsafespaces/agentd:$IMAGE_TAG .
          docker push localhost:5001/llmsafespaces/agentd:$IMAGE_TAG >/dev/null
          AGENTD_REF=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/llmsafespaces/agentd:$IMAGE_TAG)
          case "$AGENTD_REF" in
            *@sha256:*) AGENTD_REF="localhost:5001/llmsafespaces/agentd:$IMAGE_TAG@${AGENTD_REF##*@}" ;;
            *) echo "could not determine agentd digest"; exit 1 ;;
          esac
          CID=$(docker create localhost:5001/llmsafespaces/agentd:$IMAGE_TAG no-start)
          docker cp "$CID:/usr/local/bin/workspace-agentd" /tmp/workspace-agentd >/dev/null 2>&1 || { docker rm -f "$CID"; echo "agentd binary extract failed"; exit 1; }
          docker rm -f "$CID" >/dev/null 2>&1
          BINARY_SHA=$(sha256sum /tmp/workspace-agentd | cut -d' ' -f1)
          [ -n "$BINARY_SHA" ] || { echo "agentd binary hash failed"; exit 1; }
          echo "AGENTD_REF=$AGENTD_REF" >> "$GITHUB_ENV"
          echo "AGENTD_BINARY_SHA=$BINARY_SHA" >> "$GITHUB_ENV"

          # Design 0053 §4.2 (S3 mandatory): opencode delivery artifact →
          # same local-registry pattern (digest-pinned ref + binary sha
          # for the supervisor verify pins).
          docker build --network host \
            -f runtimes/opencode/Dockerfile -t localhost:5001/llmsafespaces/opencode:$IMAGE_TAG .
          docker push localhost:5001/llmsafespaces/opencode:$IMAGE_TAG >/dev/null
          OPENCODE_REF=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/llmsafespaces/opencode:$IMAGE_TAG)
          case "$OPENCODE_REF" in
            *@sha256:*) OPENCODE_REF="localhost:5001/llmsafespaces/opencode:$IMAGE_TAG@${OPENCODE_REF##*@}" ;;
            *) echo "could not determine opencode digest"; exit 1 ;;
          esac
          OC_CID=$(docker create localhost:5001/llmsafespaces/opencode:$IMAGE_TAG no-start)
          docker cp "$OC_CID:/usr/local/bin/opencode" /tmp/opencode-bin >/dev/null 2>&1 || { docker rm -f "$OC_CID"; echo "opencode binary extract failed"; exit 1; }
          docker rm -f "$OC_CID" >/dev/null 2>&1
          OPENCODE_BINARY_SHA=$(sha256sum /tmp/opencode-bin | cut -d' ' -f1)
          [ -n "$OPENCODE_BINARY_SHA" ] || { echo "opencode binary hash failed"; exit 1; }
          echo "OPENCODE_REF=$OPENCODE_REF" >> "$GITHUB_ENV"
          echo "OPENCODE_BINARY_SHA=$OPENCODE_BINARY_SHA" >> "$GITHUB_ENV"

          # Retag runtime-base with the ghcr.io/lenaxia/ prefix so the
          # RuntimeEnvironment validating webhook's image allow-list accepts
          # it (the webhook requires ghcr.io/lenaxia/ prefixed images).
          docker tag llmsafespaces/runtime-base:$IMAGE_TAG ghcr.io/lenaxia/llmsafespaces/runtime-base:$IMAGE_TAG

          kind load docker-image llmsafespaces/api:$IMAGE_TAG --name $CLUSTER_NAME
          kind load docker-image llmsafespaces/controller:$IMAGE_TAG --name $CLUSTER_NAME
          kind load docker-image ghcr.io/lenaxia/llmsafespaces/runtime-base:$IMAGE_TAG --name $CLUSTER_NAME

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.0/cert-manager.yaml
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s

      - name: Create credentials Secret (before Postgres)
        # The Postgres/Valkey manifests reference llmsafespaces-credentials
        # for their passwords. The chart normally creates this Secret as a
        # pre-install hook — but Postgres must start BEFORE the chart (the
        # API needs Postgres to pass readiness). Create the namespace +
        # Secret first with known non-insecure passwords, then pass the
        # same passwords to helm install so the chart does not rotate them.
        run: |
          kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n $NS create secret generic llmsafespaces-credentials \
              --from-literal=postgres-password=e2e-pg-pw-2026 \
              --from-literal=redis-password=e2e-redis-pw-2026 \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Postgres + Redis
        run: |
          kubectl apply -f local/postgres-redis.yaml
          kubectl -n $NS rollout status deployment/postgres --timeout=180s
          kubectl -n $NS rollout status deployment/valkey --timeout=180s

      - name: Helm install LLMSafeSpaces
        # id: the epic-72 evidence lane's conditions reference this
        # step's outcome (#1541: the lane must run after unrelated row
        # failures, but NEVER against a failed install — a broken
        # install would poison the drill/sweep evidence record).
        id: helm-install
        run: |
          # MCP is disabled in the nightly e2e: the cmd/mcp binary has no
          # Dockerfile yet so there is no image to pull. The MCP pod readiness
          # and connectivity steps below are skipped when mcp.enabled=false.
          # Re-enable once a Dockerfile is added (tracked in issue #28).
          #
          # AC-1d (us-70 suite): the mock-llm pod carries relay-router
          # labels and rides the podSelector egress allow the lever below
          # renders — the same mechanism the pool sets
          # (us-70-delivery-pool.yml). Without it the default RFC1918
          # egress block times the row out on every destination form and
          # gates every downstream suite (nightly 35513961442 vs pool run
          # 35509103926). NOTE: the helm command's backslash continuation
          # must stay unbroken — a mid-continuation comment amputates
          # every flag after it (bash joins+discards the comment line and
          # the next flag becomes a fresh command; pinned by
          # TestUS70AC1D_MockEgressLeverInNightly).
          helm upgrade --install llmsafespaces helm \
            -n $NS --create-namespace \
            --set api.image.repository=llmsafespaces/api \
            --set api.image.tag=$IMAGE_TAG \
            --set api.image.pullPolicy=IfNotPresent \
            --set controller.image.repository=llmsafespaces/controller \
            --set controller.image.tag=$IMAGE_TAG \
            --set controller.image.pullPolicy=IfNotPresent \
            --set mcp.enabled=false \
            --set postgresql.host=postgres \
            --set postgresql.port=5432 \
            --set postgresql.user=llmsafespaces \
            --set postgresql.database=llmsafespaces \
            --set redis.host=redis-master \
            --set redis.port=6379 \
            --set externalSecret.create=true \
            --set "externalSecret.postgresPassword=e2e-pg-pw-2026" \
            --set "externalSecret.redisPassword=e2e-redis-pw-2026" \
            --set rbac.scope=cluster \
            --set relayOnlyKeyDelivery.enabled=false \
            --set api.config.logging.development=true \
            --set "controller.agentdDelivery.image=${{ env.AGENTD_REF }}" \
            --set "controller.agentdDelivery.binarySHA256Amd64=${{ env.AGENTD_BINARY_SHA }}" \
            --set "controller.agentdDelivery.binarySHA256Arm64=${{ env.AGENTD_BINARY_SHA }}" \
            --set "controller.opencodeDelivery.image=${{ env.OPENCODE_REF }}" \
            --set "controller.opencodeDelivery.binarySHA256Amd64=${{ env.OPENCODE_BINARY_SHA }}" \
            --set "controller.opencodeDelivery.binarySHA256Arm64=${{ env.OPENCODE_BINARY_SHA }}" \
            --set controller.agentdSidecar.enabled=true \
            --set networkPolicy.allowRelayRouterEgress=true \
            --set "api.extraEnv[0].name=LLMSAFESPACES_SECRETS_RECONCILE_INTERVAL,api.extraEnv[0].value=5s" \
            --wait --timeout 5m

      - name: Wait for rollout
        run: |
          kubectl -n $NS rollout status deployment/llmsafespaces-api --timeout=180s
          kubectl -n $NS rollout status deployment/llmsafespaces-controller --timeout=180s

      # F1/F2/F3 runtime verification — skipped until MCP image exists (issue #28).
      # The helm render unit tests (TestF1/TestF2/TestF3) cover the template
      # layer on every PR. This step validates the running pod once buildable.
      - name: E2E — MCP pod readiness (F1/F2/F3 runtime verification)
        if: false  # Re-enable when cmd/mcp Dockerfile added (issue #28)
        run: |
          set -euo pipefail
          NS=${{ env.NS }}

          # Assert MCP pod is Running and Ready (not just Pending/CrashLoop).
          MCP_READY=$(kubectl -n "$NS" get pods \
            -l app.kubernetes.io/component=mcp \
            -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
          if [[ "$MCP_READY" != "true" ]]; then
            echo "FAIL: MCP pod not Ready — likely PSA rejection (F3) or probe hang (F2)"
            kubectl -n "$NS" describe pod -l app.kubernetes.io/component=mcp || true
            exit 1
          fi
          echo "OK: MCP pod is Ready"

          # Assert MCP pod is in the correct namespace (F1 regression check).
          MCP_NS=$(kubectl -n "$NS" get pod \
            -l app.kubernetes.io/component=mcp \
            -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null || echo "")
          if [[ "$MCP_NS" != "$NS" ]]; then
            echo "FAIL: MCP pod is in namespace '$MCP_NS', expected '$NS' (F1 namespace fix regression)"
            exit 1
          fi
          echo "OK: MCP pod is in namespace $NS (F1)"

          # Port-forward to the MCP Service and verify the /sse endpoint accepts
          # a TCP connection (matching the tcpSocket probe semantics from F2).
          kubectl -n "$NS" port-forward svc/llmsafespaces-mcp 13001:3001 >/dev/null 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 13001 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 13001 2>/dev/null; then
            echo "FAIL: MCP Service port 3001 not reachable after 10s (F2 probe regression?)"
            exit 1
          fi
          echo "OK: MCP Service port 3001 accepting connections (F2)"
          kill $PF_PID 2>/dev/null || true

      # F8 regression test at runtime: verify that a pod labeled
      # component=migrate can reach Valkey:6379 (the new allow rule),
      # and that a pod without that label cannot (the policy is enforced).
      # Runs as a bare pod with the migrate Job's labels so the NetworkPolicy allows it.
      - name: E2E — Valkey migrate-rule connectivity (F8 runtime verification)
        run: |
          set -euo pipefail
          NS=${{ env.NS }}

          # Get the Valkey ClusterIP. Lookup is BY NAME: the valkey
          # Service in local/postgres-redis.yaml carries
          # no metadata labels (app: valkey lives on the Deployment
          # and in the Service's selector), so label-based Service
          # discovery matches nothing and F8 silently skipped on every
          # nightly in history (issue #1456).
          VALKEY_IP=$(kubectl -n "$NS" get svc valkey \
            -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")
          if [[ -z "$VALKEY_IP" ]]; then
            echo "SKIP: valkey Service not found; skipping F8 connectivity check"
            exit 0
          fi

          # Run a one-shot probe pod carrying the migrate Job's labels.
          # The NetworkPolicy now allows this pod to reach Valkey:6379 (F8 fix).
          kubectl -n "$NS" run valkey-migrate-probe \
            --image=busybox:1.36 \
            --restart=Never \
            --labels="app.kubernetes.io/component=migrate,app.kubernetes.io/instance=llmsafespaces" \
            --command -- sh -c "nc -z -w5 $VALKEY_IP 6379 && echo REACHABLE || echo BLOCKED"

          # Wait for completion.
          for i in $(seq 1 30); do
            PHASE=$(kubectl -n "$NS" get pod valkey-migrate-probe \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            if [[ "$PHASE" == "Succeeded" || "$PHASE" == "Failed" ]]; then break; fi
            sleep 2
          done

          # Verdict classification rides RESULT emptiness, never the
          # (possibly stale) wait-loop PHASE sample: the phase is
          # re-fetched AFTER the logs read — a pod completing just past
          # the loop window still left its verdict in the logs
          # (#1459 withdrawal delta 1).
          RESULT=$(kubectl -n "$NS" logs valkey-migrate-probe 2>/dev/null || echo "")
          PHASE=$(kubectl -n "$NS" get pod valkey-migrate-probe \
            -o jsonpath='{.status.phase}' 2>/dev/null || echo "")

          if [[ "$RESULT" == *"REACHABLE"* ]]; then
            kubectl -n "$NS" delete pod valkey-migrate-probe --ignore-not-found >/dev/null 2>&1 || true
            echo "OK: migrate-labeled pod reached Valkey:6379 (F8)"
            exit 0
          fi

          # Diagnostics BEFORE the delete — a delete-first dump describes
          # a corpse (#1459 withdrawal delta 2).
          echo "=== probe pod (pre-delete) ==="
          kubectl -n "$NS" describe pod valkey-migrate-probe || true
          echo "=== probe pod events ==="
          kubectl -n "$NS" get events \
            --field-selector involvedObject.name=valkey-migrate-probe || true
          kubectl -n "$NS" delete pod valkey-migrate-probe --ignore-not-found >/dev/null 2>&1 || true

          if [[ -n "$RESULT" ]]; then
            # The probe ran and could not connect — a REAL F8 verdict.
            echo "=== datastore NetworkPolicies ==="
            kubectl -n "$NS" get networkpolicy -o yaml || true
            echo "FAIL: migrate-labeled pod could not reach Valkey:6379 (F8 regression — NetworkPolicy blocking migrate-labeled pods)"
            echo "Result: $RESULT (final phase: $PHASE)"
            exit 1
          fi

          # No verdict at all: the probe never ran to completion (image
          # pull / scheduling / transient API error) — F8 is UNVERIFIED
          # this run, not failed. WARN without gating the ten downstream
          # rows on a leg that produced no signal (#1459 delta 1).
          echo "WARN: valkey migrate probe produced no verdict (final phase: ${PHASE:-unknown}) — F8 unverified this run; not gating downstream suites"
          exit 0

      - name: Run e2e test suite
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          RUNTIME_IMAGE_REF: ghcr.io/lenaxia/llmsafespaces/runtime-base:ci
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: bash local/test.sh

      - name: Run attachment e2e rows (Epic 68 E2/E10/E11)
        # Cluster-level upload rows: PVC persistence across
        # suspend/resume, multi-tenant isolation, pod-kill chaos. The
        # nightly installs with agentdSidecar.enabled=true; design 0060
        # (stage-and-signal) ships sidecar upload DELIVERY — the script's
        # D1 gate feature-detects (#1535): 201 → the rows run fully in
        # sidecar mode; 502/503 → the pre-0060 loud skip; else → hard
        # fail (broken, never absorbed).
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
        run: bash local/us-68-attachments-e2e.sh

      - name: Run upload staging stress rows (design 0060 §6)
        # The §6 invariant harness: measured staging residency (gauge
        # pins), credential isolation under storm, disk-margin edges,
        # mid-stream kills, ack-latency baseline. SR-6 skips-DOWN loudly
        # when the baseline upload 507s (the half-stack's designed clean-fail — the supervisor apply leg,
        # #1518/#1524, not yet merged) — the in-run gate, not a silent
        # step-level if (run 35679282297's adjudication).
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18084
        run: bash local/us-1500-upload-stress-e2e.sh

      - name: Run secret-delivery e2e rows (Epic 70 US-70.1 AC-1/2/13/17 + chaos)
        # Cluster-bound spawn-time-pull acceptance rows: cold-create env
        # (AC-1), suspend→resume env ≤90s with no reload (AC-2), concurrent
        # resumes with p95 budget + identical spawned_rev (AC-13/17), and
        # agent-kill convergence (chaos). The nightly runs the bounded
        # suspend variant (SUSPEND_SECONDS=5); the ≥1h #1087 gate and the
        # gVisor/runsc leg are gated behind env/flags for the US-70.0 staged
        # pool (the script SKIPs the runsc leg loudly when no RuntimeClass
        # is advertised). Seed-created user + API key via local postgres.
        #
        # #1541: this step is ARMED (!cancelled() + install-success) — it
        # creates the mock-llm Service the epic-72 drill depends on, so an
        # unrelated earlier-row failure (tonight's SR-6 class, run
        # 35737624754) must not skip it and hostage the epic-72 evidence
        # lane downstream. It still skips on a failed install (its own
        # prerequisite).
        id: us70-suite
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18083
          SUSPEND_SECONDS: 5
          # AC-13 scale: the nightly's job is regression detection on ITS
          # envelope — 10 keeps the concurrent-resume semantics (wave-capped
          # boots of 5) inside the hosted runner's observed ~10-standing-
          # workspace-pod ceiling; scale fidelity belongs to the pool's
          # calibrated dind runner (scale 40). 100 was infeasible-by-
          # construction here and blocked every downstream suite when wave
          # 2 failed to schedule (nightly 35539089435).
          RESUME_SCALE: 10
          P95_BUDGET_MS: 30000
          # Must match the helm api.extraEnv reconcile-interval set above —
          # the AC-8/AC-10 convergence budgets derive from it (lockstep pin
          # in local/us70_harness_script_test.go).
          RECONCILE_INTERVAL_S: 5
        run: bash local/us-70-secret-delivery-e2e.sh

      - name: Run graceful-restart e2e rows (#1342 incident replay + kill-9 backstop)
        # The 2026-09-11 incident at cluster scale: a credential change
        # landing mid-streaming-turn must defer (never force-kill), surface
        # CredentialsApplyPending, and apply via the interrupt-first force
        # path once the stream stalls (R1); a kill -9 mid-tool must leave
        # NO eternal spinner — the generation-change sweep + transcript
        # repair close the part as aborted (R2). LLM_MODEL must name the
        # cluster's free-tier relay model (same one the us-63 suite uses).
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18085
          LLM_MODEL: ${{ vars.E2E_LLM_MODEL || 'litellm/glm-4.7' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          R1_STREAM_S: 40
        run: |
          # Real-LLM rows (streaming tool turns): without creds both rows
          # burn 120s each timing out ("tool never reached running
          # state") and block the downstream arbitration (run
          # 35564258221). SKIP loudly — the F8 SKIP-on-absent pattern —
          # so downstream suites proceed; coverage returns when the
          # owner configures the creds.
          if [[ -z "${LLM_API_KEY:-}" ]]; then
            echo "SKIP: LLM_API_KEY not configured — the #1342 rows are real-LLM rows (streaming tool turns); configure secrets.LLM_API_KEY (+ vars.E2E_LLM_MODEL) to restore coverage. Not gating downstream suites on absent creds."
            exit 0
          fi
          bash local/issue-1342-graceful-restart-e2e.sh

      - name: Run automation trigger e2e rows (#1410/#1411/#1412/#1413)
        # API-only rows for the automation defects the 2026-09-17 live
        # session proved broken: cron create validation + first-occurrence
        # slot (R1), reschedule moving nextFireAt immediately (R2), no-op
        # enable keeping the slot (R3), missing-workflow fires recorded as
        # failed with failure accounting instead of ticking silently (R4),
        # and workflow-run input obeying inputSchema (R5). No LLM model —
        # workflow-targeted triggers point at a nonexistent DAG.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18086
          R4_WAIT_S: 150
        run: bash local/issue-1410-1412-automation-e2e.sh

      - name: Run routine session-index e2e rows (#1452)
        # Preserved routine sessions must be discoverable in the platform
        # session list: the routine fire path never rides the adapter
        # routes that populate the session_index, so a PreserveAlways
        # fire's session is indexed at fire completion (R1: webhook-fired
        # routine delivers, its captured session_id appears in
        # GET /workspaces/:id/sessions titled with the trigger name) and
        # a PreserveNever fire leaves no row (R2 — the ephemeral session
        # is deleted agent-side). No LLM model — the routine agent node
        # resolves the workspace default.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18087
          FIRE_WAIT_S: 300
        run: bash local/issue1452-routine-session-index-e2e.sh

      - name: Run scriptenv e2e rows (#1455)
        # Script-node environment contract + http-node secrets
        # coordinate. The nightly installs agentdSidecar.enabled=true:
        # R1 asserts a script node fails LOUD there
        # (script_env_unavailable naming the sidecar cause — never the
        # pre-fix incidental "stat /tmp" script_failed; single-container
        # clusters get the execute-post-EnvCheck arm instead). R2 binds
        # an env-secret and asserts an http node's {{secrets.*}} header
        # refs resolve from the materialized (sidecar: relocated)
        # secrets-env coordinate via an in-cluster header-echo upstream,
        # with unbound refs staying literal.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18088
          RUN_WAIT_S: 300
        run: bash local/issue-1455-scriptenv-e2e.sh

      - name: Run templating e2e rows (#1417)
        # Agent-prompt dotted-path rendering: a workflow run with
        # {{.body.topic}} + {{.missing.path}} executes against an
        # in-cluster echo-upstream; the run output must carry the
        # rendered value (T1) and the literal ref (T2).
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18086
          RUN_WAIT_S: 300
        run: bash local/issue-1417-templating-e2e.sh

      - name: Run revisions e2e rows (Epic 70 US-70.2 REV-0..REV-4)
        # Two-tier-revision acceptance rows: v2 contract feature-detect
        # (REV-0 — loud-skips ALL rows when the deployed API predates the
        # envelope, so a mixed fleet / pre-merge nightly stays green),
        # identical revisions from two API replicas (REV-1), conditional
        # pull 304/ETag + monotonic seq (REV-2), anchored spawned_rev
        # (REV-3), and pull-vs-push batch identity (REV-4). Scales the
        # API deployment to 2 replicas mid-suite and restores it.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18084
        run: bash local/us-70-revisions-e2e.sh

      - name: Run dev-preview tunnel e2e (#1332/#1333)
        # The 2026-09-10/11 "tunnel not passing CSS" incident legs:
        #   #1333: bare /dev-preview/:port 308s to the slash form (query
        #          preserved); follow → HTML + relative CSS resolve under
        #          the port prefix; mis-resolved asset path and denied
        #          port stay 400 (validation outranks normalization).
        #   #1332: default install → dev_preview_url tool fails loud
        #          naming LLMSAFESPACE_API_PUBLIC_URL (never emits .svc);
        #          patched --api-public-url → recreated pod → tool emits
        #          the configured public FQDN end-to-end. Patches and
        #          restores the controller deployment args around the leg.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18085
          TOOL_PF_PORT: 18097
        run: bash local/dev-preview-tunnel-e2e.sh

      - name: Run V2 session-queue behavioral e2e (US-63.3/63.4/63.9)
        # Hard-assert behavioral properties that unit tests cannot cover:
        #   US-63.3: enqueue while busy → runs after current turn
        #   US-63.4: abort mid-turn → queued messages survive and run
        #   US-63.9: kill opencode → restart → stranded input drains
        # Requires LLM credentials (for real turns) and the workspace
        # created by local/test.sh above. Skipped if no LLM creds.
        if: ${{ env.LLM_API_KEY != '' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18080
          WORKSPACE_NAME: e2e00000-0000-0000-0000-000000000001
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: bash local/us-63-v2-behavior-e2e.sh

      - name: Run startup latency benchmarks (S18.10)
        # Benchmarks require LLM credentials so workspaces can reach Active.
        # Conservative CI thresholds catch gross regressions (e.g. re-adding
        # the provider-connectivity readyz gate) without being sensitive to
        # kind cluster resource noise. Tighten after S18.11 baseline is set.
        if: ${{ env.LLM_API_KEY != '' }}
        env:
          NS: ${{ env.NS }}
          API_URL: http://localhost:30080
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          echo "=== Resume benchmark ==="
          bash hack/benchmark-resume.sh \
            --iterations 3 \
            --namespace "$NS" \
            --api-url "$API_URL" \
            --api-key "$LLM_API_KEY" \
            --assert \
            --max-p99-total 180 \
            --max-p99-pod-to-readyz 30 \
            2>&1 | tee /tmp/bench-resume.txt

          echo ""
          echo "=== Create benchmark (no packages) ==="
          bash hack/benchmark-create.sh \
            --iterations 3 \
            --namespace "$NS" \
            --api-url "$API_URL" \
            --api-key "$LLM_API_KEY" \
            --assert \
            --max-p99-total 180 \
            2>&1 | tee /tmp/bench-create.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            /tmp/bench-resume.txt
            /tmp/bench-create.txt
          retention-days: 90

      - name: Build + load the llm-relay router image (US-72.5 drill)
        # The BYO router (US-72.2) reuses controller.inferenceRelay.
        # router.image, which defaults to the ghcr.io registry — the kind
        # cluster cannot pull that, so the drill's flipped release deploys
        # a locally built image (the api/controller pattern above).
        #
        # #1541: ARMED — the epic-72 evidence lane (this build → drill
        # shape → drill → sweep) runs after unrelated row failures
        # (tonight's SR-6 class skipped all four steps with zero drill
        # rows executed); it still skips on a failed install, and a bare
        # always() is deliberately NOT used — a failed install must not
        # produce a bogus drill/sweep failure against missing
        # infrastructure (poisoned evidence).
        #
        # id'd (r1): the downstream shape/drill/sweep conditions gate on
        # this step too — on a fresh per-run kind cluster the ONLY
        # delivery path for this run's image tag is the kind load here,
        # so a failed build must SKIP the shape step, not let its helm
        # --wait burn ~10 minutes on guaranteed ImagePullBackOff and
        # record an infrastructure-failure row (the noise class #1541
        # exists to eliminate).
        id: router-build
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' }}
        run: |
          docker build --network host --build-arg VERSION="${{ env.IMAGE_TAG }}" --build-arg COMMIT_SHA="${{ github.sha }}" \
            -f cmd/relay-router/Dockerfile -t llmsafespaces/relay-router:$IMAGE_TAG .
          kind load docker-image llmsafespaces/relay-router:$IMAGE_TAG --name $CLUSTER_NAME

      - name: Put the release into the drill's valid shape (relay on, namespaced scope)
        # The owner's drill (#1534, local/us-72-relay-only-flip-drill.sh)
        # flips ONLY relayOnlyKeyDelivery.enabled — but the nightly
        # installs with rbac.scope=cluster, and the chart refuses
        # relay-on + cluster scope at render (the §4.3 no-read guard;
        # the runbook's "Known interactions" remedy for cluster-scope
        # installs is pinning the flag off, which the install step above
        # now does). This pre-step moves the release into the valid
        # drill posture — relay ON + namespaced scope + the local router
        # image — WITHOUT touching the script: its R1 flip(true) is then
        # an idempotent re-set under --reuse-values, R3/R4 cycle within
        # namespaced scope, and it ends flipped (the runbook's target
        # posture; the kind teardown below disposes of the cluster).
        #
        # #1541: ARMED (install-success + the router image build — the
        # shape step DEPLOYS that image, and on a fresh per-run cluster
        # a missing build means guaranteed ImagePullBackOff), and id'd —
        # the drill and sweep gate on this step's outcome (sweeping an
        # un-shaped, flag-off install would read the raw canary and
        # poison the K1 record).
        id: drill-shape
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' && steps.router-build.outcome == 'success' }}
        run: |
          helm --kube-context kind-$CLUSTER_NAME upgrade --install llmsafespaces helm \
            -n $NS --reuse-values \
            --set relayOnlyKeyDelivery.enabled=true \
            --set rbac.scope=namespace \
            --set controller.inferenceRelay.router.image.repository=llmsafespaces/relay-router \
            --set controller.inferenceRelay.router.image.tag=$IMAGE_TAG \
            --wait --timeout 10m
          kubectl -n $NS rollout status deployment/llmsafespaces-controller --timeout=10m
          kubectl -n llm-relay rollout status deployment/llm-relay-router --timeout=10m

      - name: Run the relay-only flip + rollback drill (US-72.5, owner's #1534 script)
        # The drill depends on the mock-llm Service the us-70 suite step
        # creates above — it must stay ordered after those rows. Watch
        # item (first-run flake candidate, recorded in the worklog): the
        # drill's tight R3→R4 cycle may race llm-relay namespace
        # termination (router pods' 630s grace cap; helm --wait does not
        # wait for namespace deletion) — if it flakes there, the remedy
        # is an ns-gone wait inside the script (owner-side change).
        #
        # #1541: ARMED on the full prerequisite chain (install + the
        # us-70 mock-llm rows + the router-image build + the drill-shape
        # pre-step) — an unrelated earlier-row failure (the SR-6 class)
        # must not skip the drill, but any PREREQUISITE failure must (a
        # drill against missing mock-llm, a missing router image, or an
        # un-shaped release fails its rows for infrastructure reasons
        # and poisons the executed-rollback evidence record — the
        # bare-always() trap).
        id: relay-drill
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' && steps.us70-suite.outcome == 'success' && steps.router-build.outcome == 'success' && steps.drill-shape.outcome == 'success' }}
        run: bash local/us-72-relay-only-flip-drill.sh

      - name: Run the rogue-agent sweep (US-72.6, #820 exit criterion)
        # Design 0058 §8 line 201 — the epic's exit criterion: exec in a
        # live post-flip pod, grep every uid-1000-readable surface +
        # /proc/*/environ for a planted canary's bytes; R2 is the
        # positive control (the sweep must FIND a planted legacy key
        # before the zero-assertion can pass). Rides the drill's
        # flipped-ON end state (relay on, namespaced scope, router up,
        # mock-llm present) — hence ordered after it and before the
        # failure dump. The sweep script lands with its own vehicle
        # (#1537, the US-72.6 scrub+sweep PR); until that merges this
        # step SKIPs LOUDLY (the F8/#1342 absent-dependency precedent)
        # instead of failing the nightly — pinned executable in
        # local/us72_sweep_wiring_test.go.
        #
        # #1541: ARMED on the drill's full chain PLUS the drill itself —
        # the sweep rides the drill's flipped-ON end state; a failed
        # drill (e.g. dead at the R3 rollback leg) leaves the release in
        # an unknown flag state, and sweeping a flag-off pod would read
        # the raw canary as a K1 violation — a false epic-criterion
        # failure. Unrelated-row failures do NOT gate it.
        #
        # K1 carve-out (owner-accepted, #1536 runbook): zero-raw-bytes
        # is ASSERTED for frontable kinds only; non-frontable kinds
        # (bedrock/vertex/azure_openai/opencode) are EXCLUDED pending
        # the owner's K1 decision.
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' && steps.us70-suite.outcome == 'success' && steps.router-build.outcome == 'success' && steps.drill-shape.outcome == 'success' && steps.relay-drill.outcome == 'success' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18089
        run: |
          if [[ ! -f local/us-72-rogue-agent-sweep.sh ]]; then
            echo "SKIP: local/us-72-rogue-agent-sweep.sh not on this branch yet (lands with #1537, the US-72.6 scrub+sweep vehicle) — the #820 exit-criterion sweep is UNVERIFIED this run; not gating the teardown that follows."
            exit 0
          fi
          bash local/us-72-rogue-agent-sweep.sh

      - name: Run the M2/M4 migration-fallback e2e (design 0061 §10, #1548 AC1/AC4)
        # The migration scenario + the fallback arm, live: tokens stage on
        # the first post-flip reconcile; tearing the handoff delivers the
        # counted raw-key fallback and CredentialsStaged=False/
        # relay_fallback_delivery. Self-contained (seeds its own workspace
        # + canary). ARMED on the drill chain (flipped posture + mock-llm
        # + router image) — an un-shaped or drill-failed release leaves
        # the flag state unknown and the rows would fail for
        # infrastructure reasons, poisoning the incident-closure record.
        # Rides the sweep's end state (relay ON, namespaced scope).
        id: m2-fallback
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' && steps.us70-suite.outcome == 'success' && steps.router-build.outcome == 'success' && steps.drill-shape.outcome == 'success' && steps.relay-drill.outcome == 'success' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18090
        run: bash local/us72-m2-fallback-e2e.sh

      - name: Run the migration-recovery + exit-85 + posture e2e (design 0061 §10/§11, closes #1546/#1548)
        # The formally-closing half: the full migration ARC (fallback →
        # RECOVERY — the deleted handoff re-created, tokens back, the
        # condition healed), M1's exit-85 arming contract (the unarmable
        # controller terminates with the DISTINCT code + the refusing
        # line; reversible), and the posture convergence (all-Ready +
        # 45s stability + the armed line + zero forbidden — the M3 gate's
        # assertions against the exercised cluster, corpses included).
        # Self-contained; ARMED on the m2-fallback step (the recovery arc
        # re-seats its own degraded state, but a failed fallback arm
        # means the relay plane itself is broken — posture assertions
        # against that would be infrastructure noise, not evidence).
        if: ${{ !cancelled() && steps.helm-install.outcome == 'success' && steps.us70-suite.outcome == 'success' && steps.router-build.outcome == 'success' && steps.drill-shape.outcome == 'success' && steps.relay-drill.outcome == 'success' && steps.m2-fallback.outcome == 'success' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18091
        run: bash local/us61-migration-recovery-e2e.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl -n $NS get pods -o wide
          echo "=== API logs ==="
          kubectl -n $NS logs deployment/llmsafespaces-api --tail=50 || true
          echo "=== Controller logs ==="
          kubectl -n $NS logs deployment/llmsafespaces-controller --tail=50 || true
          echo "=== Events ==="
          kubectl -n $NS get events --sort-by='.lastTimestamp' | tail -30

      - name: Teardown
        if: always()
        run: kind delete cluster --name $CLUSTER_NAME
