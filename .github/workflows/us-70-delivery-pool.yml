name: US-70 delivery pool (kind + gVisor + faults)

on:
  schedule:
    # Sundays 07:00 UTC — after the S5 overlay slot (Sun 06:00), before
    # the US-2 L3 slot (Mon 05:00).
    - cron: "0 7 * * 0"
  workflow_dispatch: # Allow manual trigger

env:
  CLUSTER_NAME: llmsafespaces-ci
  IMAGE_TAG: ci
  NS: llmsafespaces
  FAULT_COUNT: "8"

jobs:
  us70-delivery-pool:
    name: US-70 delivery pool (runsc + fault injection, SUSPEND_SECONDS=3600)
    runs-on: ubuntu-latest
    # 300m: the pool runs TWO ~1h dwells (the #1087 gate in the delivery
    # suite's AC-2 and the faults suite's F4b JWT-exp sleep) — hard dwells
    # alone are ~120m — plus the RESUME_SCALE=100 batch under gVisor (W7
    # tax) and build/install headroom. GitHub-hosted limit is 6h.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Start local registry (digest-pinned agentd delivery)
        run: |
          # The sidecar-mode pool needs controller.agentdDelivery.image
          # DIGEST-PINNED (controller startup validation); digest refs must
          # resolve in-node. Same pattern as scripts/us2-kind-integration.sh.
          docker run -d --restart=always -p "127.0.0.1:5001:5000" \
            --network bridge --name lss-e2e-registry registry:3
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5001/v2/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "registry did not become ready"; exit 1

      - name: Create kind cluster
        run: |
          kind create cluster --config local/kind-cluster.yaml --name $CLUSTER_NAME
          # Alias localhost:5001 inside the node to the registry container
          # (local/kind-cluster.yaml enables the certs.d config path).
          for node in $(kind get nodes --name $CLUSTER_NAME); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
            printf '[host."http://lss-e2e-registry:5000"]\n' \
              | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml
          done
          if [ "$(docker inspect -f='{{json .NetworkSettings.Networks.kind}}' lss-e2e-registry)" = "null" ]; then
            docker network connect kind lss-e2e-registry
          fi

      - name: Build and load images
        run: |
          # Stamp build versions so the e2e cluster's healthz/platform-info
          # surfaces report the e2e build identity (semver-style tag name
          # without a leading "v") instead of the "unknown" default.
          E2E_VERSION="${{ env.IMAGE_TAG }}"
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f api/Dockerfile -t llmsafespaces/api:$IMAGE_TAG .
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f controller/Dockerfile -t llmsafespaces/controller:$IMAGE_TAG .
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" -f runtimes/base/Dockerfile -t llmsafespaces/runtime-base:$IMAGE_TAG .

          # agentd delivery artifact → local registry (digest-pinned ref +
          # binary sha for the entrypoint/supervisor verify pins).
          docker build --network host --build-arg VERSION="$E2E_VERSION" --build-arg COMMIT_SHA="${{ github.sha }}" \
            -f cmd/workspace-agentd/Dockerfile -t localhost:5001/llmsafespaces/agentd:$IMAGE_TAG .
          docker push localhost:5001/llmsafespaces/agentd:$IMAGE_TAG >/dev/null
          AGENTD_REF=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/llmsafespaces/agentd:$IMAGE_TAG)
          case "$AGENTD_REF" in
            *@sha256:*) AGENTD_REF="localhost:5001/llmsafespaces/agentd:$IMAGE_TAG@${AGENTD_REF##*@}" ;;
            *) echo "could not determine agentd digest"; exit 1 ;;
          esac
          CID=$(docker create localhost:5001/llmsafespaces/agentd:$IMAGE_TAG no-start)
          docker cp "$CID:/usr/local/bin/workspace-agentd" /tmp/workspace-agentd >/dev/null 2>&1 || { docker rm -f "$CID"; echo "agentd binary extract failed"; exit 1; }
          docker rm -f "$CID" >/dev/null 2>&1
          BINARY_SHA=$(sha256sum /tmp/workspace-agentd | cut -d' ' -f1)
          [ -n "$BINARY_SHA" ] || { echo "agentd binary hash failed"; exit 1; }
          echo "AGENTD_REF=$AGENTD_REF" >> "$GITHUB_ENV"
          echo "AGENTD_BINARY_SHA=$BINARY_SHA" >> "$GITHUB_ENV"

          # Design 0053 §4.2 (S3 mandatory): opencode delivery artifact →
          # same local-registry pattern (digest-pinned ref + binary sha
          # for the supervisor verify pins).
          docker build --network host \
            -f runtimes/opencode/Dockerfile -t localhost:5001/llmsafespaces/opencode:$IMAGE_TAG .
          docker push localhost:5001/llmsafespaces/opencode:$IMAGE_TAG >/dev/null
          OPENCODE_REF=$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5001/llmsafespaces/opencode:$IMAGE_TAG)
          case "$OPENCODE_REF" in
            *@sha256:*) OPENCODE_REF="localhost:5001/llmsafespaces/opencode:$IMAGE_TAG@${OPENCODE_REF##*@}" ;;
            *) echo "could not determine opencode digest"; exit 1 ;;
          esac
          OC_CID=$(docker create localhost:5001/llmsafespaces/opencode:$IMAGE_TAG no-start)
          docker cp "$OC_CID:/usr/local/bin/opencode" /tmp/opencode-bin >/dev/null 2>&1 || { docker rm -f "$OC_CID"; echo "opencode binary extract failed"; exit 1; }
          docker rm -f "$OC_CID" >/dev/null 2>&1
          OPENCODE_BINARY_SHA=$(sha256sum /tmp/opencode-bin | cut -d' ' -f1)
          [ -n "$OPENCODE_BINARY_SHA" ] || { echo "opencode binary hash failed"; exit 1; }
          echo "OPENCODE_REF=$OPENCODE_REF" >> "$GITHUB_ENV"
          echo "OPENCODE_BINARY_SHA=$OPENCODE_BINARY_SHA" >> "$GITHUB_ENV"

          # Retag runtime-base with the ghcr.io/lenaxia/ prefix so the
          # RuntimeEnvironment validating webhook's image allow-list accepts
          # it (the webhook requires ghcr.io/lenaxia/ prefixed images).
          docker tag llmsafespaces/runtime-base:$IMAGE_TAG ghcr.io/lenaxia/llmsafespaces/runtime-base:$IMAGE_TAG

          kind load docker-image llmsafespaces/api:$IMAGE_TAG --name $CLUSTER_NAME
          kind load docker-image llmsafespaces/controller:$IMAGE_TAG --name $CLUSTER_NAME
          kind load docker-image ghcr.io/lenaxia/llmsafespaces/runtime-base:$IMAGE_TAG --name $CLUSTER_NAME

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.0/cert-manager.yaml
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s

      - name: Create credentials Secret (before Postgres)
        # The Postgres/Valkey manifests reference llmsafespaces-credentials
        # for their passwords. The chart normally creates this Secret as a
        # pre-install hook — but Postgres must start BEFORE the chart (the
        # API needs Postgres to pass readiness). Create the namespace +
        # Secret first with known non-insecure passwords, then pass the
        # same passwords to helm install so the chart does not rotate them.
        run: |
          kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n $NS create secret generic llmsafespaces-credentials \
              --from-literal=postgres-password=e2e-pg-pw-2026 \
              --from-literal=redis-password=e2e-redis-pw-2026 \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Postgres + Redis
        run: |
          kubectl apply -f local/postgres-redis.yaml
          kubectl -n $NS rollout status deployment/postgres --timeout=180s
          kubectl -n $NS rollout status deployment/valkey --timeout=180s

      - name: Helm install LLMSafeSpaces (seam inert)
        run: |
          # Same install as the nightly (mcp disabled — no image yet, issue
          # #28; sidecar mode is the spawn-pull's primary surface). The
          # fault seam stays OFF here: arming at install would spend the
          # 8-fault budget on the delivery suite's ~105 pod bootstraps and
          # AC-1 would boot against 500s. The seam is armed AFTER the
          # delivery suite (see the "Arm fault seam" step) via
          # kubectl set env on a fresh API process.
          helm upgrade --install llmsafespaces helm \
            -n $NS --create-namespace \
            --set api.image.repository=llmsafespaces/api \
            --set api.image.tag=$IMAGE_TAG \
            --set api.image.pullPolicy=IfNotPresent \
            --set controller.image.repository=llmsafespaces/controller \
            --set controller.image.tag=$IMAGE_TAG \
            --set controller.image.pullPolicy=IfNotPresent \
            --set mcp.enabled=false \
            --set postgresql.host=postgres \
            --set postgresql.port=5432 \
            --set postgresql.user=llmsafespaces \
            --set postgresql.database=llmsafespaces \
            --set redis.host=redis-master \
            --set redis.port=6379 \
            --set externalSecret.create=true \
            --set "externalSecret.postgresPassword=e2e-pg-pw-2026" \
            --set "externalSecret.redisPassword=e2e-redis-pw-2026" \
            --set rbac.scope=cluster \
            --set api.config.logging.development=true \
            --set "controller.agentdDelivery.image=${{ env.AGENTD_REF }}" \
            --set "controller.agentdDelivery.binarySHA256Amd64=${{ env.AGENTD_BINARY_SHA }}" \
            --set "controller.agentdDelivery.binarySHA256Arm64=${{ env.AGENTD_BINARY_SHA }}" \
            --set "controller.opencodeDelivery.image=${{ env.OPENCODE_REF }}" \
            --set "controller.opencodeDelivery.binarySHA256Amd64=${{ env.OPENCODE_BINARY_SHA }}" \
            --set "controller.opencodeDelivery.binarySHA256Arm64=${{ env.OPENCODE_BINARY_SHA }}" \
            --set controller.agentdSidecar.enabled=true \
            --set "api.extraEnv[0].name=LLMSAFESPACES_SECRETS_RECONCILE_INTERVAL,api.extraEnv[0].value=5s" \
            --wait --timeout 5m

      - name: Wait for rollout
        run: |
          kubectl -n $NS rollout status deployment/llmsafespaces-api --timeout=180s
          kubectl -n $NS rollout status deployment/llmsafespaces-controller --timeout=180s

      - name: Provision gVisor (runsc) on the kind node
        # S5.6 recipe (local/s5-overlay-validation.sh), extracted to
        # local/lib/gvisor.sh: runsc + containerd-shim-runsc-v1 from the
        # gVisor latest release with sha512 verification, containerd
        # handler registration, restart, then the gvisor RuntimeClass —
        # the AC-13 runsc legs are feature-detected off it.
        run: |
          NODE=$(kubectl --context "kind-$CLUSTER_NAME" get nodes -o jsonpath='{.items[0].metadata.name}')
          bash local/lib/gvisor.sh install "$NODE"
          bash local/lib/gvisor.sh runtimeclass
          kubectl get runtimeclass gvisor

      - name: Run secret-delivery e2e rows (Epic 70 — pool legs)
        # The pool executes the gated legs of the nightly suite: the ≥1h
        # #1087 suspend gate (SUSPEND_SECONDS=3600 in AC-2) and the AC-13
        # runsc batch (the RuntimeClass provisioned above makes the
        # feature-detect fire). W7 gVisor tax: resume budget loosened vs
        # nightly's 30s (P95_BUDGET_MS=45000) and per-workspace resume
        # wait doubled (RESUME_SCALE_TIMEOUT_S=600). Runs SEAM-INERT — the
        # fault budget belongs to the faults suite below.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18085
          SUSPEND_SECONDS: 3600
          # Pool run 10: at 100 the scale batch starved the runner — the
          # API's own readyz timed out (curl 28) and workspace probes 503'd
          # before any delivery semantics ran. 25 fits the 2-core runner
          # (run 6 reached Active at this order before resource pins).
          # The AC's full-100 leg stays valid on a capacity-appropriate
          # runner: dispatch with RESUME_SCALE=100 on a larger machine.
          RESUME_SCALE: 25
          RESUME_SCALE_TIMEOUT_S: 600
          P95_BUDGET_MS: 45000
          # Must match the helm api.extraEnv reconcile-interval set above —
          # the AC-8/AC-10 convergence budgets derive from it (lockstep pin
          # in local/us70_harness_script_test.go).
          RECONCILE_INTERVAL_S: 5
        run: bash local/us-70-secret-delivery-e2e.sh

      - name: Run revisions e2e rows (Epic 70 US-70.2 REV-0..REV-4)
        # Two-tier-revision acceptance rows (see the nightly's copy):
        # contract feature-detect + loud-skip, two-replica identical
        # revisions, conditional pull 304/ETag, anchored spawned_rev,
        # pull-vs-push identity. MUST run BEFORE the fault seam is armed
        # below — its rows POST pod-bootstrap repeatedly and would both
        # burn the 8-fault budget and fail against injected 500s. Scales
        # the API deployment to 2 replicas mid-suite and restores it.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18087
        run: bash local/us-70-revisions-e2e.sh

      - name: Arm fault seam (fresh API process, after the delivery suite)
        # B1/M10: arming at helm install would spend the fault budget on
        # the delivery suite's ~105 pod bootstraps (AC-1 would boot against
        # 500s). The API reads LLMSAFESPACES_FAULT_INJECTION once per
        # process (app.go ParseFaultInjectionRules), so `kubectl set env`
        # (a pod-template change → rollout) arms a FRESH process with the
        # full budget for the faults suite only. FAULT_COUNT comes from
        # the workflow env block — the same number the faults script's
        # FAULT_COUNT default pins (lockstep test compares both).
        run: |
          kubectl --context "kind-$CLUSTER_NAME" -n $NS set env deployment/llmsafespaces-api LLMSAFESPACES_FAULT_INJECTION="${FAULT_COUNT}:POST:/internal/v1/pod-bootstrap"
          kubectl --context "kind-$CLUSTER_NAME" -n $NS rollout status deployment/llmsafespaces-api --timeout=180s

      - name: Run fault/chaos e2e rows (Epic 70 US-70.0 F1–F5)
        # Fault-injected bootstraps (F1), API partition at resume (F2),
        # key-row corruption with the #1114 loud-degrade audit (F3),
        # SA-token tamper/expiry via kubectl-minted tokens (F4 — the JWT's
        # own .exp bounds the time-travel sleep to ≤~3700s), and chaos
        # kills (F5). FAULT_COUNT defaults to 8 in the script; override
        # here only in lockstep with the arming step's env.
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          NS: ${{ env.NS }}
          PORTFWD_PORT: 18086
        run: bash local/us-70-faults-e2e.sh

      - name: Upload pool artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us70-pool-results-${{ github.run_id }}
          path: |
            /tmp/us70-resume-times.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl -n $NS get pods -o wide
          echo "=== API logs ==="
          kubectl -n $NS logs deployment/llmsafespaces-api --tail=50 || true
          echo "=== Controller logs ==="
          kubectl -n $NS logs deployment/llmsafespaces-controller --tail=50 || true
          echo "=== Events ==="
          kubectl -n $NS get events --sort-by='.lastTimestamp' | tail -30

      - name: Teardown
        if: always()
        run: kind delete cluster --name $CLUSTER_NAME
