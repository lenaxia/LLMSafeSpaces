# AI Commands — thin caller delegating to the reusable lenaxia/ai-workflows
# AI Commands workflow.
#
# What onboarding buys over the previous self-contained copy: command routing
# from the centrally-pinned route-command.sh (v0.2.10 adds PR-head-SHA
# stamping into /review and /ai-on-PR prompts — the **Commit reviewed:** line),
# concurrency grouping that routes /review and /ai into the same
# ai-review-{N} group as the synchronize-triggered PR Review workflow (a
# command review cancels a stale in-flight review of the same PR and vice
# versa), and the footer posting via the central post-footer.sh.
#
# The `if:` filter MUST stay in the caller (ai-workflows lesson #4) — the
# reusable workflow cannot gate on the triggering comment. At v0.2.18 the
# reusable workflow performs NO commenter filtering of its own (verified:
# no job-level `if:`, zero bot/author checks in route-command.sh) — caller
# admission below is the ONLY authorization check; anyone it admits,
# trusted app bots included, reaches the command router. (v0.2.17 added
# the opt-in trusted_app_bots with:-input below and v0.2.18 fixed its
# delivery via GITHUB_ENV: it bypasses the opencode CLI's startup
# collaborator assert for listed bots only — admission, not
# authorization, stays here.) The `uses:` ref MUST be a hardcoded tag (no
# vars context); propagate.yml in ai-workflows bumps it on every release.
#
# Trusted app-bot allowlist (#1710, ai-workflows v0.2.18 README §4 caller
# contract): app bots always carry author_association NONE — they are
# neither owners nor collaborators — so the association clauses above can
# never admit them. The exact-login arm below is the platform delivery
# bot's ONLY path in (the orchestrator's /review outage fallback was a
# silent no-op without it). The list literal is THE shared definition:
# replicate it verbatim in any future author_association gate — never a
# blanket association == 'NONE' pass; each entry is a deliberate trust
# decision. tests/ghaworkflows/gha_callers_test.go fails on a dropped arm,
# a drifted copy, or a non-exact-login entry.
name: AI Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    if: |
      (startsWith(github.event.comment.body, '/ai') ||
       startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/fix') ||
       startsWith(github.event.comment.body, '/implement') ||
       startsWith(github.event.comment.body, '/analyze') ||
       startsWith(github.event.comment.body, '/test') ||
       startsWith(github.event.comment.body, '/security') ||
       startsWith(github.event.comment.body, '/explain') ||
       startsWith(github.event.comment.body, '/triage') ||
       startsWith(github.event.comment.body, '/help') ||
       startsWith(github.event.comment.body, '/design') ||
       startsWith(github.event.comment.body, '/merge') ||
       contains(github.event.comment.body, ' /ai') ||
       contains(github.event.comment.body, ' /review') ||
       contains(github.event.comment.body, ' /fix') ||
       contains(github.event.comment.body, ' /implement') ||
       contains(github.event.comment.body, ' /analyze') ||
       contains(github.event.comment.body, ' /test') ||
       contains(github.event.comment.body, ' /security') ||
       contains(github.event.comment.body, ' /explain') ||
       contains(github.event.comment.body, ' /triage') ||
       contains(github.event.comment.body, ' /help') ||
       contains(github.event.comment.body, ' /design') ||
       contains(github.event.comment.body, ' /merge')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       contains(fromJson('["agentic-actor-coder[bot]"]'), github.event.comment.user.login))
    uses: lenaxia/ai-workflows/.github/workflows/ai-comment.yml@v0.2.21
    secrets: inherit
    with:
      version: v0.2.21
      project_name: LLMSafeSpaces
      # Trusted app-bot commenters (ai-workflows #51): without this the CLI
      # assert refuses bot /review comments pre-LLM even though the admission
      # arm above deliberately admits them. Must match canonicalTrustedAppBots
      # (gha_callers_test.go).
      trusted_app_bots: '["agentic-actor-coder[bot]"]'
