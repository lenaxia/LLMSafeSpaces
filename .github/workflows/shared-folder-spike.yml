name: /shared parked-PVC spike (#1709)

on:
  workflow_dispatch:
    # Dispatch works once this file exists on the default branch. Knobs:
    #   auto_gb   — leg-B dataset size in GiB (auto-shrinks to node disk)
    #   transfers — rclone --transfers sweep, space-separated
    inputs:
      auto_gb:
        description: "Leg-B dataset GiB (auto-shrinks to fit node free disk /4)"
        default: "24"
        type: string
      transfers:
        description: "rclone --transfers sweep (space-separated)"
        default: "8 32"
        type: string
  pull_request:
    # Until the file is on main, the spike fires from its PR (same trust
    # domain as dispatch: same-repo branch, write-access author — the
    # pool's restriction targets fork code, which this is not).
    # Paths-filtered so doc-only pushes never wake the 300m spike. NOTE:
    # for pull_request the branches filter matches the PR BASE (main).
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - local/1709-shared-folder-spike.sh
      - local/lib/longhorn.sh
      - .github/workflows/shared-folder-spike.yml

concurrency:
  group: shared-folder-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: llmsafespaces-ci

jobs:
  shared-folder-spike:
    name: "Spike A/B/C: runsc×RWX, hydration, snapshot→RO"
    # lenaxia-dind-runner (same privileged set as the US-70 pool —
    # spike A/B/C need kind + docker-exec node provisioning).
    runs-on: lenaxia-dind-runner
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - name: Install kind + kubectl + helm + jq
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin
          curl -fsSLo ./kubectl "https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl"
          curl -fsSLo ./kubectl.sha256 "https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          # Pre-pull on the RUNNER validates the digests resolve LOUD
          # (fails here, not 20 minutes into a leg); the node itself is
          # warmed by the dedicated kind-load step below. NOTE:
          # minio/minio is delisted from Docker Hub (hub API
          # object-not-found; runs 38864577660/38865021006) — the S3
          # tier is SeaweedFS 4.48 (prod's pin).
          docker pull debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
          docker pull rclone/rclone@sha256:ec0f519fefc0d157b95ef30e230c0e945715e0235e4a868432622527f1d578f9
          docker pull chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d

      - name: Record runner environment
        run: |
          echo "cpu: $(nproc)"
          echo "mem: $(free -h | awk '/^Mem:/{print $2}')"
          df -h / | tee /tmp/spike1709-df.txt
          docker info --format 'docker={{.ServerVersion}} ncpu={{.NCPU}}' || true

      - name: Create kind cluster
        run: kind create cluster --config local/kind-cluster.yaml --name $CLUSTER_NAME

      - name: Provision gVisor (runsc) on the kind node
        run: |
          NODE=$(kubectl --context "kind-$CLUSTER_NAME" get nodes -o jsonpath='{.items[0].metadata.name}')
          bash local/lib/gvisor.sh install "$NODE"
          bash local/lib/gvisor.sh runtimeclass
          # The runc comparison leg (B2) references runtimeClassName:
          # runc explicitly — kind registers no runc RuntimeClass by
          # default and the spike's preflight fail-closes without it
          # (review N-A).
          cat <<'EOF' | kubectl --context "kind-$CLUSTER_NAME" apply -f -
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: runc
          handler: runc
          EOF
          kubectl get runtimeclass gvisor runc

      - name: Pre-warm kind node images
        # Runner-side docker pulls validate the digests resolve LOUD
        # (fails here, not 20 minutes into a leg). Node pre-warm uses
        # `ctr images pull` ON THE NODE — NOT `kind load docker-image`:
        # digest refs are multi-arch manifest lists, and kind's
        # `docker save | ctr import --all-platforms` path dies on
        # missing other-platform blobs ("content digest not found" —
        # the same class that killed the pool's fast-mode dispatches
        # 2026-09-07). ctr pulls exactly the amd64 child and records
        # the index digest, which is what kubelet resolves at pod time.
        run: |
          NODE="${CLUSTER_NAME}-control-plane"
          for ref in \
            "debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587" \
            "rclone/rclone@sha256:ec0f519fefc0d157b95ef30e230c0e945715e0235e4a868432622527f1d578f9" \
            "chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"; do
            docker exec "$NODE" ctr -n k8s.io images pull --platform linux/amd64 "$ref"
          done

      - name: Provision Longhorn (RWX spike posture)
        # classes deferred past snapshot-controller: the VolumeSnapshotClass
        # apply needs the snapshot.storage.k8s.io CRDs first (run
        # 38865864638 died applying the VSC before they existed).
        run: |
          NODE=$(kubectl --context "kind-$CLUSTER_NAME" get nodes -o jsonpath='{.items[0].metadata.name}')
          bash local/lib/longhorn.sh node-prereqs "$NODE"
          bash local/lib/longhorn.sh install

      - name: Install snapshot-controller (VolumeSnapshot CRDs)
        # Same component prod runs (talos-ops-prod storage/snapshot-controller,
        # chart 5.3.0) — the CSI snapshot cycle must measure the real shape.
        run: |
          helm repo add piraeus https://piraeus.io/helm-charts/ >/dev/null 2>&1 || true
          helm repo update >/dev/null
          helm upgrade --install snapshot-controller piraeus/snapshot-controller \
            --version 5.3.0 -n kube-system \
            --wait --timeout 10m
          kubectl -n kube-system rollout status deployment snapshot-controller --timeout=600s

      - name: Apply user-shared StorageClass + VolumeSnapshotClass
        run: |
          bash local/lib/longhorn.sh classes
          kubectl get storageclass user-shared -o wide
          kubectl get volumesnapshotclass user-shared-snap

      - name: Run spike legs A/B/C
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          CTX: kind-${{ env.CLUSTER_NAME }}
          AUTO_GB: ${{ inputs.auto_gb || '24' }}
          TRANSFERS: ${{ inputs.transfers || '8 32' }}
        run: bash local/1709-shared-folder-spike.sh

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-folder-spike-${{ github.run_id }}
          path: |
            /tmp/spike1709/**
            /tmp/spike1709-df.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl --context "kind-$CLUSTER_NAME" get pods -A -o wide || true
          kubectl -n longhorn-system get pods -o wide || true
          kubectl -n longhorn-system get volumes.longhorn.io -o wide || true
          kubectl -n spike1709 get events --sort-by='.lastTimestamp' | tail -40 || true

      - name: Teardown
        if: always()
        run: kind delete cluster --name $CLUSTER_NAME
