//
// Typed session actions (design 0055 M1, op 5): one verb slot,
// capability-negotiated. agentd is the sole writer of session mutations;
// actions serialize against delivery via the same per-session single-flight
// machinery. Undeclared actions return NotSupported per the capability
// report — harness differences are data, never API-side branches.

syntax = "proto3";

package llmsafespaces.abi.v1;

import "llmsafespaces/abi/v1/contract.proto";

option go_package = "github.com/lenaxia/llmsafespaces/pkg/abi/v1;abi";

message ActionRequest {
  string session_id = 1;
  oneof action {
    InterruptAction interrupt = 2;
    SwitchModelAction switch_model = 3;
    SwitchAgentAction switch_agent = 4;
    AnswerInputAction answer_question = 5;
    CompactAction compact = 6;
    CreateSessionAction create_session = 7;
    SendAction send = 8;
    DeleteSessionAction delete_session = 9;
    RenameSessionAction rename_session = 10;
  }
}

// InterruptAction aborts the in-flight turn. Non-destructive (I7): it
// mutates turn projection state only and NEVER entry states — admitted
// rows survive an interrupt and drain after it.
message InterruptAction {}

message SwitchModelAction {
  ModelRef model = 1;
}

message SwitchAgentAction {
  string agent_id = 1;
}

// AnswerInputAction answers a pending InputRequest (questions and
// permissions unified, design 0049 §4.5): selected option labels and/or a
// custom free-text answer for questions; the permission vocabulary
// ("once"|"always"|"reject") for permissions. The two forms are disjoint —
// reply routes to the permission reply endpoint without the question-first
// probe (#1310 slice A). reply="reject" is the dismiss exit: a
// question-id reject goes to the question-reject endpoint (its 404 is
// the absence signal), a permission-id reject to the permission reply —
// never cross-kind (the harness prefix-validates ids). The optional
// message carries deny-feedback alongside a permission reply (preserves
// the field the raw passthrough carried, #1302 / 4a).
message AnswerInputAction {
  string input_id = 1;
  repeated string option_ids = 2;
  optional string custom_text = 3;
  optional string reply = 4;
  optional string message = 5;
}

message CompactAction {}

// The sessions-cluster verbs (#1372, S1 completion): the API's five
// session-write sites ride Act in the authority regime. session_id is
// unset for create_session (the session does not exist yet — opencode
// mints the id); send/delete/rename target the request's session_id.
// All four harness routes are the production adapter path's own V1
// routes (POST /session, POST /session/:id/message, DELETE
// /session/:id, PATCH /session/:id) — declared unconditionally in the
// boot capability report (same confidence class as interrupt).
message CreateSessionAction {
  string title = 1;
}

message SendAction {
  string text = 1;
  ModelRef model = 2;
}

message DeleteSessionAction {}

message RenameSessionAction {
  string title = 1;
}

message ActionResult {
  string session_id = 1;
  oneof result {
    InterruptResult interrupt = 2;
    SwitchModelResult switch_model = 3;
    SwitchAgentResult switch_agent = 4;
    AnswerInputResult answer_question = 5;
    CompactResult compact = 6;
    CreateSessionResult create_session = 8;
    SendResult send = 9;
    DeleteSessionResult delete_session = 10;
    RenameSessionResult rename_session = 11;
  }
  // effect_seq is the seq of the event the action produced, when knowable
  // before the response returns (action-result ↔ event causal linkage is a
  // design-0055 open item; unset means "not yet knowable").
  optional uint64 effect_seq = 7;
}

message InterruptResult {}

message SwitchModelResult {
  ModelRef model = 1;
}

message SwitchAgentResult {
  string agent_id = 1;
}

message AnswerInputResult {
  string input_id = 1;
}

message CompactResult {}

message CreateSessionResult {
  Session session = 1;
}

// SendResult carries the completed assistant message — the synchronous
// send contract (V1 POST /session/:id/message returns the finished
// message; the API's REST response is this message verbatim).
message SendResult {
  Message message = 1;
}

message DeleteSessionResult {}

message RenameSessionResult {}
