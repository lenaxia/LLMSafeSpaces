  # --- Webhook receiver (Epic 64, public — HMAC signature is the credential) ---
  /hooks/{webhookId}:
    post:
      tags: [triggers]
      summary: Webhook receiver for webhook-source triggers
      security: []
      description: |
        Public endpoint authenticated by HMAC signature (the secret from
        rotate-secret), not by JWT/API key. Send header
        `X-Hub-Signature-256: sha256=<hex HMAC-SHA256 of the raw body>`;
        optionally `X-Hub-Signature-Timestamp` (unix seconds, ±5 min skew
        allowed). Body is arbitrary bytes (max 1 MiB). Dedup by configurable
        header (default `X-Request-ID`) or body hash. IP allowlist and 10 rps
        rate limit per webhook may apply.
      operationId: receiveWebhook
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            example: sha256=85e078...
        - name: X-Hub-Signature-Timestamp
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-ID
          in: header
          required: false
          description: Dedup key in header idempotency mode (default mode)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary JSON payload forwarded to the trigger
      responses:
        "200":
          description: Duplicate delivery (idempotency hit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [duplicate]
        "202":
          description: Fired — workflow run started (`runId`) or routine scheduled (`fireId`)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [fired]
                  runId:
                    type: string
                  fireId:
                    type: string
        "401":
          description: Missing/invalid signature or timestamp skew exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Source IP not in allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Workflow already running (Retry-After: 30)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limited (Retry-After: 30)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # --- Passkeys (Epic 59) ---
  /auth/passkey/register/begin:
    post:
      tags: [passkeys]
      summary: Begin passkey registration (signup)
      security: []
      description: |
        First step of WebAuthn attestation for new-account signup. Returns the
        creation options and an opaque session token to echo at /finish.
        Rate limited to 10/min per IP (not documented per-route elsewhere).
      operationId: passkeyRegisterBegin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        "200":
          description: Creation options + session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBeginRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/passkey/register/finish:
    post:
      tags: [passkeys]
      summary: Finish passkey registration (signup)
      security: []
      description: |
        Completes attestation, creates the account, and returns a JWT plus
        one-time recovery codes (10 codes, shown exactly once). Also sets the
        session cookie.
      operationId: passkeyRegisterFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinishRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [token, recoveryCodes]
                properties:
                  token:
                    type: string
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/passkey/login/begin:
    post:
      tags: [passkeys]
      summary: Begin passkey login
      security: []
      operationId: passkeyLoginBegin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Assertion options + session token
          content:
            application/json:
              schema:
                type: object
                required: [options, sessionToken]
                properties:
                  options:
                    type: object
                    description: Flat PublicKeyCredentialRequestOptionsJSON (challenge, rpId, allowCredentials, ...)
                  sessionToken:
                    type: string
        "400":
          description: Invalid request or no passkey registered for the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/passkey/login/finish:
    post:
      tags: [passkeys]
      summary: Finish passkey login
      security: []
      description: Sets the session cookie and returns the JWT in the body. Rate limited to 10/min per IP.
      operationId: passkeyLoginFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinishRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Passkey login failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/passkey/recover:
    post:
      tags: [passkeys]
      summary: Recover access with a recovery code
      security: []
      description: |
        Authenticates with email + one recovery code. Returns
        `mustEnrollPasskey: true` — the caller must enroll a new passkey.
        Rate limited to 5/min per IP.
      operationId: passkeyRecover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Recovered
          content:
            application/json:
              schema:
                type: object
                required: [token, user, mustEnrollPasskey]
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
                  mustEnrollPasskey:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid recovery code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/passkeys:
    get:
      tags: [passkeys]
      summary: List the authenticated user's passkeys
      operationId: listPasskeys
      responses:
        "200":
          description: Passkey list (public metadata only)
          content:
