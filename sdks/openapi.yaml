      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotation triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  rotating:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/relay/pause:
    post:
      tags: [admin]
      summary: Pause the relay fleet (admin)
      operationId: pauseRelay
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/relay/resume:
    post:
      tags: [admin]
      summary: Resume the relay fleet (admin)
      operationId: resumeRelay
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Dev preview bootstrap (Epic 66 preview origins) ---
  /workspaces/{id}/dev-preview-bootstrap/{port}:
    get:
      tags: [workspaces]
      summary: Get a one-time token redirect to the workspace's preview origin
      description: |
        302 to `https://<workspaceId>-preview.<domain>/<port>/?t=<one-time
        HMAC token>` (TTL 5m). Registered only when preview origins are
        enabled on the instance.
      operationId: devPreviewBootstrap
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: port
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to the preview origin
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Token generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Dev preview disabled on this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workspaces/{id}/dev-preview-bootstrap:
    get:
      tags: [workspaces]
      summary: Get a one-time token redirect (port via query parameter)
      operationId: devPreviewBootstrapByQuery
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: port
          in: query
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to the preview origin
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    WorkspaceId:
      name: id
      in: path
      required: true
      description: Workspace ID
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session ID
      schema:
        type: string
    SecretId:
      name: id
      in: path
      required: true
      description: Secret ID
      schema:
        type: string
    OrgId:
      name: id
      in: path
      required: true
      description: Organization ID
      schema:
        type: string
    WorkflowId:
      name: id
      in: path
      required: true
      description: Workflow ID
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      description: Workflow run ID
      schema:
        type: string
    TriggerId:
      name: id
      in: path
      required: true
      description: Trigger ID
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate resource)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /auth/login or /auth/register
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "lsp_ prefixed API key in Bearer format (e.g. Bearer lsp_abc123...)"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    FileUploadResponse:
      type: object
      description: |
        Result of a successful workspace file upload (Epic 68). `path` is
        the absolute final location on the workspace PVC
        (`/workspace/uploads/<uuid>-<name>`); `name` is the sanitized
        filename; `size` is the byte count stored.
      required: [path, name, size]
      properties:
        path:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
    ModelSelector:
      type: object
      description: |
        Optional per-prompt model override. When present the request is
        routed to the specified model for this single send; when absent
        the session's default model applies. A selector denied by the
        organization's allowed-models/allowed-providers policy is
        rejected with 403. A malformed selector (missing modelID)
        degrades to the session default.
      properties:
        modelID:
          type: string
        providerID:
          type: string
    AuthConfig:
      type: object
      required: [registrationEnabled, oidcEnabled, passkeyEnabled, instanceName, motd]
      properties:
        registrationEnabled:
          type: boolean
        oidcEnabled:
          type: boolean
        passkeyEnabled:
          type: boolean
          description: True when the passkey (WebAuthn) handler is wired (RPID configured)
        passkeyDefaultSignup:
          type: boolean
          description: Present when the instance defaults signup to passkey registration
        instanceName:
          type: string
        motd:
          type: string
          description: Message of the day. Always present; empty string when unset.
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        active:
          type: boolean
        role:
          type: string
    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    APIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
          description: Full key value (only returned on creation)
        prefix:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        userId:
          type: string
        runtime:
          type: string
        storageSize:
          type: string
        phase:
          type: string
          enum: [Pending, Creating, Active, Suspending, Suspended, Resuming, Terminating, Terminated, Failed]
        pvcName:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        devPreviewEnabled:
          type: boolean
          description: Whether the authenticated HTTP/WS dev-preview tunnel is enabled (Epic 66).
          default: false
        defaultModel:
          type: string
        agentNeedsRefresh:
          type: boolean
          description: Agent credential state (Epic 27a); always present (no omitempty).
        credentialsPendingSince:
          type: string
          format: date-time
          nullable: true
    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
        runtime:
          type: string
        storageSize:
          type: string
        storageClass:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    WorkspaceListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceListItem"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
    WorkspaceListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        userId:
          type: string
        runtime:
          type: string
        storageSize:
          type: string
        phase:
          type: string
          enum: [Pending, Creating, Active, Suspending, Suspended, Resuming, Terminating, Terminated, Failed]
        imageTag:
          type: string
        agentVersion:
          type: string
        defaultModel:
          type: string
        maxActiveSessions:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        agentNeedsRefresh:
          type: boolean
          description: Agent credential state (Epic 27a); always present (no omitempty).
        credentialsPendingSince:
          type: string
          format: date-time
          nullable: true
        orgId:
          type: string
          nullable: true
          description: Owning org for org-scoped workspaces (Epic 11); null for personal workspaces.
    PaginationMetadata:
      type: object
      properties:
        total:
          type: integer
        start:
          type: integer
        end:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    WorkspaceStatusResult:
      type: object
      properties:
        phase:
          type: string
        pvcName:
          type: string
        activeSessions:
          type: integer
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceConditionResult"
        credentialState:
          $ref: "#/components/schemas/CredentialStateResult"
        agentHealth:
          $ref: "#/components/schemas/AgentHealthResult"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionStatusItem"
        diskUsedBytes:
          type: integer
          format: int64
        diskTotalBytes:
          type: integer
          format: int64
    WorkspaceConditionResult:
      type: object
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
    CredentialStateResult:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
        message:
          type: string
    AgentHealthResult:
      type: object
      properties:
        status:
          type: string
        providersConfigured:
          type: integer
        agentVersion:
          type: string
        connected:
          type: array
          items:
            type: string
        message:
          type: string
        lastCheckedAt:
          type: string
    SessionStatusItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
    ActivateWorkspaceResponse:
      type: object
      properties:
        resumed:
          type: string
          description: ID of the workspace that was resumed
        suspended:
          type: string
          description: ID of the workspace that was suspended to make room (if any)
    RefreshWorkspaceResult:
      type: object
      properties:
        restartGeneration:
          type: integer
          format: int64
          description: The bumped restart generation that triggers a pod rebuild (re-resolves the runtime image to its latest version and applies refreshed resource requests)
    TerminalTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          description: One-time ticket (prefixed with tkt_)
        expiresAt:
          type: string
          format: date-time
          description: Ticket expiry time (30s from creation)
    EnsureSessionResponse:
      type: object
      properties:
        workspaceId:
          type: string
        workspacePhase:
          type: string
        sessionId:
          type: string
        resumed:
          type: boolean
    SessionListItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        messageCount:
          type: integer
        status:
          type: string
          enum: [active, idle]
    SessionAlert:
      type: object
      required: [id, workspaceId, sessionId, alert, oldestBusySeconds, createdAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        sessionId:
          type: string
        alert:
          type: string
          enum: [session_hung]
        oldestBusySeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
    ActiveSessionsResponse:
      type: object
      properties:
        active:
          type: array
          items:
            type: string
        maxActive:
          type: integer
    Message:
      type: object
      description: |
        One entry in a session transcript (pkg/session contract, design 0049).
        Flat discriminated struct: type selects which payload fields are
        meaningful; the rest omit. Agent-specific shapes never appear — the
        adapter translates at the seam.
      required: [id, type]
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum: [user, assistant, shell, agent_switch, model_switch, compaction, system]
        createdAt:
          type: string
          format: date-time
        parts:
          type: array
          items:
            $ref: "#/components/schemas/Part"
        model:
          $ref: "#/components/schemas/ModelRef"
        cost:
          $ref: "#/components/schemas/Cost"
        text:
          type: string
          description: Plain-text form (user/system/compaction messages)
        command:
          type: string
          description: Shell-message command
        exitCode:
          type: integer
          description: Shell-message exit code
        fromAgent:
          type: string
        toAgent:
          type: string
        fromModel:
          $ref: "#/components/schemas/ModelRef"
        toModel:
          $ref: "#/components/schemas/ModelRef"
        error:
          $ref: "#/components/schemas/SessionError"
    Part:
      type: object
      description: |
        One renderable part of a message (pkg/session contract). The 5-type
        union is closed forever (design 0049 discipline rule 1): text,
        reasoning, tool, file-change, custom. Tools are discriminated by
        tool.name, not by part type.
      required: [type]
      properties:
        type:
          type: string
          enum: [text, reasoning, tool, file-change, custom]
        id:
          type: string
        text:
          type: string
        reasoning:
          type: string
        tool:
          $ref: "#/components/schemas/ToolPart"
        fileChange:
          $ref: "#/components/schemas/FileDiff"
        custom:
          $ref: "#/components/schemas/CustomPart"
    ToolPart:
      type: object
      description: Every tool call (bash, edit, read, subagent...) is a ToolPart
        discriminated by name. Input/Output are raw JSON — tool schemas are
        open-ended.
      required: [name]
      properties:
        callId:
          type: string
        name:
          type: string
        input:
          description: Raw tool input JSON
        output:
          description: Raw tool output JSON
        state:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, running, completed, error]
            error:
              type: string
            startedAt:
              type: string
              format: date-time
            completedAt:
              type: string
              format: date-time
    FileDiff:
      type: object
      description: Unified-diff payload of a file-change part (diff text is
        authoritative — design 0049 discipline rule 4).
      required: [path, status, patch]
      properties:
        path:
          type: string
        oldPath:
          type: string
          description: Previous path for renames
        status:
          type: string
          enum: [added, modified, deleted, renamed]
        patch:
          type: string
          description: Unified diff text
        additions:
          type: integer
        deletions:
          type: integer
    CustomPart:
      type: object
      description: Pressure-relief valve for extension-defined semantics.
        Required kind discriminator keeps future agent extensions renderable.
      required: [kind]
      properties:
        kind:
          type: string
        data:
          description: Raw JSON payload
    ContractEvent:
      type: object
      description: |
        A pkg/session streaming Event (US-65.8 shapes, retained for SDK
        typing). Not delivered on /session-events — that channel is
        platform-events-only as of US-69.11; session-state consumers read
        /workspaces/{id}/contract-events (raw ABI StreamFrames). type
        selects which fields are meaningful; the rest omit.
      required: [type]
      properties:
        type:
          type: string
          enum: [session.status, session.updated, message.start, message.end,
                 part.start, part.delta, part.end, input.request,
                 input.resolved, error]
        timestamp:
          type: string
          format: date-time
        sessionId:
          type: string
        messageId:
          type: string
        partId:
          type: string
        status:
          type: string
        session:
          $ref: "#/components/schemas/SessionSummary"
        message:
          $ref: "#/components/schemas/Message"
        part:
          $ref: "#/components/schemas/Part"
        delta:
          type: string
        input:
          $ref: "#/components/schemas/InputRequest"
        error:
          $ref: "#/components/schemas/SessionError"
    InputRequest:
      type: object
      description: |
        The unified pending-input shape carried on input.request /
        input.resolved contract events — "the agent needs a human"
        (design 0049 §4.5). Question-specific fields apply when kind is
        question; permission-specific fields when kind is permission.
      required: [id, kind]
      properties:
        id:
          type: string
        sessionId:
          type: string
        rootSessionId:
          type: string
          description: Root session for subtask-routed prompts
        kind:
          type: string
          enum: [question, permission]
        question:
          type: string
        header:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/InputOption"
        multiple:
          type: boolean
        custom:
          type: boolean
          description: Whether free-text answers are accepted
        permission:
          type: string
          description: Permission action (e.g. bash, edit)
        patterns:
          type: array
          items:
            type: string
          description: Glob patterns a permission applies to
        always:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
          description: Open-ended extension data
        tool:
          $ref: "#/components/schemas/ToolRef"
    InputOption:
      type: object
      required: [label]
      properties:
        label:
          type: string
        description:
          type: string
    ToolRef:
      type: object
      description: Identifies the tool call that triggered an InputRequest.
      properties:
        messageId:
          type: string
        callId:
          type: string
    SessionSummary:
      type: object
      description: The session fields carried on session.updated contract
        events (contextUsage.used is the live occupancy numerator;
        ModelInfo.contextWindow denominates it).
      required: [id]
      properties:
        id:
          type: string
        title:
          type: string
        parentId:
          type: string
        contextUsage:
          type: object
          required: [used]
          properties:
            used:
              type: integer
              format: int64
            window:
              type: integer
              format: int64
    SessionError:
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
    Cost:
      type: object
      description: Display-only token/cost data (never billing — cgroup-based).
      properties:
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        reasoningTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        cacheWriteTokens:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
        costUsd:
          type: number
    ModelRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
        provider:
          type: string
    CreateSecretRequest:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[a-z0-9._-]+$'
          description: Lowercase alphanumeric, dots, underscores, hyphens only. Must not start with dot or hyphen.
        type:
          type: string
          enum: [llm-provider, ssh-key, git-credential, secret-file, env-secret]
        value:
          type: string
          description: Plaintext value (encrypted before storage)
        metadata:
          type: object
          description: Arbitrary metadata JSON
    UpdateSecretRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
        metadata:
          type: object
    SecretResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [llm-provider, ssh-key, git-credential, secret-file, env-secret]
        metadata:
          type: object
        globalDefault:
          type: boolean
          description: Whether the secret applies to all workspaces by default; always present (no omitempty).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecretBinding:
      type: object
      properties:
        secretId:
          type: string
        workspaceId:
          type: string
        createdAt:
          type: string
          format: date-time
    SetBindingsRequest:
      type: object
      required: [secretIds]
      properties:
        secretIds:
          type: array
          items:
            type: string
    BindingsResponse:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/BoundSecret"
    BoundSecret:
      type: object
      properties:
        secretId:
          type: string
        name:
          type: string
        type:
          type: string
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
        action:
          type: string
        secretId:
          type: string
          nullable: true
        workspaceId:
          type: string
          nullable: true
        metadata:
          type: object
        timestamp:
          type: string
          format: date-time
    SettingsResponse:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: true
        schemaVersion:
          type: string
    SettingsSchemaResponse:
      type: object
      properties:
        schemaVersion:
          type: string
        settings:
          type: array
          items:
            type: object
            description: Setting definition with key, type, default, description
    # --- US-62.1: New schemas ---
    QueuedMessage:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        session_id:
          type: string
        workspace_id:
          type: string
        enqueued_at:
          type: string
          format: date-time
        retry_count:
          type: integer
    ModelListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelItem"
        currentModel:
          type: string
    ModelItem:
      type: object
      properties:
        id:
          type: string
        providerID:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        tier:
          type: string
        freeTier:
          type: boolean
        selected:
          type: boolean
    AgentRole:
      type: object
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [platform, org]
        orgId:
          type: string
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        extends:
