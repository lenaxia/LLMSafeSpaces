  /me/workflows/{id}/runs:
    post:
      tags: [workflows]
      summary: Start a workflow run
      description: |
        Accepted asynchronously (202). Poll `GET /me/runs/{runId}` for status.
        `workspaceId` is required unless the workflow defines `targetWorkspaceId`.
        A concurrent run of the same workflow returns 409 with `Retry-After: 30`.
      operationId: runWorkflow
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  description: Must satisfy the workflow's inputSchema
                workspaceId:
                  type: string
                  description: Target workspace (required when the workflow has no targetWorkspaceId)
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run of this workflow is already in flight
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
