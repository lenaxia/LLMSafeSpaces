openapi: "3.0.3"
info:
  title: LLMSafeSpaces API
  description: |
    LLMSafeSpaces is a Kubernetes-first platform for running AI agents securely in isolated sandboxes.
    Every sandbox runs `opencode serve` as a persistent HTTP server with a PVC-backed persistent workspace.
  version: "0.7.0"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
    description: API v1 base path
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: auth
    description: Authentication and API key management
  - name: workspaces
    description: Workspace lifecycle management
  - name: sessions
    description: Session management and proxy
  - name: secrets
    description: Secret management (Epic 10)
  - name: settings
    description: Admin and user settings
  - name: credentials
    description: Provider credentials, agent roles, and prompts
  - name: mcp
    description: External MCP server management (Epic 53)
  - name: orgs
    description: Organizations — invitations, policies, audit, SSO config
  - name: imageFactory
    description: Workspace image configuration (Epic 46)
  - name: admin
    description: Platform-admin operations (orgs, users, relay, email, platform info)
  - name: workflows
    description: Workflow definitions, runs, and node runs (Epic 64)
  - name: triggers
    description: Workflow/routine triggers — cron and webhook sources (Epic 64)
  - name: passkeys
    description: WebAuthn passkey ceremonies and account credential management (Epic 59)
  - name: usage
    description: Usage metering and quota (feature-gated)
  - name: account
    description: Account management (key rotation, password)
  - name: health
    description: Health and readiness probes
paths:
  # --- Auth ---
  /auth/config:
    get:
      tags: [auth]
      summary: Get auth configuration
      description: Public endpoint returning feature flags (registration enabled, OIDC, instance name).
      security: []
      operationId: getAuthConfig
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (clears session cookie)
      security: []
      operationId: logout
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      tags: [auth]
      summary: Get current user info
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/api-keys:
    post:
      tags: [auth]
      summary: Create an API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created (secret returned only on creation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [auth]
      summary: List API keys
      operationId: listApiKeys
      responses:
        "200":
          description: List of API keys (secrets stripped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/api-keys/{id}:
    delete:
      tags: [auth]
      summary: Delete an API key
      operationId: deleteApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: API key deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  # --- Workspaces ---
  /workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workspaces/{id}:
    get:
      tags: [workspaces]
      summary: Get a workspace
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [workspaces]
      summary: Rename a workspace
      operationId: renameWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "204":
          description: Workspace renamed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [workspaces]
      summary: Delete a workspace
      operationId: deleteWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Workspace deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/dev-preview:
    put:
      tags: [workspaces]
      summary: Toggle the dev-preview tunnel (Epic 66)
      description: Enables or disables the authenticated HTTP/WS tunnel for viewing in-workspace dev servers.
      operationId: setDevPreview
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether to enable dev preview.
      responses:
        "204":
          description: Dev preview setting updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/dev-preview/{port}:
    get:
      tags: [workspaces]
      summary: Dev preview proxy (Epic 66)
      description: >
        Proxied HTTP/WS tunnel to a dev server running on localhost inside the workspace pod.
        Returns the dev server's response (HTML, JS, WebSocket HMR) — not JSON.
        Requires dev preview to be enabled (PUT /workspaces/{id}/dev-preview).
        Authenticated to the workspace owner only via session cookie or Bearer header.
      operationId: devPreviewProxy
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: port
          in: path
          required: true
          schema:
            type: integer
            minimum: 1024
            maximum: 65535
          description: The localhost port the dev server is listening on.
        - name: path
          in: path
          required: false
          schema:
            type: string
          description: The path on the dev server (defaults to /).
      responses:
        "200":
          description: The proxied dev server response (content type varies).
        "400":
          description: Invalid or denied port.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Dev preview not enabled, workspace not active, or globally disabled.
  /workspaces/{id}/status:
    get:
      tags: [workspaces]
      summary: Get workspace status
      operationId: getWorkspaceStatus
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/activate:
    post:
      tags: [workspaces]
      summary: Activate a workspace (resume if suspended, suspend others if at limit)
      operationId: activateWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateWorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/suspend:
    post:
      tags: [workspaces]
      summary: Suspend a workspace (pod deleted, PVC retained)
      operationId: suspendWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "202":
          description: Suspend initiated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/refresh-compute:
    post:
      tags: [workspaces]
      summary: Refresh workspace compute (re-sync resource defaults and rebuild pod for latest image version)
      operationId: refreshWorkspaceCompute
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "202":
          description: Refresh initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshWorkspaceResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/restart:
    post:
      tags: [workspaces]
      summary: Restart a workspace (bumps restartGeneration, controller rebuilds the pod)
      description: |
        Declarative recovery from Failed phase or force-restart from Active.
        Idempotent at the spec layer — bumps spec.restartGeneration so the
        controller observes the change and transitions back through Pending.
      operationId: restartWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "202":
          description: Restart initiated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/agent/reload:
    post:
      tags: [workspaces]
      summary: Reload the agent process without restarting the pod
      description: |
        Disposes the current opencode process and starts a fresh one, re-reading
        agent-config.json. Useful for picking up credential changes without a
        full pod restart (~22s). The workspace stays Active throughout.
      operationId: reloadAgent
      x-feature-gated: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "202":
          description: Agent reload initiated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/models:
    get:
      tags: [workspaces]
      summary: List available models for a workspace
      operationId: listWorkspaceModels
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/model:
    put:
      tags: [workspaces]
      summary: Set the workspace's default model
      operationId: setWorkspaceModel
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  description: Model ID (e.g. "claude-sonnet-4-20250514")
      responses:
        "204":
          description: Model set
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/prompt:
    get:
      tags: [workspaces]
      summary: Get the workspace-level system prompt override
      operationId: getWorkspacePrompt
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [workspaces]
      summary: Set the workspace-level system prompt override
      operationId: setWorkspacePrompt
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
      responses:
        "204":
          description: Prompt set
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/agent-role:
    get:
      tags: [workspaces]
      summary: Get the workspace's assigned agent role
      operationId: getWorkspaceRole
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Agent role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [workspaces]
      summary: Set the workspace's agent role
      operationId: setWorkspaceRole
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
      responses:
        "204":
          description: Role set
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [workspaces]
      summary: Clear the workspace's agent role (inherit from org/platform)
      operationId: clearWorkspaceRole
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: Role cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/effective-agent-role:
    get:
      tags: [workspaces]
      summary: Get the effective agent role with inheritance chain
      operationId: getEffectiveWorkspaceRole
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Effective agent role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveAgentRole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Sessions ---
  /workspaces/{id}/sessions:
    get:
      tags: [sessions]
      summary: List workspace sessions
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/alerts:
    get:
      tags: [sessions]
      summary: List persisted hung-session alerts (D6)
      description: >
        D6 (#998) escalation records for a workspace — one per published
        notify-only workspace.alert/session_hung event, newest-first,
        within a 24h retention window. Survives SSE disconnects; the
        reconnecting clients and workflow surfaces use it to recover
        missed alerts.
      operationId: listWorkspaceAlerts
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum alerts to return.
      responses:
        "200":
          description: Persisted alerts (may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionAlert"
        "400":
          description: Invalid limit
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/new:
    post:
      tags: [sessions]
      summary: Create a new session (ensures workspace is active)
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Session created or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsureSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/active:
    get:
      tags: [sessions]
      summary: Get active sessions for a workspace
      operationId: getActiveSessions
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workspaces/{id}/sessions/{sessionId}/title:
    put:
      tags: [sessions]
      summary: Rename a session
      operationId: renameSession
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
      responses:
        "204":
          description: Session renamed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # --- Proxy (to opencode serve) ---
  /workspaces/{id}/sessions/{sessionId}/message:
    post:
      tags: [sessions]
      summary: Send a message to the agent (synchronous — blocks until LLM responds)
      description: |
        Proxies to opencode's `POST /session/:id/message`. Blocks until the LLM
        produces a complete response. For long prompts, consider using the async
        prompt endpoint instead.
      operationId: sendMessage
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
        - name: verbose
          in: query
          description: "Accepted for backwards compatibility; ignored. Patch-part stripping was removed in Epic 65 — all parts pass through unfiltered."
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The message text to send to the agent
                model:
                  $ref: "#/components/schemas/ModelSelector"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            Invalid request — including a `files` array (Epic 68): this
            synchronous route proxies the body verbatim and rejects file
            references explicitly with
            `{"error": "files not supported on this route; use /prompt"}`.
            Use the async prompt route instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Model selector not allowed by organization policy
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [sessions]
      summary: Get message history for a session
      operationId: getHistory
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
        - name: verbose
          in: query
          description: "Accepted for backwards compatibility; ignored. Patch-part stripping was removed in Epic 65 — all parts pass through unfiltered."
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: |
            Page size (messages returned). Values above 200 are capped to 200;
            non-positive or non-numeric values are rejected with 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: |
            Cursor for back-pagination. Pass the `X-Next-Cursor` value from the
            previous page to fetch older messages. Omit to fetch the newest page.
          schema:
            type: string
      responses:
        "200":
          description: |
            Message history page (newest-first ordering within a page). The
            `X-Next-Cursor` response header, when present, is the cursor for the
            next (older) page; its absence means the beginning of the session
            was reached.
          headers:
            X-Next-Cursor:
              description: Cursor for the next (older) page. Absent when there are no older messages.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/{sessionId}/prompt:
    post:
      tags: [sessions]
      summary: Send an async prompt (returns immediately, results via SSE)
      description: |
        Accepts a prompt composed of text parts and returns immediately
        (202); the agent's reply arrives on the workspace SSE stream.
        Optional `files` (Epic 68) references previously uploaded files:
        the API validates each path against the upload namespace
        (`/workspace/uploads/<uuid>-…`, max 10, no duplicates) and
        appends the v1 attachment manifest to the dispatched text — the
        caller's `parts` text is never mutated client-side. Composition
        is idempotent: a retried `clientMessageID` re-dispatches exactly
        one manifest.
      operationId: sendPromptAsync
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  description: Text parts of the prompt (concatenated in order)
                  items:
                    type: object
                    required: [type, text]
                    properties:
                      type:
                        type: string
                        enum: [text]
                      text:
                        type: string
                files:
                  type: array
                  maxItems: 10
                  description: |
                    Paths returned by the upload endpoint
                    (`POST /workspaces/{id}/uploads`). The API composes the
                    v1 attachment manifest into the dispatched text.
                    Duplicates, empty entries, or paths outside
                    `/workspace/uploads/<uuid>-` are rejected with 400.
                  items:
                    type: string
                    pattern: '^/workspace/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-'
                clientMessageID:
                  type: string
                  description: Caller-chosen idempotency key; a retry with the same value re-dispatches the originally accepted text exactly once
                model:
                  $ref: "#/components/schemas/ModelSelector"
      responses:
        "202":
          description: Prompt accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Model selector not allowed by organization policy
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/{sessionId}:
    get:
      tags: [sessions]
      summary: Get session details
      operationId: getSession
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session details from opencode
          content:
            application/json:
              schema:
                type: object
                description: Opencode session object (schema tracks upstream)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      summary: Delete a session and its children
      description: |
        Deletes a session by proxying DELETE /session/:id to the workspace's
        opencode agent. The session and all child sessions are removed from
        both opencode and the session_index. After a successful delete, an SSE
        `session.status` event with `status: "deleted"` is published for
        multi-tab consistency.
      operationId: deleteSession
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session deleted successfully
        "400":
          description: Invalid session ID (path traversal characters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Workspace is not active (suspended or transitioning)
  /workspaces/{id}/sessions/{sessionId}/abort:
    post:
      tags: [sessions]
      summary: Abort the current agent operation
      operationId: abortSession
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Abort acknowledged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/contract-events:
    get:
      tags: [sessions]
      summary: The contract event stream (design 0055 S3/D1-B, US-69.10)
      description: |
        Server-sent events of raw ABI StreamFrames (protojson, camelCase —
        matches the generated TS types): a stamped snapshot first
        (`{"snapshot":{"atSeq":"S",...}}`), then sequenced events
        (`{"event":{"seq":"N",...}}`). Client rule: snapshot@S replaces
        state and sets seq=S; apply events in order, discard seq ≤ S.
        One upstream pod connection per workspace while subscribers are
        attached; reconnect delivers a fresh snapshot. A named
        `event: resync` means frames were dropped — re-subscribe.
        Requires AGENTD_STATE_AUTHORITY (501 otherwise).
      operationId: contractEvents
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: text/event-stream of ABI StreamFrames
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Requires AGENTD_STATE_AUTHORITY (D4 single regime)
  /workspaces/{id}/sessions/{sessionId}/actions:
    post:
      tags: [sessions]
      summary: Perform a typed session action (design 0055 M1 op 5)
      description: |
        Discriminated union — exactly one member per request:
        `{"interrupt":{}}`, `{"switchModel":{"model":{"id":...,"provider":...}}}`,
        `{"switchAgent":{"agentId":...}}`,
        `{"answerQuestion":{"inputId":...,"optionIds":[...],"customText":...}}`,
        `{"compact":{}}`. The path's sessionId is authoritative over any body
        value. Requires AGENTD_STATE_AUTHORITY (501 with a not_supported
        capability body otherwise); actions the pod's capability report does
        not declare return 501 not_supported.
      operationId: sessionAction
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: The action union (one member per request).
      responses:
        "200":
          description: The typed ActionResult for the executed verb
        "400":
          description: Malformed union or missing per-verb fields
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Per-session rate limit exceeded
        "501":
          description: Flag off (requires AGENTD_STATE_AUTHORITY) or the action is not declared in the pod's capability report
  /workspaces/{id}/sessions/{sessionId}/queue:
    post:
      tags: [sessions]
      summary: Enqueue a message for a busy session
      description: |
        When the session is busy (processing a turn), the message is queued in Redis
        and drained automatically once the session goes idle. If the session is
        already idle, the message is sent immediately. Returns a queue message ID.
      operationId: enqueueMessage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 100000
                  description: Message text to enqueue
                files:
                  type: array
                  maxItems: 10
                  description: |
                    Paths returned by the upload endpoint
                    (`POST /workspaces/{id}/uploads`, Epic 68). The API
                    composes the v1 attachment manifest into the enqueued
                    text once (compose-once; retries never double-append).
                    Same validation as the prompt route: duplicates, empty
                    entries, or paths outside `/workspace/uploads/<uuid>-`
                    are rejected with 400.
                  items:
                    type: string
                    pattern: '^/workspace/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-'
                clientMessageID:
                  type: string
                  description: Caller-chosen idempotency key; a retry with the same value returns the originally accepted entry
      responses:
        "202":
          description: Message enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageID:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [sessions]
      summary: List queued messages for a session
      operationId: listQueue
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Queued messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueuedMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/{sessionId}/queue/{messageId}:
    delete:
      tags: [sessions]
      summary: Dismiss a queued message
      operationId: dismissQueuedMessage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Message dismissed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/sessions/{sessionId}/seen:
    put:
      tags: [sessions]
      summary: Mark a session as seen (clears unread state)
      operationId: markSessionSeen
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session marked as seen
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{id}/session-events:
    get:
      tags: [sessions]
      summary: SSE stream of platform events for the workspace
      description: |
        Server-Sent Events stream. Not usable by generated SDK clients — use
        language-specific SSE libraries (EventSource in browsers, httpx-sse in Python, etc.).
        Content-Type: text/event-stream.

        Platform events only (US-69.11): `workspace.phase`, `workspace.alert`,
        `queue.update`, and `agent_died`. Agent-derived session state no
        longer travels here — session-state consumers subscribe to
        /workspaces/{id}/contract-events instead (raw ABI StreamFrames: a
        stamped snapshot, then sequenced events).
      operationId: streamEvents
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "Newline-delimited SSE events"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Agent Input Requests (Epic 16) ---
  /workspaces/{id}/question:
    get:
      tags: [sessions]
      summary: List pending questions from the agent
      description: |
        Proxies to the workspace pod. Questions originate from the agent
        (opencode) when it needs user input. Response schema tracks upstream.
      operationId: listQuestions
      x-opencode-proxy: true
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Pending questions
