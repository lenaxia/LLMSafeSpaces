  # --- Queue retry (D3 #907) ---
  /workspaces/{id}/sessions/{sessionId}/queue/{messageId}/retry:
    post:
      tags: [sessions]
      summary: Retry a failed queued message
      description: Targets error entries only; 501 when the durable outbox is not wired.
      operationId: retryQueueMessage
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SessionId"
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Retry scheduled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Entry not found (or not an error entry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Queue retry requires the outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # --- Bulk agent reload ---
  /users/me/agents/reload:
    post:
      tags: [workspaces]
      summary: Reload the agent in every workspace pending reload (NDJSON stream)
      description: |
        Streams one JSON object per line (application/x-ndjson): per-workspace
        outcomes (`{workspaceId, disposed, drained, lastDisposedAt}` or
        `{workspaceId, error:{code,message}}`) and a final summary line
        (`{summary:{total,succeeded,failed,durationMs}}`). Workspaces are
        discovered server-side. `drain=true` waits for busy sessions up to
        `drainTimeoutSeconds` (1..600, default 300).
      operationId: bulkReloadAgents
      parameters:
        - name: drain
          in: query
          schema:
            type: boolean
        - name: drainTimeoutSeconds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 600
            default: 300
      responses:
        "200":
          description: NDJSON event stream
          content:
            application/x-ndjson:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  # --- Stripe webhook (public — Stripe signature is the credential) ---
  /webhooks/stripe:
    post:
      tags: [account]
      summary: Stripe webhook receiver
      security: []
      description: |
        Authenticated by the `Stripe-Signature` header (HMAC of the raw body).
        Handles checkout.session.completed, invoice.paid,
        invoice.payment_failed, customer.subscription.updated, and
        customer.subscription.deleted; unknown types are acknowledged with
        200 ok.
      operationId: receiveStripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        "200":
          description: Processed (or duplicate, or unknown-but-acknowledged type)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, duplicate]
        "400":
          description: Malformed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Recording or processing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Stripe webhook processing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
