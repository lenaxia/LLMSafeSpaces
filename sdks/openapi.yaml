    post:
      tags: [triggers]
      summary: Create a trigger
      description: |
        Routine mode: `workspaceId` + `prompt` (agent turn per fire).
        Workflow mode: `workflowId` (DAG run per fire). Exactly one of the two.
        `memoryMode: last_result` requires `captureMode: full`. Cron sources
        require `sourceConfig.expr`. Webhook triggers return their URL; the
        HMAC secret is obtained via rotate-secret.
      operationId: createTrigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerCreateRequest"
      responses:
        "201":
          description: |
            Trigger created. Webhook-source triggers respond with
            `{"trigger": ..., "webhookUrl": ...}`; other sources return the
            bare Trigger object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Trigger"
                  - type: object
                    properties:
                      trigger:
                        $ref: "#/components/schemas/Trigger"
                      webhookUrl:
                        type: string
                        example: /api/v1/hooks/0b6bd7e2-...
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
