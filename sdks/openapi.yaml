        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [credentials]
      summary: Delete an org credential (org admin, idempotent)
      description: Returns 204 even when the credential does not exist.
      operationId: deleteOrgCredential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted (or already absent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orgs/{id}/credentials/{credID}/models:
    get:
      tags: [credentials]
      summary: Probe models reachable via an org credential (org admin)
      operationId: probeOrgCredentialModels
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Probe result (200 with `warning` on probe failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orgs/{id}/credentials/{credID}/auto-apply:
    post:
      tags: [credentials]
      summary: Enable auto-apply for an org credential (org admin)
      description: No request body; priority is fixed at 5.
      operationId: enableOrgCredentialAutoApply
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Enabled (empty body)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [credentials]
      summary: List org auto-apply rules (org admin)
      description: |
        Returns ALL org rules (not just this credential's). Note: the wire
        keys are PascalCase (`CredentialID`, `TargetType`, `TargetID`,
        `Priority`).
      operationId: listOrgCredentialAutoApply
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rules (bare array)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    CredentialID:
                      type: string
                    TargetType:
                      type: string
                    TargetID:
                      type: string
                      nullable: true
                    Priority:
                      type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [credentials]
      summary: Disable auto-apply for an org credential (org admin)
      operationId: disableOrgCredentialAutoApply
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  # --- Org policies ---
  /orgs/{id}/policies:
    get:
      tags: [orgs]
      summary: List org policies (org admin)
      operationId: listOrgPolicies
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Policy list (bare array; values are raw JSON of varying type per key)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orgs/{id}/policies/{key}:
    put:
      tags: [orgs]
      summary: Set an org policy (org admin; Business+ plan)
      description: |
        The request body IS the raw JSON policy value (a bare scalar/array/
        object — not an envelope). Valid keys and value types: allowed_models
        (string[]), allowed_providers (string[]), max_workspaces_per_member
        (int), max_active_workspaces_per_member (int), sys_prompt_org
        (string <= 10000), allow_user_prompt (bool), allow_user_mcp_servers
        (bool), max_mcp_servers_per_workspace (int), default_runtime
        (string), allowed_image_configs (string[]).
      operationId: setOrgPolicy
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          description: Feature not included in the org's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [orgs]
      summary: Reset an org policy to default (org admin; Business+ plan)
      operationId: deleteOrgPolicy
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          description: Feature not included in the org's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # --- Org prompt & agent roles ---
  /orgs/{id}/prompt:
    get:
      tags: [credentials]
      summary: Read the org system prompt (org member)
      operationId: getOrgPrompt
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Org prompt
          content:
            application/json:
              schema:
                type: object
                required: [prompt, allowUserPrompt]
                properties:
                  prompt:
                    type: string
                  allowUserPrompt:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [credentials]
      summary: Set the org system prompt (org admin; partial)
      operationId: setOrgPrompt
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  maxLength: 10000
                allowUserPrompt:
                  type: boolean
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orgs:
    get:
      tags: [orgs]
      summary: List organizations the caller can see
      operationId: listOrgs
      responses:
        "200":
          description: Organization list (bare array, unpaginated; items include the caller's userRole)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [orgs]
      summary: Create an organization (platform admin only)
      description: |
        The owner is resolved by `ownerEmail` and becomes the first admin.
        The owner must not already belong to another organization.
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Created (memberCount = 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          description: Validation failed (`details` maps field → message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slug already in use, or owner already in another organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{id}:
    get:
      tags: [orgs]
      summary: Get an organization (member scope)
      operationId: getOrg
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization (includes caller's userRole and memberCount)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [orgs]
      summary: Update organization name/slug (org admin)
      description: Partial update — omitted fields keep existing values.
      operationId: updateOrg
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [orgs]
      summary: Soft-delete an organization (org admin)
      description: Workspaces become frozen; the organization is not hard-deleted.
      operationId: deleteOrg
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orgs/{id}/workspaces:
    get:
      tags: [orgs]
      summary: List the organization's workspaces (member scope)
      operationId: listOrgWorkspaces
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: limit
          in: query
