      operationId: getImageFactoryCatalog
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageFactoryCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /image-factory/configs:
    get:
      tags: [imageFactory]
      summary: List image configs visible to the caller
      operationId: listImageConfigs
      responses:
        "200":
          description: Config list
          content:
            application/json:
              schema:
                type: object
                required: [configs]
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [imageFactory]
      summary: Create a member-scope image config and start its build
      description: |
        422 for name/selection/base validation failures and known-failure
        blocks; 503 when the build dispatcher is not wired or dispatch fails.
      operationId: createImageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageConfigRequest"
      responses:
        "201":
          description: Config created (build dispatched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Validation failed (unknown base/version, invalid selection, known-failure blocklist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Build dispatcher unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /image-factory/configs/{hash}:
    get:
      tags: [imageFactory]
      summary: Get an image config by hash
      operationId: getImageConfig
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [imageFactory]
      summary: Delete an image config (owner or admin)
      description: 409 when a build is in flight for the config.
      operationId: deleteImageConfig
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Build in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [imageFactory]
      summary: Rename an image config (owner or admin)
      operationId: renameImageConfig
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 64
                  minLength: 1
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Empty or over-length name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /image-factory/resolve/{hash}:
    get:
      tags: [imageFactory]
      summary: Resolve a schematic hash to its selection and built versions
      description: >
        Public content-address lookup: returns the extension selection a
        schematic hash names, its base name, and every base version with a
        succeeded or in-flight build under it (newest first). Any
        authenticated user may resolve any hash — hashes address
        platform-wide artifacts and reveal only catalog extension IDs.
      operationId: resolveImageHash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: '^s-[0-9a-f]{16}$'
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageHashResolution"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Malformed hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
