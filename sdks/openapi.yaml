                type: array
                items:
                  $ref: "#/components/schemas/ProviderCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [credentials]
      summary: Create an org credential (org admin)
      description: |
        On auto-bind failure the credential is still created (201) with a
        `bindWarning` field.
      operationId: createOrgCredential
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderCredentialRequest"
      responses:
        "201":
          description: Credential created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /orgs/{id}/credentials/{credID}:
    put:
      tags: [credentials]
      summary: Update an org credential (org admin, partial)
      operationId: updateOrgCredential
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: credID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderCredentialRequest"
      responses:
        "200":
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredential"
        "400":
