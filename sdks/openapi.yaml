        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/passkeys/{id}:
    delete:
      tags: [passkeys]
      summary: Delete a passkey
      description: Fails with 409 when attempting to delete the last remaining passkey.
      operationId: deletePasskey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete the last passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/passkeys/recovery-codes/regenerate:
    post:
      tags: [passkeys]
      summary: Regenerate recovery codes (invalidates all previous codes)
      operationId: regenerateRecoveryCodes
      responses:
        "200":
          description: New codes (shown exactly once)
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/passkeys/enroll/begin:
    post:
      tags: [passkeys]
      summary: Begin enrolling an additional passkey on the authenticated account
      operationId: passkeyEnrollBegin
      responses:
        "200":
          description: Creation options + session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBeginRegistration"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/passkeys/enroll/finish:
    post:
      tags: [passkeys]
      summary: Finish enrolling an additional passkey
      operationId: passkeyEnrollFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken, response]
              properties:
                sessionToken:
                  type: string
                name:
                  type: string
                response:
                  type: object
                  description: Browser PublicKeyCredential attestation response JSON
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Credential does not belong to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # --- Org SSO (Epic 43, public + org-admin) ---
  /auth/sso/domains:
    get:
      tags: [auth]
      summary: List verified SSO domains (public, for login-page routing)
      security: []
      operationId: listSsoDomains
      responses:
        "200":
          description: Verified domains across all orgs (empty array when none)
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items:
                      $ref: "#/components/schemas/SsoDomain"
        "500":
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/sso/{orgSlug}/start:
    get:
      tags: [auth]
      summary: Begin the SSO PKCE login flow
      security: []
      description: |
        302 redirect to the org's IdP authorize URL with a PKCE code challenge.
        Sets a signed, HttpOnly state cookie (`lsp_sso_state`, 10-minute TTL).
        All failure modes also 302 — to the frontend login page with an
        `?sso=<reason>` query parameter (provisioning_disabled, suspended,
        email_unverified, not_configured, state_invalid, config_error, error).
      operationId: startSsoLogin
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to IdP (or to the frontend with an error reason)
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
  /auth/sso/{orgSlug}/callback:
    get:
      tags: [auth]
      summary: Complete the SSO PKCE login flow
      security: []
      description: |
        Verifies state cookie + IdP code, enforces email_verified, resolves
        user + role + membership, then 302s to the frontend with
        `?sso=success` and sets the session cookie. Failures 302 to the
        login page with `?sso=<reason>`.
      operationId: ssoLoginCallback
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend; session cookie set on success
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
  /orgs/{id}/sso:
    get:
      tags: [auth]
      summary: Read the org's SSO configuration (org admin)
      description: Returns a default empty config object when none exists.
      operationId: getOrgSso
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: SSO config (secret never returned — hasSecret flag only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSsoConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [auth]
      summary: Upsert the org's SSO configuration (org admin)
      description: |
        Empty `clientSecret` leaves the existing secret unchanged. The client
        secret is encrypted at rest with the server KEK. Returns the stored
        config; if a live config reload fails the response degrades to
        `{"status":"ok"}`.
      operationId: upsertOrgSso
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrgSsoRequest"
      responses:
        "200":
          description: Stored config (or degraded ok ack)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrgSsoConfig"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Server key not configured for secret encryption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [auth]
      summary: Remove the org's SSO configuration (org admin)
      operationId: deleteOrgSso
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orgs/{id}/sso/domains/{domain}/verify:
    post:
      tags: [auth]
      summary: On-demand DNS verification of a claimed domain (org admin)
      description: |
        Expects a TXT record ` _llmsafespaces-verify.<domain> = <verificationToken>`.
        Note: the response body uses PascalCase keys (`Domain`, `Verified`).
      operationId: verifySsoDomain
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Domain:
                    type: string
                  Verified:
                    type: boolean
        "400":
          description: Domain not claimed by this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No SSO config for this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No verification token — rotate first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: DNS record mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{id}/sso/verification-token/rotate:
    post:
      tags: [auth]
      summary: Generate or rotate the DNS verification token (org admin)
      operationId: rotateSsoVerificationToken
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                required: [verificationToken]
                properties:
                  verificationToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Org invitations ---
  /orgs/{id}/invitations:
    get:
      tags: [orgs]
      summary: List the org's pending invitations (org member)
      operationId: listOrgInvitations
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Invitation list (bare array)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [orgs]
      summary: Create invitations (org admin)
      description: Sends invitation emails (max 100 per call, 50/hour org limit).
      operationId: createOrgInvitations
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationsRequest"
      responses:
        "201":
          description: Created invitations (bare array)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Hourly invitation limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  limit:
                    type: integer
  /orgs/{id}/invitations/{invID}:
    delete:
      tags: [orgs]
      summary: Revoke an invitation (org admin)
      operationId: deleteOrgInvitation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orgs/{id}/invitations/{invID}/resend:
    post:
      tags: [orgs]
      summary: Resend an invitation (org admin)
      description: Replaces the invitation row (new ID and expiry) and re-sends the email.
      operationId: resendOrgInvitation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Replacement invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invitation already terminal (accepted/declined/expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orgs/{id}/invitations/{invID}/verify-user:
    post:
      tags: [orgs]
      summary: Manually verify the invitee's email (org admin)
      description: |
        For invitees who cannot click email links. 422 when no account exists
        for the invitation email.
      operationId: verifyInvitationUser
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Invitation expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: No account exists for the invitation email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [no_account_for_email]
                  message:
                    type: string
  /invitations/{token}:
    get:
      tags: [orgs]
      summary: Read invitation details (public — the token is the credential)
      security: []
      operationId: getInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /invitations/{token}/accept:
    post:
      tags: [orgs]
      summary: Accept an invitation (authenticated; invitee email must match)
      operationId: acceptInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account email does not match the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already accepted/declined or already a member (of any org)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/{token}/decline:
    post:
      tags: [orgs]
      summary: Decline an invitation (authenticated)
      operationId: declineInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [declined]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Org credentials ---
  /orgs/{id}/credentials:
    get:
      tags: [credentials]
